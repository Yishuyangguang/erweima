<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高级动态活码与资源分发系统</title>
    
    <!-- 引入外部引擎与样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        primary: '#1E90FF', 
                        secondary: '#F3F4F6', 
                        dark: '#111827' 
                    },
                    boxShadow: { 
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #F8FAFC; 
            color: #333; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .drag-active { border-color: #1E90FF !important; background-color: #EBF5FF !important; }
        
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .block-animate { animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        /* 管理员权限样式隔离 */
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: flex !important; }
        body.is-admin .admin-only-block { display: block !important; }
        
        /* 拖拽排序特效 */
        .sortable-ghost { 
            opacity: 0.4; 
            background-color: #f0f9ff; 
            border: 1px dashed #1E90FF; 
        }
        
        /* 移动端 H5 底部安全区，防止被悬浮按钮遮挡 */
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 100px); }

        /* 富文本编辑器内部基础排版适配 */
        .rich-text-content b { font-weight: bold; }
        .rich-text-content i { font-style: italic; }
        .rich-text-content u { text-decoration: underline; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4" id="drop-zone">

    <!-- 顶部导航栏 -->
    <header class="w-full max-w-[1400px] flex justify-center gap-3 mb-8 flex-wrap admin-only px-4">
        <button onclick="app.setMode('text')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 active-nav">文本</button>
        <button onclick="app.setMode('url')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">网址</button>
        <button onclick="app.setMode('document')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">文档</button>
        <button onclick="app.setMode('image')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">图片</button>
        <button onclick="app.setMode('audio')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">音频</button>
        <button onclick="app.setMode('video')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">视频</button>
        <button onclick="app.setMode('form')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">表单</button>
        
        <button onclick="app.openComboEditor()" class="bg-gradient-to-r from-blue-500 to-indigo-500 px-6 py-2 rounded-full shadow-md hover:shadow-lg transition-all text-white font-semibold flex items-center">
            <i class="fas fa-cubes text-sm mr-2"></i>组合上传
        </button>

        <button onclick="app.setMode('uploaded')" class="nav-btn bg-blue-50 border border-blue-100 px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-primary font-semibold flex items-center">
            <i class="fas fa-cloud text-sm mr-2"></i>已上传
        </button>
    </header>

    <!-- PC端管理工作区 (核心修改：采用 Flex 强制锁定右侧极限宽度，左侧无限霸屏) -->
    <main class="w-full max-w-[1400px] flex flex-col lg:flex-row gap-8 admin-only px-4">
        
        <!-- 左侧编辑/任务区域占据绝对主导权 -->
        <section class="flex-1 min-w-0 flex flex-col gap-6 relative">
            <div id="input-panel" class="bg-white rounded-2xl shadow-sm p-8 relative border-2 border-dashed border-transparent transition-all">
                <div class="flex justify-between items-center mb-6" id="panel-header">
                    <h2 id="panel-title" class="text-xl font-bold text-gray-800 tracking-wide">
                        <i class="fas fa-keyboard text-primary mr-2"></i>添加文本
                    </h2>
                    <span id="panel-hint-pill" class="text-xs text-gray-400 bg-gray-100 px-3 py-1 rounded-full font-medium">支持直接拖拽资源极速解析</span>
                </div>
                
                <div id="dynamic-input-area" class="w-full min-h-[140px]"></div>
                
                <div class="flex justify-between items-center mt-6" id="panel-footer-action">
                    <p class="text-sm text-gray-400" id="panel-hint">文字长度无限制，扫码即刻展示</p>
                    <button id="btn-add-block" onclick="app.addCurrentBlock()" class="bg-primary text-white px-8 py-3 rounded-xl hover:bg-blue-600 shadow-md transition-all font-semibold">添加到内容流水线</button>
                </div>
            </div>

            <!-- 当前在线流 (卡片化网格排版：卡片已放大，取消截断) -->
            <div class="bg-white rounded-2xl shadow-sm p-8 min-h-[350px]">
                <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                    <h3 class="text-lg font-bold text-gray-800">当前在线流 (扫码可见)</h3>
                    <button onclick="app.syncToCloud()" class="bg-green-500 text-white px-5 py-2 text-sm rounded-lg hover:bg-green-600 transition-all shadow font-medium">
                        <i class="fas fa-rotate mr-1.5"></i> 发布至前端
                    </button>
                </div>
                <div id="blocks-container" class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full"></div>
            </div>
        </section>

        <!-- 右侧二维码区域：物理宽度被彻底锁死在 260px，极致紧凑迷你 -->
        <aside class="w-full lg:w-[260px] flex-shrink-0 flex flex-col gap-4 relative">
            <div class="bg-white rounded-2xl shadow-sm p-5 flex flex-col items-center sticky top-8 border border-gray-50">
                
                <!-- 精巧尺寸二维码容器 -->
                <div id="qrcode-wrapper" class="w-32 h-32 bg-white flex items-center justify-center rounded-xl mb-3 relative transition-all border border-gray-100 p-1.5">
                    <div id="qrcode" class="z-10 relative flex items-center justify-center w-full h-full"></div>
                </div>
                
                <div id="qr-desc-text" class="text-center mb-4 w-full">
                    <p class="text-[13px] text-gray-700 font-bold mb-1">此处扫描活码进入 H5 页面</p>
                    <p class="text-[11px] text-gray-400 leading-tight tracking-wide">(内容修改自动同步，图案不变)</p>
                </div>
                
                <!-- 极简双按钮，压缩在一行并列 -->
                <div class="flex gap-2 w-full">
                    <button onclick="app.generateShareLink()" class="flex-1 bg-primary text-white py-2 rounded-lg hover:bg-blue-600 shadow-sm transition-all text-[12px] font-semibold flex items-center justify-center">
                        <i class="fas fa-link mr-1"></i> 复制
                    </button>
                    <button onclick="app.downloadQR()" class="flex-1 bg-white border border-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-50 hover:text-primary transition-all text-[12px] font-semibold flex items-center justify-center shadow-sm">
                        <i class="fas fa-download mr-1"></i> 下载
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <!-- H5 游客实时预览容器 (扫码直接进入此界面) -->
    <div id="mobile-live-container" class="hidden w-full max-w-lg mx-auto bg-gray-50 min-h-screen pb-safe"></div>

    <!-- 全屏图文组合编辑器 (已升级为富文本引擎) -->
    <div id="combo-editor-modal" class="fixed inset-0 bg-gray-100 z-[150] hidden flex-col">
        <div class="h-16 bg-white shadow-sm flex items-center justify-between px-6 border-b shrink-0">
            <h2 class="text-lg font-bold text-gray-800">
                <i class="fas fa-cubes text-primary mr-2"></i>全能图文组合创作
            </h2>
            <div class="flex gap-3">
                <button onclick="app.closeComboEditor()" class="px-5 py-1.5 text-gray-600 bg-gray-100 rounded-full hover:bg-gray-200 transition-all">取消</button>
                <button onclick="app.saveCombo()" class="px-5 py-1.5 bg-primary text-white rounded-full hover:bg-blue-600 shadow transition-all font-medium">确认组合并添加</button>
            </div>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 flex flex-col items-center">
            <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-8 flex flex-col gap-6">
                
                <div class="flex flex-col gap-2">
                    <input type="text" id="combo-title" placeholder="输入大标题 (选填)" class="w-full text-2xl font-bold border-none outline-none placeholder-gray-300 focus:ring-0 px-1">
                </div>
                
                <!-- 富文本编辑器工具栏 (Toolbar) -->
                <div class="flex flex-col">
                    <div class="flex flex-wrap gap-2 items-center bg-gray-50 p-2.5 rounded-t-lg border border-b-0 border-gray-200">
                        
                        <select onchange="app.execCmd('fontName', this.value)" class="bg-white border border-gray-300 rounded px-2 py-1 text-sm outline-none text-gray-700 cursor-pointer hover:border-primary">
                            <option value="">默认字体</option>
                            <option value="SimSun">宋体</option>
                            <option value="KaiTi">楷体</option>
                            <option value="Microsoft YaHei">微软雅黑</option>
                            <option value="FangSong">仿宋</option>
                        </select>
                        
                        <select onchange="app.execCmd('fontSize', this.value)" class="bg-white border border-gray-300 rounded px-2 py-1 text-sm outline-none text-gray-700 cursor-pointer hover:border-primary">
                            <option value="">字号</option>
                            <option value="3">标准</option>
                            <option value="4">偏大</option>
                            <option value="5">大号</option>
                            <option value="6">特大</option>
                        </select>
                        
                        <div class="w-px h-5 bg-gray-300 mx-1"></div>
                        
                        <div class="flex items-center gap-1 cursor-pointer group relative" title="文字颜色">
                            <i class="fas fa-palette text-gray-500 group-hover:text-primary pl-1"></i>
                            <input type="color" onchange="app.execCmd('foreColor', this.value)" class="w-8 h-8 rounded border-none cursor-pointer p-0 bg-transparent">
                        </div>

                        <div class="w-px h-5 bg-gray-300 mx-1"></div>
                        
                        <button onmousedown="event.preventDefault(); app.execCmd('bold')" class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-200 text-gray-700 font-bold transition-all" title="加粗 (Ctrl+B)">B</button>
                        <button onmousedown="event.preventDefault(); app.execCmd('italic')" class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-200 text-gray-700 italic font-serif transition-all" title="倾斜 (Ctrl+I)">I</button>
                        <button onmousedown="event.preventDefault(); app.execCmd('underline')" class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-200 text-gray-700 underline transition-all" title="下划线 (Ctrl+U)">U</button>
                    </div>
                    
                    <div id="combo-text" contenteditable="true" class="w-full h-40 p-4 border border-gray-200 rounded-b-lg outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary overflow-y-auto bg-white text-base text-gray-800 leading-relaxed rich-text-content" placeholder="在此输入文字，可选中文字进行局部样式修改..."></div>
                </div>
                
                <div class="border-t pt-6 mt-2">
                    <div class="flex justify-between items-end mb-4">
                        <h3 class="font-semibold text-gray-700">多媒体资产与附件</h3>
                        <span class="text-xs text-gray-400">支持拖拽排序，向下滚动查看</span>
                    </div>
                    
                    <ul id="combo-items-list" class="flex flex-col gap-3 mb-4 min-h-[50px]"></ul>
                    
                    <div id="combo-drop-zone" class="relative w-full h-24 bg-blue-50/50 rounded-xl border-2 border-dashed border-blue-200 flex flex-col items-center justify-center hover:bg-blue-50 transition-all group">
                        <input type="file" id="combo-file-input" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="app.handleComboFileSelect(event)">
                        <i class="fas fa-plus-circle text-2xl text-blue-300 group-hover:text-primary transition-colors mb-1"></i>
                        <p class="text-sm text-gray-500">点击或将<span class="font-semibold text-primary"> 图片/音视频/PPT/文档 </span>拖拽至此极速上传到组合</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游客鉴权遮罩层 -->
    <div id="tourist-mask" class="fixed inset-0 bg-white/90 backdrop-blur-md z-40 flex flex-col items-center justify-center">
        <i class="fas fa-shield-alt text-6xl text-gray-300 mb-6"></i>
        <h3 class="text-2xl font-semibold text-gray-700">内容管理控制台</h3>
        <p class="text-sm text-gray-500 mt-3 text-center px-8">本后台仅供管理员访问，负责拼装内容、修改页面与更新活码。<br>若您是访客，请直接扫描二维码查看内容。</p>
        <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="mt-8 bg-primary text-white px-8 py-3 rounded-full shadow-lg hover:bg-blue-600 transition-all font-medium text-lg">验证管理员身份</button>
    </div>

    <!-- 悬浮退出按钮 -->
    <button onclick="app.logout()" id="logout-float-btn" class="admin-only fixed bottom-6 right-6 w-12 h-12 bg-red-500 text-white rounded-full shadow-xl items-center justify-center hover:bg-red-600 transition-all z-50">
        <i class="fas fa-sign-out-alt"></i>
    </button>

    <!-- 管理员登录弹窗 (纯净版，剔除冗余文字) -->
    <div id="login-modal" class="fixed inset-0 bg-black/60 z-[200] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-8 w-80 shadow-2xl transform transition-all scale-100 relative">
            <h3 class="text-xl font-bold mb-6 text-center text-gray-800">系统鉴权</h3>
            <div class="mb-5">
                <label class="block text-xs text-gray-500 mb-2 font-medium">安全校验口令</label>
                <input type="password" id="admin-pwd" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-primary/50 transition-all" placeholder="请输入密码">
            </div>
            <div class="flex gap-3">
                <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition-all font-medium">取消</button>
                <button onclick="app.login()" class="flex-1 py-2.5 bg-primary text-white rounded-lg hover:bg-blue-600 transition-all font-medium shadow-md">登录</button>
            </div>
        </div>
    </div>

    <!-- 文档与多媒体全屏预览弹窗 -->
    <div id="preview-modal" class="fixed inset-0 bg-black/85 z-[250] hidden flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="absolute top-4 right-4">
            <button onclick="app.closePreview()" class="text-white hover:text-gray-300 text-3xl">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="preview-content" class="w-11/12 h-5/6 bg-transparent rounded-xl overflow-hidden flex items-center justify-center relative"></div>
    </div>

    <!-- 核心业务逻辑脚本 -->
    <script>
        const app = {
            state: {
                currentMode: 'text', 
                blocks: [], 
                isAdmin: false,
                token: sessionStorage.getItem('adminToken') || '',
                liveUrl: window.location.origin + window.location.pathname + '?view=live',
                comboDraft: { title: '', text: '', items: [] },
                
                // 拖拽相关状态记录
                draggedItemIndex: null,
                draggedMainIndex: null,
                
                isLiveMode: false,
                // 网址双轨制状态
                urlConfig: { mode: 'live', staticUrl: '' }
            },

            configs: {
                text: { icon: 'fa-keyboard', title: '添加纯文本', hint: '支持常规段落', accept: null },
                url: { icon: 'fa-link', title: '配置网址引擎', hint: '支持静态跳转与活码分发', accept: null },
                image: { icon: 'fa-image', title: '添加独立图片', hint: '支持 png/jpg 等格式', accept: 'image/*' },
                audio: { icon: 'fa-music', title: '添加独立音频', hint: '在线流畅播放', accept: 'audio/*' },
                video: { icon: 'fa-video', title: '添加独立视频', hint: '原生UI沉浸式播放', accept: 'video/*' },
                document: { icon: 'fa-file-word', title: '添加独立文档', hint: '支持 PPT/Word 跨设备在线预览', accept: '.doc,.docx,.ppt,.pptx,.xls,.xlsx,.pdf,.wps' },
                form: { icon: 'fa-list-check', title: '添加表单', hint: '通用资料收集模版', accept: null },
                uploaded: { icon: 'fa-cloud', title: '后台资源池', hint: '可查阅/清理所有已上传资产', accept: null }
            },

            async init() {
                const urlParams = new URLSearchParams(window.location.search);
                
                if (urlParams.get('view') === 'live') {
                    this.state.isLiveMode = true;
                    document.getElementById('mobile-live-container').classList.remove('hidden');
                    document.getElementById('mobile-live-container').classList.add('flex', 'flex-col');
                    document.getElementById('tourist-mask').classList.add('hidden');
                    await this.fetchCloudConfig();
                    this.renderLiveH5();
                    return;
                }

                if (this.state.token) {
                    await this.verifyTokenSilent();
                } else {
                    this.enforceTouristMode();
                }

                this.bindGlobalDragAndDrop();
                this.updateNavUI();
                this.renderInputArea();
                
                await this.fetchCloudConfig();
                this.renderQR(); 
            },

            // ================= 身份鉴权控制 =================
            async login() {
                const pwd = document.getElementById('admin-pwd').value;
                try {
                    const res = await fetch('/api/auth', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ password: pwd }) 
                    });
                    
                    if (res.ok) {
                        this.state.token = pwd;
                        sessionStorage.setItem('adminToken', pwd);
                        document.getElementById('login-modal').classList.add('hidden');
                        this.enableAdminMode();
                    } else {
                        alert('⚠️ 鉴权失败：密码错误，请检查您的 CF 环境变量。');
                    }
                } catch (e) { 
                    alert('后端连接异常，请确认 CF Pages 部署状态'); 
                }
            },
            
            async verifyTokenSilent() {
                try {
                    const res = await fetch('/api/auth', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ password: this.state.token }) 
                    });
                    if (res.ok) {
                        this.enableAdminMode();
                    } else {
                        this.enforceTouristMode();
                    }
                } catch (e) { 
                    this.enforceTouristMode(); 
                }
            },
            
            logout() { 
                this.state.token = ''; 
                sessionStorage.removeItem('adminToken'); 
                this.enforceTouristMode(); 
            },
            
            enableAdminMode() {
                this.state.isAdmin = true; 
                document.body.classList.add('is-admin');
                document.getElementById('tourist-mask').classList.add('hidden');
                if (this.state.currentMode === 'uploaded') {
                    this.renderInputArea();
                }
            },
            
            enforceTouristMode() {
                this.state.isAdmin = false; 
                document.body.classList.remove('is-admin');
                document.getElementById('tourist-mask').classList.remove('hidden');
            },

            // ================= 云端通讯引擎 (R2 接口) =================
            async fetchCloudConfig() {
                try {
                    const res = await fetch('/api/config');
                    if (res.ok) {
                        this.state.blocks = await res.json() || [];
                        if (!this.state.isLiveMode) {
                            this.renderBlocks();
                        }
                    }
                } catch (e) {
                    console.error('配置加载失败', e);
                }
            },
            
            async syncToCloud() {
                if (!this.state.isAdmin) return;
                try {
                    const res = await fetch('/api/config', { 
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'application/json', 
                            'Authorization': `Bearer ${this.state.token}` 
                        }, 
                        body: JSON.stringify(this.state.blocks) 
                    });
                    if (res.ok) {
                        alert('🚀 全局流水线发布成功，扫码用户将立刻看到最新内容！');
                    } else {
                        alert('发布失败，请检查网络');
                    }
                } catch (e) {
                    alert('同步网络断开');
                }
            },
            
            // ================= 【极速切片与并发并发网络层引擎】 =================
            async uploadFilesConcurrent(files, progressCallback) {
                if (!this.state.isAdmin) return [];
                
                const totalSize = Array.from(files).reduce((sum, f) => sum + f.size, 0);
                const loadedMap = new Map();
                const CHUNK_SIZE = 15 * 1024 * 1024; 
                
                const uploadPromises = Array.from(files).map(async (file) => {
                    
                    if (file.size <= CHUNK_SIZE) {
                        return new Promise((resolve) => {
                            const formData = new FormData(); 
                            formData.append('file', file);
                            
                            const xhr = new XMLHttpRequest();
                            xhr.open('POST', '/api/upload', true);
                            xhr.setRequestHeader('Authorization', `Bearer ${this.state.token}`);
                            
                            xhr.upload.onprogress = (event) => {
                                if (event.lengthComputable) {
                                    loadedMap.set(file.name, event.loaded);
                                    const currentLoaded = Array.from(loadedMap.values()).reduce((a, b) => a + b, 0);
                                    const percent = Math.floor((currentLoaded / totalSize) * 100);
                                    if (progressCallback) progressCallback(percent);
                                }
                            };
                            
                            xhr.onload = () => {
                                if (xhr.status === 200) {
                                    try {
                                        resolve({ file: file, data: JSON.parse(xhr.responseText) });
                                    } catch(e) {
                                        resolve({ file: file, data: null });
                                    }
                                } else {
                                    try {
                                        const errData = JSON.parse(xhr.responseText);
                                        alert(`上传失败: ${errData.message}`);
                                    } catch(e) {}
                                    resolve({ file: file, data: null });
                                }
                            };
                            
                            xhr.onerror = () => { resolve({ file: file, data: null }); };
                            xhr.send(formData);
                        });
                        
                    } else {
                        try {
                            let res = await fetch('/api/upload/init', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.state.token}` },
                                body: JSON.stringify({ filename: file.name, mimeType: file.type || 'application/octet-stream' })
                            });
                            
                            const initData = await res.json();
                            if (!initData.success) throw new Error(initData.message || '初始化分片失败');
                            const { key, uploadId } = initData;

                            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                            const parts = [];
                            let fileLoaded = 0;

                            for (let i = 0; i < totalChunks; i++) {
                                const start = i * CHUNK_SIZE;
                                const end = Math.min(start + CHUNK_SIZE, file.size);
                                const chunk = file.slice(start, end);

                                const chunkData = await new Promise((resolve, reject) => {
                                    const xhr = new XMLHttpRequest();
                                    xhr.open('POST', `/api/upload/part?key=${encodeURIComponent(key)}&uploadId=${encodeURIComponent(uploadId)}&partNumber=${i + 1}`, true);
                                    xhr.setRequestHeader('Authorization', `Bearer ${this.state.token}`);
                                    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                                    
                                    let lastChunkLoaded = 0;
                                    xhr.upload.onprogress = (event) => {
                                        if (event.lengthComputable) {
                                            const diff = event.loaded - lastChunkLoaded;
                                            lastChunkLoaded = event.loaded;
                                            fileLoaded += diff;
                                            
                                            loadedMap.set(file.name, fileLoaded);
                                            const currentLoaded = Array.from(loadedMap.values()).reduce((a, b) => a + b, 0);
                                            const percent = Math.floor((currentLoaded / totalSize) * 100);
                                            
                                            if (progressCallback) progressCallback(percent);
                                        }
                                    };
                                    
                                    xhr.onload = () => {
                                        if (xhr.status === 200) { 
                                            resolve(JSON.parse(xhr.responseText).part); 
                                        } else { 
                                            reject(new Error(`分片 ${i+1} 云端拒收`)); 
                                        }
                                    };
                                    xhr.onerror = () => reject(new Error('分片网络中断'));
                                    xhr.send(chunk);
                                });
                                parts.push(chunkData);
                            }

                            res = await fetch('/api/upload/complete', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.state.token}` },
                                body: JSON.stringify({ key, uploadId, parts })
                            });
                            
                            const compData = await res.json();
                            if (!compData.success) throw new Error(compData.message || '合并分片失败');
                            
                            return { file: file, data: { success: true, url: compData.url, name: file.name, size: file.size } };
                            
                        } catch (e) {
                            console.error(e);
                            alert(`大文件 [${file.name}] 上传失败: \n${e.message}`);
                            return { file: file, data: null };
                        }
                    }
                });
                
                return await Promise.all(uploadPromises);
            },

                    await fetch('/api/file', {

                } catch (e) {
                    console.error('缓存清理异常', e);
                }

            escapeHtml(unsafe) { 
                return unsafe.toString()
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;"); 
            },
            
            stripHtml(html) {
                let tmp = document.createElement("DIV");
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || "";

            bindGlobalDragAndDrop() {

                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, e => { 
                        e.preventDefault(); 
                    }, false);

                dropZone.addEventListener('dragenter', (e) => {

                        if (comboUI) comboUI.classList.add('drag-active');
                    }
                }, false);
                
                dropZone.addEventListener('dragleave', (e) => { 
                    if (e.relatedTarget === null) {
                        const panel = document.getElementById('input-panel');
                        const comboUI = document.getElementById('combo-drop-zone');
                        if (panel) panel.classList.remove('drag-active');
                        if (comboUI) comboUI.classList.remove('drag-active');
                    }
                }, false);
                
                dropZone.addEventListener('drop', (e) => {
                    const panel = document.getElementById('input-panel');
                    const comboUI = document.getElementById('combo-drop-zone');
                    if (panel) panel.classList.remove('drag-active');
                    if (comboUI) comboUI.classList.remove('drag-active');

                        files = Array.from(e.dataTransfer.files);
                    } else if (e.target && e.target.files) {
                        files = Array.from(e.target.files);
                    }
                    
                    if (this.state.isAdmin && files.length > 0) {

                            this.handleComboFileSelect(safeEvent); 
                        } else {
                            this.handleMainFileSelect(safeEvent);
                        }
                    }
                }, false);

            // ================= 游客端 一键极速打包下载 =================
            async downloadAllFiles() {
                if (this.state.blocks.length === 0) {
                    return alert('当前页面没有任何内容可供下载。');
                }
                
                const btn = document.getElementById('btn-batch-download');
                if (btn) {
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> 极速预处理中...';
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder("一键下载资产包");
                    
                    let textSummary = "===== 页面内容与文本摘要 =====\n\n";
                    let fileCount = 0;
                    
                    const tasks = [];
                    const namesTracker = {}; 
                    
                    let totalTasks = 0;
                    let completedTasks = 0;

                    const addFileTask = (url, originalName) => {
                        totalTasks++;
                        tasks.push(async () => {
                            try {
                                const response = await fetch(url);
                                const blob = await response.blob();
                                
                                let safeName = originalName || `文件_${Date.now()}.bin`;
                                if (namesTracker[safeName]) {
                                    const parts = safeName.split('.');
                                    const ext = parts.length > 1 ? '.' + parts.pop() : '';
                                    safeName = `${parts.join('.')} (${namesTracker[safeName]})${ext}`;
                                    namesTracker[originalName]++;
                                } else {
                                    namesTracker[safeName] = 1;
                                }

                                folder.file(safeName, blob);
                                fileCount++;
                                completedTasks++;
                                
                                if (btn && totalTasks > 0) {
                                    const percent = Math.floor((completedTasks / totalTasks) * 50);
                                    btn.innerHTML = `<i class="fas fa-cloud-download-alt mr-2"></i> 极速拉取资源... ${percent}%`;
                                }
                            } catch (err) {
                                console.error(`文件下载失败: ${originalName}`, err);
                            }
                        });
                    };

                    this.state.blocks.forEach(block => {
                        if (block.type === 'text') {
                            textSummary += `[独立文本]\n${block.content}\n\n`;
                        }
                        if (block.type === 'url') {
                            textSummary += `[相关链接]\n${block.content}\n\n`;
                        }
                        if (['image', 'audio', 'video', 'document'].includes(block.type)) {
                            addFileTask(block.content.url, block.content.name);
                        }
                        if (block.type === 'combo') {
                            if (block.content.title || block.content.text) {
                                textSummary += `[组合: ${block.content.title || '无题'}]\n${this.stripHtml(block.content.text) || ''}\n\n`;
                            }
                            if (block.content.items && block.content.items.length > 0) {
                                block.content.items.forEach(item => {
                                    addFileTask(item.url, item.name);
                                });
                            }
                        }
                    });

                    if (textSummary.trim().length > 30) {
                        folder.file("页面文本内容摘要.txt", textSummary);
                    }

                    await Promise.all(tasks.map(t => t()));

                    if (fileCount === 0 && textSummary.trim().length <= 30) {
                        throw new Error('未找到任何可打包的文件资源');
                    }

                    const content = await zip.generateAsync({ 
                        type: "blob",
                        compression: "STORE" 
                    }, (metadata) => {
                        if (btn) {
                            const percent = 50 + Math.floor(metadata.percent / 2);
                            btn.innerHTML = `<i class="fas fa-box text-xl mr-2"></i> 极速生成压缩包中... ${percent}%`;
                        }
                    });
                    
                    saveAs(content, `全部资源打包_${new Date().getTime()}.zip`);
                    
                    if (btn) {
                        btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> 下载完成';
                        btn.classList.replace('from-blue-500', 'from-green-500');
                        btn.classList.replace('to-indigo-600', 'to-green-600');
                        setTimeout(() => {
                            btn.innerHTML = '<i class="fas fa-cloud-download-alt mr-2"></i> 一键打包下载全部内容';
                            btn.classList.replace('from-green-500', 'from-blue-500');
                            btn.classList.replace('to-green-600', 'to-indigo-600');
                        }, 3000);
                    }
                } catch (e) {
                    alert('打包下载失败，网络中断或触发浏览器跨域限制。');
                    if (btn) {
                        btn.innerHTML = '<i class="fas fa-cloud-download-alt mr-2"></i> 一键打包下载全部内容';
                    }
                }
            },

                `;
                
                const results = await this.uploadFilesConcurrent(files, (percent) => {

                });
                
                results.forEach(res => {
                    if (res.data && res.data.success) {

                        if (res.file.type.startsWith('image/')) {

                        }

                            id: 'item_' + Date.now() + Math.floor(Math.random()*100), 
                            type: type, 
                            url: res.data.url, 
                            name: res.data.name,

                this.deleteCloudFile(this.state.comboDraft.items[index].url);

            handleDragStart(e, index) { 
                this.state.draggedItemIndex = index; 
                e.dataTransfer.effectAllowed = "move"; 
                e.target.classList.add('sortable-ghost'); 
            },
            
            handleDragOver(e) { 
                e.preventDefault(); 
                e.dataTransfer.dropEffect = "move"; 
            },
            
            handleDrop(e, targetIndex) {
                e.preventDefault(); 
                const sourceIndex = this.state.draggedItemIndex;
                if (sourceIndex !== null && sourceIndex !== targetIndex) {
                    const items = this.state.comboDraft.items; 
                    const [removed] = items.splice(sourceIndex, 1); 
                    items.splice(targetIndex, 0, removed); 
                    this.renderComboItems();
                }
            },

                e.target.classList.remove('sortable-ghost'); 
                this.state.draggedItemIndex = null;

                    this.state.urlConfig.staticUrl = document.getElementById('input-data')?.value || '';
                } else {
                    this.state.urlConfig.staticUrl = '';
                }
                this.updateNavUI();
                this.renderInputArea();
                this.renderQR();
            },
            
            handleStaticUrlInput(val) {
                let fullUrl = val.trim();
                if (fullUrl && !/^https?:\/\//i.test(fullUrl)) {
                    fullUrl = 'https://' + fullUrl;
                }
                this.state.urlConfig.staticUrl = fullUrl;
                this.renderQR(); 
            },

            async handleMainFileSelect(event) {
                if (!this.state.isAdmin) return;
                const files = event.target.files || (event.dataTransfer ? event.dataTransfer.files : null);
                if (!files || files.length === 0) return;
                
                document.getElementById('upload-drop-ui').classList.add('hidden'); 
                document.getElementById('upload-progress-ui').classList.remove('hidden');
                
                const results = await this.uploadFilesConcurrent(files, (percent) => {
                    const statusText = document.getElementById('upload-status-text');
                    if (statusText) statusText.innerText = `极速网络上传中: ${percent}%`;
                });
                
                results.forEach(res => {
                    if (res.data && res.data.success) {
                        let type = 'document';
                        if (res.file.type.startsWith('image/')) {
                            type = 'image'; 
                        } else if (res.file.type.startsWith('audio/')) {
                            type = 'audio'; 
                        } else if (res.file.type.startsWith('video/')) {
                            type = 'video';
                        }
                        
                        this.addBlockToState(type, { 
                            url: res.data.url, 
                            name: res.data.name, 
                            size: (res.data.size/1024/1024).toFixed(2) + ' MB' 
                        });
                    }
                });
                
                document.getElementById('upload-drop-ui').classList.remove('hidden'); 
                document.getElementById('upload-progress-ui').classList.add('hidden');
            },
            
            addCurrentBlock() {
                if (!this.state.isAdmin) return;
                const mode = this.state.currentMode;
                
                if (mode === 'text' || mode === 'url') {
                    let val = document.getElementById('input-data').value.trim();
                    if (mode === 'url' && val && !/^https?:\/\//i.test(val)) {
                        val = 'https://' + val;
                    }
                    if (val) { 
                        this.addBlockToState(mode, val); 
                        document.getElementById('input-data').value = ''; 
                    }
                } else if (mode === 'form') {
                    const title = document.getElementById('form-title').value.trim() || '通用信息登记表';
                    this.addBlockToState('form', { title: title, fieldCount: 3 }); 
                    document.getElementById('form-title').value = '';
                }
            },
            
            addBlockToState(type, content) {
                this.state.blocks.push({ id: 'block_' + Date.now(), type: type, content: content });
                this.renderBlocks(); 
                if (this.state.currentMode === 'uploaded') {
                    this.renderInputArea();
                }
            },
            
            removeBlock(id) {
                if (!this.state.isAdmin) return;
                const target = this.state.blocks.find(b => b.id === id);
                if (target) {
                    if (target.type === 'combo' && target.content.items) {
                        target.content.items.forEach(item => this.deleteCloudFile(item.url));
                    } else if (target.content.url) {
                        this.deleteCloudFile(target.content.url);
                    }
                }
                this.state.blocks = this.state.blocks.filter(b => b.id !== id);
                this.renderBlocks(); 
                if (this.state.currentMode === 'uploaded') {
                    this.renderInputArea();
                }
            },

            // ================= 视图渲染与多媒体预览 =================
            openDocumentPreview(url, name) {
                const ext = name.split('.').pop().toLowerCase();
                const absoluteUrl = url.startsWith('http') ? url : (window.location.origin + url);
                const contentBox = document.getElementById('preview-content');
                document.getElementById('preview-modal').classList.remove('hidden');
                
                let inner = '';
                if (ext === 'pdf') {
                    inner = `<iframe src="${url}" class="w-full h-full border-none"></iframe>`;
                } else if (['doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx'].includes(ext)) {
                    inner = `<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(absoluteUrl)}" class="w-full h-full border-none bg-white"></iframe>`;
                } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                    inner = `<img src="${url}" class="max-w-full max-h-full object-contain">`;
                } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
                    inner = `<video src="${url}" controls autoplay class="max-w-full max-h-full"></video>`;
                } else {
                    inner = `
                        <div class="text-center bg-white p-12 rounded-xl">
                            <i class="fas fa-file text-6xl text-gray-300 mb-4"></i>
                            <p class="text-gray-600 mb-4">不支持在浏览器直接预览此格式</p>
                            <a href="${url}" download class="bg-primary text-white px-6 py-2 rounded-full shadow-md">直接下载到本地</a>
                        </div>
                    `;
                }
                contentBox.innerHTML = inner;
            },
            
            closePreview() { 
                document.getElementById('preview-modal').classList.add('hidden'); 
                document.getElementById('preview-content').innerHTML = ''; 
            },

            generateBlockHtml(block, isLive = false) {
                let html = '';
                const baseClass = isLive ? 'w-full mb-5 bg-white p-6 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100/50 overflow-hidden' : 'flex-1';
                
                if (block.type === 'combo') {
                    const c = block.content; 
                    let comboInner = '';
                    
                    if (c.title) {
                        comboInner += `
                            <h2 class="text-xl font-bold text-gray-800 mb-4 leading-tight">
                                ${this.escapeHtml(c.title)}
                            </h2>
                        `;
                    }
                    if (c.text) {
                        comboInner += `
                            <div class="leading-relaxed mb-5 opacity-90 break-words rich-text-content">
                                ${c.text}
                            </div>
                        `;
                    }
                    if (c.items && c.items.length > 0) {
                        comboInner += `<div class="flex flex-col gap-3 mt-4 border-t pt-5 border-gray-100">`;
                        c.items.forEach(item => { 
                            comboInner += `
                                <div class="rounded-xl overflow-hidden shadow-sm border border-gray-50 bg-white hover:shadow-md transition-all">
                                    ${this.generateBlockHtml({type: item.type, content: item}, false)}
                                </div>
                            `; 
                        });
                        comboInner += `</div>`;
                    }
                    
                    return `
                        <div class="${baseClass} bg-gradient-to-br from-white to-gray-50 border-blue-100/30 border relative">
                            <div class="absolute top-0 left-0 w-1.5 h-full bg-primary rounded-l-2xl opacity-80"></div>
                            <div class="pl-2">${comboInner}</div>
                        </div>
                    `;
                }

                switch (block.type) {
                    case 'text': 
                        html = `
                            <div class="${baseClass}">
                                <p class="text-gray-700 whitespace-pre-wrap leading-relaxed">${this.escapeHtml(block.content)}</p>
                            </div>
                        `; 
                        break;
                    case 'url': 
                        html = `
                            <div class="${baseClass}">
                                <a href="${this.escapeHtml(block.content)}" target="_blank" class="text-blue-500 underline flex items-center break-all hover:text-blue-600 transition-colors font-medium">
                                    <i class="fas fa-external-link-alt mr-2 shrink-0"></i> ${this.escapeHtml(block.content)}
                                </a>
                            </div>
                        `; 
                        break;
                    case 'image': 
                        html = `
                            <div class="${baseClass} p-1">
                                <img src="${block.content.url}" class="w-full rounded-lg cursor-pointer hover:opacity-95 hover:shadow-lg transition-all object-cover max-h-[400px]" onclick="app.openDocumentPreview('${block.content.url}', '${block.content.name}')">
                            </div>
                        `; 
                        break;
                    case 'audio': 
                        html = `
                            <div class="${baseClass} flex flex-col p-4 bg-gray-50/50 rounded-xl">
                                <span class="text-sm font-semibold text-gray-800 mb-3 truncate px-2 border-l-4 border-green-400 pl-3">
                                    <i class="fas fa-music text-green-500 mr-2"></i>${block.content.name}
                                </span>
                                <audio controls src="${block.content.url}" class="w-full outline-none h-10 rounded-full bg-white shadow-sm border border-gray-100"></audio>
                            </div>
                        `; 
                        break;
                    case 'video': 
                        html = `
                            <div class="${baseClass} bg-black flex justify-center p-0 m-0 relative group rounded-xl overflow-hidden">
                                <video src="${block.content.url}" controls class="w-full max-h-[350px] object-contain"></video>
                            </div>
                        `; 
                        break;
                    case 'document': 
                        html = `
                            <div class="${baseClass} flex items-center bg-white p-4 hover:bg-gray-50 transition-colors">
                                <div class="w-12 h-12 bg-red-50 text-red-500 rounded-lg flex items-center justify-center mr-4 shrink-0">
                                    <i class="fas fa-file-pdf text-2xl"></i>
                                </div>
                                <div class="flex flex-col flex-1 overflow-hidden mr-3">
                                    <span class="text-sm font-bold text-gray-800 truncate">${block.content.name}</span>
                                    <span class="text-xs text-gray-400 mt-1">${block.content.size} · 点击右侧全屏预览</span>
                                </div>
                                <div class="flex flex-col gap-2 shrink-0">
                                    <button onclick="app.openDocumentPreview('${block.content.url}', '${block.content.name}')" class="text-xs bg-gray-100 px-4 py-1.5 rounded-md text-gray-700 hover:bg-gray-200 font-bold transition-all">全屏查看</button>
                                    <a href="${block.content.url}" download class="text-xs bg-primary text-white px-4 py-1.5 rounded-md hover:bg-blue-600 text-center font-bold shadow-sm">
                                        <i class="fas fa-download mr-1"></i>下载
                                    </a>
                                </div>
                            </div>
                        `; 
                        break;
                    case 'form': 
                        html = `
                            <div class="${baseClass} border-2 border-dashed border-indigo-100 bg-indigo-50/40 p-6 relative overflow-hidden">
                                <div class="absolute -right-6 -top-6 w-20 h-20 bg-indigo-100 rounded-full opacity-50"></div>
                                <h4 class="font-bold text-indigo-900 mb-5 text-center text-lg relative z-10">${this.escapeHtml(block.content.title)}</h4>
                                <input type="text" placeholder="您的姓名" class="w-full p-3 mb-3 border border-white rounded-lg shadow-sm outline-none focus:ring-2 focus:ring-indigo-200 text-sm relative z-10">
                                <input type="tel" placeholder="联系方式" class="w-full p-3 mb-4 border border-white rounded-lg shadow-sm outline-none focus:ring-2 focus:ring-indigo-200 text-sm relative z-10">
                                <button class="w-full bg-indigo-500 text-white py-3 rounded-lg shadow-md hover:bg-indigo-600 hover:shadow-lg transition-all font-medium relative z-10 tracking-wide">安全提交数据</button>
                            </div>
                        `; 
                        break;
                }
                return html;
            },

            // ================= 核心渲染：发布流降维卡片展示 (完美匹配需求：放大卡片/取消截断/提炼信息) =================
            renderBlocks() {
                const container = document.getElementById('blocks-container');
                if (!container) return;
                
                if (this.state.blocks.length === 0) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-48 text-gray-400 w-full col-span-full">
                            <i class="fas fa-layer-group text-5xl mb-4 opacity-40"></i>
                            <p class="text-sm font-medium">内容流水线为空，请在上方添加模块</p>
                        </div>
                    `; 
                    return;
                }
                
                container.innerHTML = '';
                
                this.state.blocks.forEach((block, index) => {
                    const blockEl = document.createElement('div');
                    blockEl.draggable = true;
                    // 【解除高度锁死】移除写死的 h-28，改用 min-h-[120px] 自动延展
                    blockEl.className = 'block-animate bg-white border border-gray-100 rounded-2xl p-5 flex flex-col justify-between group relative shadow-sm hover:shadow-md transition-all min-h-[120px] h-auto border-l-4 border-l-primary cursor-move';
                    
                    blockEl.ondragstart = (e) => this.handleMainDragStart(e, index); 
                    blockEl.ondragover = (e) => this.handleMainDragOver(e); 
                    blockEl.ondrop = (e) => this.handleMainDrop(e, index); 
                    blockEl.ondragend = (e) => this.handleMainDragEnd(e);

                    let icon = 'fa-file'; 
                    let title = ''; 
                    let descHtml = '';
                    
                    switch(block.type) {
                        case 'text': 
                            icon='fa-font text-blue-500'; 
                            title='文本段落'; 
                            descHtml = `<div class="text-sm text-gray-500 mt-2 line-clamp-3 leading-relaxed break-all">${this.escapeHtml(block.content)}</div>`; 
                            break;
                        case 'url': 
                            icon='fa-link text-blue-500'; 
                            title='网址链接'; 
                            descHtml = `<div class="text-sm text-blue-400 mt-2 truncate">${this.escapeHtml(block.content)}</div>`; 
                            break;
                        case 'image': 
                            icon='fa-image text-green-500'; 
                            title='图片资源'; 
                            descHtml = `<div class="text-sm text-gray-500 mt-2 truncate">${this.escapeHtml(block.content.name)}</div>`; 
                            break;
                        case 'audio': 
                            icon='fa-music text-yellow-500'; 
                            title='音频文件'; 
                            descHtml = `<div class="text-sm text-gray-500 mt-2 truncate">${this.escapeHtml(block.content.name)}</div>`; 
                            break;
                        case 'video': 
                            icon='fa-video text-purple-500'; 
                            title='视频文件'; 
                            descHtml = `<div class="text-sm text-gray-500 mt-2 truncate">${this.escapeHtml(block.content.name)}</div>`; 
                            break;
                        case 'document': 
                            icon='fa-file-pdf text-red-500'; 
                            title='文档附件'; 
                            descHtml = `<div class="text-sm text-gray-500 mt-2 truncate">${this.escapeHtml(block.content.name)}</div>`; 
                            break;
                        case 'form': 
                            icon='fa-list-check text-indigo-500'; 
                            title='数据表单'; 
                            descHtml = `<div class="text-sm text-gray-500 mt-2 truncate">${this.escapeHtml(block.content.title)}</div>`; 
                            break;
                        case 'combo': 
                            icon='fa-cubes text-primary'; 
                            title=block.content.title || '图文组合'; 
                            let itemsCount = block.content.items ? block.content.items.length : 0;
                            let textPreview = block.content.text ? this.stripHtml(block.content.text).substring(0, 50) + '...' : '';
                            descHtml = `<div class="text-sm text-gray-500 mt-2 line-clamp-3 leading-relaxed break-all">${textPreview}<br><span class="inline-block mt-1 font-medium text-primary bg-blue-50 px-2 py-0.5 rounded">包含 ${itemsCount} 个媒体附件</span></div>`; 
                            break;
                    }

                    blockEl.innerHTML = `
                        <div class="flex items-start gap-4 w-full overflow-hidden">
                            <div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center shrink-0 border border-gray-100 shadow-sm opacity-90 mt-1">
                                <i class="fas ${icon} text-2xl"></i>
                            </div>
                            <div class="flex flex-col flex-1 overflow-hidden">
                                <!-- 【解除截断】移除 truncate，改用 break-words 使标题可以完整换行显示 -->
                                <span class="font-bold text-gray-800 text-base break-words pr-6 leading-snug">${this.escapeHtml(title)}</span>
                                ${descHtml}
                            </div>
                        </div>
                        <div class="flex justify-end w-full mt-3 border-t border-gray-50 pt-3 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="app.removeBlock('${block.id}')" class="text-xs text-red-500 hover:text-red-600 flex items-center bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition-colors font-medium">
                                <i class="fas fa-trash-alt mr-1.5"></i>删除模块
                            </button>
                        </div>
                    `;
                    container.appendChild(blockEl);
                });
            },

            // ================= 发布流原生 H5 拖拽支持 =================
            handleMainDragStart(e, index) { 
                this.state.draggedMainIndex = index; 
                e.dataTransfer.effectAllowed = "move"; 
                e.target.classList.add('sortable-ghost'); 
            },
            handleMainDragOver(e) { 
                e.preventDefault(); 
                e.dataTransfer.dropEffect = "move"; 
            },
            handleMainDrop(e, targetIndex) {
                e.preventDefault(); 
                const sourceIndex = this.state.draggedMainIndex;
                if (sourceIndex !== null && sourceIndex !== targetIndex) {
                    const blocks = this.state.blocks; 
                    const [removed] = blocks.splice(sourceIndex, 1); 
                    blocks.splice(targetIndex, 0, removed); 
                    this.renderBlocks();
                }
            },
            handleMainDragEnd(e) { 
                e.target.classList.remove('sortable-ghost'); 
                this.state.draggedMainIndex = null; 
            },

            renderLiveH5() {
                document.title = "在线查阅系统";
                const container = document.getElementById('mobile-live-container');
                
                if (this.state.blocks.length === 0) {
                    container.innerHTML = `
                        <div class="text-center mt-32 text-gray-400 flex flex-col items-center">
                            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-5 shadow-inner">
                                <i class="fas fa-box-open text-4xl text-gray-300"></i>
                            </div>
                            <p class="font-medium text-lg text-gray-500">内容尚未发布</p>
                            <p class="text-sm mt-2">管理员正在加紧配置中，请稍后再试</p>
                        </div>
                    `;
                    return;
                }
                
                let html = `
                    <div class="w-full flex justify-center py-5">
                        <div class="w-14 h-1.5 bg-gray-300 rounded-full opacity-60"></div>
                    </div>
                    <div class="px-4 flex flex-col gap-2">
                `;
                
                this.state.blocks.forEach(block => { 
                    html += this.generateBlockHtml(block, true); 
                });
                
                html += `
                    </div>
                    <p class="text-center text-xs text-gray-300 mt-8 mb-6 tracking-widest uppercase">THE END</p>
                    
                    <div class="fixed bottom-0 left-0 w-full p-4 pb-8 bg-white/85 backdrop-blur-xl border-t border-gray-100 z-30 shadow-[0_-10px_40px_rgba(0,0,0,0.06)]">
                        <button id="btn-batch-download" onclick="app.downloadAllFiles()" class="w-full max-w-lg mx-auto bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-3.5 rounded-xl shadow-[0_4px_15px_rgba(30,144,255,0.3)] hover:shadow-[0_6px_25px_rgba(30,144,255,0.4)] hover:-translate-y-0.5 transition-all font-semibold flex items-center justify-center text-[15px] tracking-wide active:scale-95">
                            <i class="fas fa-cloud-download-alt mr-2 text-lg"></i> 一键打包下载全部内容
                        </button>
                    </div>
                `;
                container.innerHTML = html;
            },

            // ================= 核心渲染：二维码生成引擎 (完美1/5比例极简重构) =================
            renderQR() {
                const qrContainer = document.getElementById('qrcode'); 
                qrContainer.innerHTML = '';
                
                let targetUrl = this.state.liveUrl;
                
                if (this.state.currentMode === 'url' && this.state.urlConfig.mode === 'static') {
                    targetUrl = this.state.urlConfig.staticUrl || 'https://';
                }

                // 强制将画布调小，彻底适配 1/5 比例
                new QRCode(qrContainer, { 
                    text: targetUrl, 
                    width: 120, 
                    height: 120, 
                    colorDark : '#111827', 
                    colorLight : '#ffffff', 
                    correctLevel : QRCode.CorrectLevel.M 
                });
                
                setTimeout(() => { 
                    const canvas = qrContainer.querySelector('canvas'); 
                    if(canvas) { 
                        canvas.style.borderRadius = '0.35rem'; 
                    } 
                }, 50);
            },
            
            downloadQR() {
                const canvas = document.querySelector('#qrcode canvas');
                if(!canvas) return alert('二维码尚未生成');
                
                const url = canvas.toDataURL("image/png");
                const a = document.createElement('a');
                a.download = `专属活码_${new Date().getTime()}.png`;
                a.href = url;
                a.click();
            },
            
            generateShareLink() {
                let linkToCopy = this.state.liveUrl;
                if (this.state.currentMode === 'url' && this.state.urlConfig.mode === 'static' && this.state.urlConfig.staticUrl) {
                    linkToCopy = this.state.urlConfig.staticUrl;
                }
                
                navigator.clipboard.writeText(linkToCopy).then(() => {
                    const btn = event.currentTarget; 
                    const oldHtml = btn.innerHTML;
                    
                    btn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> 复制成功'; 
                    btn.classList.replace('bg-primary', 'bg-green-500');
                    
                    setTimeout(() => { 
                        btn.innerHTML = oldHtml; 
                        btn.classList.replace('bg-green-500', 'bg-primary'); 
                    }, 2000);
                }).catch(() => { 
                    alert('复制失败，请手动复制下方链接: \n\n' + this.state.liveUrl); 
                });
            }
        };

        // DOM 挂载完毕后启动架构
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
