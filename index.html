<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高级多功能动态二维码生成系统</title>
    <!-- 引入 Tailwind CSS 进行极简 UI 搭建 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome 提供高质量图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 QRCode.js 用于前端实时渲染二维码 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E90FF',
                        secondary: '#F3F4F6',
                        dark: '#111827',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'float': '0 10px 25px -5px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>
    <style>
        /* 全局平滑滚动与字体 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #F8FAFC; color: #333; }
        
        /* 隐藏滚动条但保留滚动功能，提升高级感 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 拖拽区域的高亮动画 */
        .drag-active { border-color: #1E90FF !important; background-color: #EBF5FF !important; }
        
        /* 模块载入动画 */
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .block-animate { animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        /* AI艺术码遮罩特效 */
        .ai-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(255,192,203,0.3), rgba(135,206,235,0.3)); pointer-events: none; mix-blend-mode: overlay; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4" id="drop-zone">

    <!-- 顶部导航栏 -->
    <header class="w-full max-w-6xl flex justify-center gap-4 mb-8 flex-wrap">
        <button onclick="app.setMode('text')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary active-nav">文本</button>
        <button onclick="app.setMode('url')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">网址</button>
        <button onclick="app.setMode('image')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">图片</button>
        <button onclick="app.setMode('audio')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">音频</button>
        <button onclick="app.setMode('video')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">视频</button>
        <button onclick="app.setMode('document')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">文档</button>
        <button onclick="app.setMode('form')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">表单</button>
    </header>

    <!-- 核心工作区 -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左侧编辑区 (占据 2/3) -->
        <section class="lg:col-span-2 flex flex-col gap-4">
            
            <!-- 输入/上传面板 -->
            <div id="input-panel" class="bg-white rounded-2xl shadow-soft p-6 relative border-2 border-dashed border-transparent transition-all">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="panel-title" class="text-lg font-semibold text-gray-700"><i class="fas fa-keyboard text-primary mr-2"></i>添加文本</h2>
                    <span class="text-xs text-gray-400">支持拖拽、粘贴(Ctrl+V)直接添加</span>
                </div>
                
                <!-- 动态输入区，由 JS 渲染 -->
                <div id="dynamic-input-area" class="w-full min-h-[120px]">
                    <textarea id="text-input" class="w-full h-32 p-3 bg-gray-50 rounded-xl border-none outline-none resize-none focus:ring-2 focus:ring-primary/50 transition-all text-gray-700" placeholder="请输入任意文字，支持多段落组合..."></textarea>
                </div>
                
                <div class="flex justify-between items-center mt-4">
                    <p class="text-xs text-gray-400" id="panel-hint">文字长度无限制，扫码即刻展示最新内容</p>
                    <button onclick="app.addCurrentBlock()" class="bg-primary text-white px-6 py-2 rounded-full hover:bg-blue-600 hover:shadow-lg hover:-translate-y-0.5 transition-all focus:outline-none">添加到内容组合</button>
                </div>
            </div>

            <!-- 组合内容展示栈 (实时预览) -->
            <div class="bg-white rounded-2xl shadow-soft p-6 min-h-[300px]">
                <h3 class="text-md font-semibold text-gray-700 mb-4 border-b pb-2">当前组合内容 (扫码呈现)</h3>
                <div id="blocks-container" class="flex flex-col gap-3 w-full">
                    <!-- 空状态提示 -->
                    <div id="empty-state" class="flex flex-col items-center justify-center h-40 text-gray-400">
                        <i class="fas fa-layer-group text-4xl mb-3 opacity-50"></i>
                        <p class="text-sm">暂无内容，请从上方添加图文、音视频等</p>
                    </div>
                </div>
            </div>
            
        </section>

        <!-- 右侧二维码预览区 (占据 1/3) -->
        <aside class="w-full flex flex-col gap-4 relative">
            <div class="bg-white rounded-2xl shadow-soft p-8 flex flex-col items-center sticky top-8">
                <div class="w-full flex justify-end mb-4">
                    <!-- AI 艺术码切换开关 -->
                    <label class="flex items-center cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" id="ai-toggle" class="sr-only" onchange="app.toggleAI()">
                            <div class="block bg-gray-200 w-10 h-6 rounded-full transition-all duration-300"></div>
                            <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition transform duration-300"></div>
                        </div>
                        <div class="ml-3 text-sm font-medium text-gray-700">AI艺术码模式</div>
                    </label>
                </div>

                <!-- 二维码渲染容器 -->
                <div id="qrcode-container" class="w-56 h-56 bg-gray-50 flex items-center justify-center rounded-2xl mb-6 relative overflow-hidden transition-all shadow-inner">
                    <!-- 初始占位符 -->
                    <i id="qr-placeholder" class="fas fa-qrcode text-6xl text-gray-200"></i>
                    <div id="qrcode" class="z-10 relative"></div>
                    <!-- AI 艺术遮罩层 (默认隐藏) -->
                    <div id="ai-effect" class="ai-mask hidden"></div>
                </div>
                
                <p class="text-sm text-gray-500 mb-6 text-center" id="qr-status">这里预览您的活码<br><span class="text-xs text-gray-400">(内容修改后，二维码图案保持不变)</span></p>

                <div class="flex gap-3 w-full">
                    <button onclick="app.downloadQR()" class="flex-1 border-2 border-primary text-primary px-4 py-2 rounded-full hover:bg-blue-50 transition-all font-medium flex items-center justify-center">
                        <i class="fas fa-download mr-2"></i> 下载PNG
                    </button>
                    <button onclick="app.generateShareLink()" class="flex-1 bg-primary text-white px-4 py-2 rounded-full hover:bg-blue-600 shadow hover:shadow-lg transition-all font-medium flex items-center justify-center">
                        <i class="fas fa-share-nodes mr-2"></i> 复制链接
                    </button>
                </div>
            </div>
        </aside>

    </main>

    <!-- 前端核心架构与业务逻辑 (JavaScript) -->
    <script>
        /**
         * 首席架构师设计：
         * 采用单向数据流与状态机设计模式。
         * State 包含所有的区块 (Blocks)，任何 UI 更新都必须基于 State 的改变。
         */
        const app = {
            // 核心状态管理
            state: {
                currentMode: 'text', // text, url, image, audio, video, document, form
                blocks: [], // 存储组合的内容区块
                isAIArtMode: false,
                mockShortUrl: 'https://m3y.test/qr/live_12345' // 模拟活码短链
            },

            // 各模式的配置信息 (策略模式)
            configs: {
                text: { icon: 'fa-keyboard', title: '添加文本', hint: '文字长度无限制，扫码即刻展示最新内容', accept: null },
                url: { icon: 'fa-link', title: '添加网址', hint: '扫码后自动跳转或展示超链接', accept: null },
                image: { icon: 'fa-image', title: '添加图片', hint: '支持 png, jpg, gif 等，可直接拖拽/粘贴', accept: 'image/png, image/jpeg, image/gif, image/bmp, image/tiff' },
                audio: { icon: 'fa-music', title: '添加音频', hint: '支持 mp3, wav，扫码在线播放无广告', accept: 'audio/mpeg, audio/wav' },
                video: { icon: 'fa-video', title: '添加视频', hint: '支持 mp4, 3gp 等，高清流畅不卡顿', accept: 'video/mp4, video/3gpp' },
                document: { icon: 'fa-file-word', title: '添加文档', hint: '支持 Word, PPT, PDF, Excel 等31种格式', accept: '.doc,.docx,.ppt,.pptx,.xls,.xlsx,.pdf,.wps' },
                form: { icon: 'fa-list-check', title: '添加表单', hint: '无纸化登记、报名预约、信息收集', accept: null }
            },

            // 1. 初始化应用
            init() {
                this.bindDragAndDrop();
                this.bindPasteEvent();
                this.updateNavUI();
                this.renderInputArea();
                this.renderQR(); // 初始化生成占位码
            },

            // 2. 切换输入模式
            setMode(mode) {
                this.state.currentMode = mode;
                this.updateNavUI();
                this.renderInputArea();
            },

            // 更新顶部导航UI
            updateNavUI() {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('text-primary', 'font-semibold', 'ring-2', 'ring-primary/20');
                    if(btn.innerText.toLowerCase().includes(this.getModeName(this.state.currentMode))) {
                        btn.classList.add('text-primary', 'font-semibold', 'ring-2', 'ring-primary/20');
                    }
                });
                
                const cfg = this.configs[this.state.currentMode];
                document.getElementById('panel-title').innerHTML = `<i class="fas ${cfg.icon} text-primary mr-2"></i>${cfg.title}`;
                document.getElementById('panel-hint').innerText = cfg.hint;
            },

            getModeName(mode) {
                const map = { text: '文本', url: '网址', image: '图片', audio: '音频', video: '视频', document: '文档', form: '表单' };
                return map[mode];
            },

            // 3. 渲染动态输入区
            renderInputArea() {
                const area = document.getElementById('dynamic-input-area');
                const mode = this.state.currentMode;
                const cfg = this.configs[mode];

                if (mode === 'text' || mode === 'url') {
                    area.innerHTML = `<textarea id="input-data" class="w-full h-32 p-3 bg-gray-50 rounded-xl border-none outline-none resize-none focus:ring-2 focus:ring-primary/50 transition-all text-gray-700" placeholder="${mode === 'url' ? '请输入以 http:// 或 https:// 开头的网址' : '请输入任意文字，支持多段落组合...'}"></textarea>`;
                } else if (mode === 'form') {
                    // 模拟表单构建器界面
                    area.innerHTML = `
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 flex flex-col gap-2">
                            <input type="text" id="form-title" class="w-full p-2 rounded bg-white border-none focus:ring-1 focus:ring-primary text-sm" placeholder="表单标题 (例如：访客登记表)">
                            <div class="flex gap-2">
                                <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded text-xs">单行文本</span>
                                <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded text-xs">多行文本</span>
                                <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded text-xs">下拉选择</span>
                            </div>
                            <p class="text-xs text-gray-400 mt-2">注：为保持体验，此处为极简表单模拟构建。实际业务会调起独立的高级表单设计器。</p>
                        </div>
                    `;
                } else {
                    // 文件上传类 (图片、音视频、文档)
                    area.innerHTML = `
                        <div class="relative w-full h-32 bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center hover:bg-gray-100 hover:border-primary transition-all group">
                            <input type="file" id="input-data-file" accept="${cfg.accept}" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="app.handleFileSelect(event)">
                            <i class="fas fa-cloud-arrow-up text-3xl text-gray-400 group-hover:text-primary transition-colors mb-2"></i>
                            <p class="text-sm text-gray-500"><span class="text-primary font-medium">点击上传</span> 或将文件拖拽到此处</p>
                            <p class="text-xs text-gray-400 mt-1">支持批量拖入</p>
                        </div>
                    `;
                }
            },

            // 4. 处理文件选择/拖入/粘贴
            handleFileSelect(event) {
                const files = event.target.files || event.dataTransfer.files;
                if (!files || files.length === 0) return;
                
                Array.from(files).forEach(file => {
                    this.processFile(file);
                });
            },

            processFile(file) {
                // 安全防范与内存管理：生成 ObjectURL
                const fileUrl = URL.createObjectURL(file);
                
                // 根据 MIME type 自动识别 block 类型
                let type = 'document';
                if (file.type.startsWith('image/')) type = 'image';
                else if (file.type.startsWith('audio/')) type = 'audio';
                else if (file.type.startsWith('video/')) type = 'video';
                else type = 'document'; // 兜底为文档（如 pdf, docx，因系统差异mime可能为空或特殊）

                // 添加到状态树
                this.addBlockToState(type, {
                    url: fileUrl,
                    name: file.name,
                    size: (file.size / 1024 / 1024).toFixed(2) + ' MB'
                });
            },

            // 全局拖拽事件劫持防御（防止拖错位置导致页面跳转丢失数据）
            bindDragAndDrop() {
                const dropZone = document.getElementById('drop-zone');
                const panel = document.getElementById('input-panel');

                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, e => e.preventDefault(), false);
                    document.body.addEventListener(eventName, e => e.preventDefault(), false);
                });

                ['dragenter', 'dragover'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => panel.classList.add('drag-active'), false);
                });

                ['dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => panel.classList.remove('drag-active'), false);
                });

                dropZone.addEventListener('drop', (e) => {
                    const files = e.dataTransfer.files;
                    if(files.length > 0) this.handleFileSelect(e);
                }, false);
            },

            // 全局粘贴事件劫持 (支持截图后直接 Ctrl+V)
            bindPasteEvent() {
                document.addEventListener('paste', (e) => {
                    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                    for (let index in items) {
                        const item = items[index];
                        if (item.kind === 'file') {
                            const blob = item.getAsFile();
                            this.processFile(blob);
                        }
                    }
                });
            },

            // 5. 点击"添加到组合"按钮
            addCurrentBlock() {
                const mode = this.state.currentMode;
                
                if (mode === 'text' || mode === 'url') {
                    const val = document.getElementById('input-data').value.trim();
                    if (!val) return alert('内容不能为空');
                    // XSS 防御在渲染阶段做，这里存原值
                    this.addBlockToState(mode, val);
                    document.getElementById('input-data').value = '';
                } else if (mode === 'form') {
                    const title = document.getElementById('form-title').value.trim() || '未命名表单';
                    this.addBlockToState('form', { title: title, fieldCount: 3 });
                    document.getElementById('form-title').value = '';
                } else {
                    // 文件类若未通过拖拽/onChange触发，给出提示
                    alert('请先选择或拖拽文件到虚线框内');
                }
            },

            // 更新状态树并重绘 UI
            addBlockToState(type, content) {
                const newBlock = {
                    id: 'block_' + Date.now() + '_' + Math.floor(Math.random()*1000),
                    type: type,
                    content: content
                };
                this.state.blocks.push(newBlock);
                this.renderBlocks();
                this.renderQR(); // 每次内容改变，虽然URL没变，但业务逻辑上触发重新渲染确保二维码有效
            },

            // 删除Block（包含内存泄露防御）
            removeBlock(id) {
                const block = this.state.blocks.find(b => b.id === id);
                if(block && typeof block.content === 'object' && block.content.url) {
                    // 核心防御：释放本地 Blob URL 内存
                    URL.revokeObjectURL(block.content.url);
                }
                this.state.blocks = this.state.blocks.filter(b => b.id !== id);
                this.renderBlocks();
            },

            // 6. 渲染内容组合流水线 (Render Blocks)
            renderBlocks() {
                const container = document.getElementById('blocks-container');
                const empty = document.getElementById('empty-state');
                
                if (this.state.blocks.length === 0) {
                    empty.style.display = 'flex';
                    container.innerHTML = '';
                    container.appendChild(empty);
                    return;
                }

                empty.style.display = 'none';
                container.innerHTML = '';
                
                this.state.blocks.forEach((block, index) => {
                    const blockEl = document.createElement('div');
                    blockEl.className = 'block-animate bg-gray-50 border border-gray-100 rounded-xl p-4 flex items-center justify-between group relative overflow-hidden';
                    
                    // 防 XSS 处理函数
                    const escapeHtml = (unsafe) => unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");

                    let contentHtml = '';
                    
                    // 根据类型分发渲染器
                    switch (block.type) {
                        case 'text':
                            contentHtml = `<div class="flex items-start"><i class="fas fa-align-left text-gray-400 mt-1 mr-3"></i><p class="text-sm text-gray-600 line-clamp-2 break-all">${escapeHtml(block.content)}</p></div>`;
                            break;
                        case 'url':
                            contentHtml = `<div class="flex items-start"><i class="fas fa-link text-blue-500 mt-1 mr-3"></i><a href="${escapeHtml(block.content)}" target="_blank" class="text-sm text-blue-500 underline line-clamp-1 break-all">${escapeHtml(block.content)}</a></div>`;
                            break;
                        case 'image':
                            contentHtml = `<div class="flex items-center"><div class="w-12 h-12 rounded bg-gray-200 overflow-hidden flex-shrink-0 mr-3"><img src="${block.content.url}" class="w-full h-full object-cover"></div><div class="flex flex-col"><span class="text-sm font-medium text-gray-700 w-48 truncate">${block.content.name}</span><span class="text-xs text-gray-400">${block.content.size}</span></div></div>`;
                            break;
                        case 'audio':
                            contentHtml = `<div class="flex items-center w-full"><i class="fas fa-file-audio text-green-500 text-2xl mr-3 flex-shrink-0"></i><div class="flex flex-col w-full max-w-[200px]"><span class="text-sm font-medium text-gray-700 truncate">${block.content.name}</span><audio controls src="${block.content.url}" class="h-6 mt-1 w-full outline-none"></audio></div></div>`;
                            break;
                        case 'video':
                            contentHtml = `<div class="flex items-center"><div class="w-16 h-12 bg-black rounded overflow-hidden flex-shrink-0 mr-3 relative flex items-center justify-center"><i class="fas fa-play-circle text-white/70 absolute"></i><video src="${block.content.url}" class="w-full h-full object-cover opacity-50"></video></div><div class="flex flex-col"><span class="text-sm font-medium text-gray-700 w-48 truncate">${block.content.name}</span><span class="text-xs text-gray-400">${block.content.size}</span></div></div>`;
                            break;
                        case 'document':
                            // 针对 31 种文档的通用卡片渲染 (暗坑处理策略：前端提供预览态UI)
                            contentHtml = `
                                <div class="flex items-center w-full">
                                    <div class="w-10 h-10 bg-red-50 text-red-500 rounded flex items-center justify-center mr-3 flex-shrink-0"><i class="fas fa-file-pdf text-xl"></i></div>
                                    <div class="flex flex-col flex-1">
                                        <span class="text-sm font-medium text-gray-700 w-48 truncate">${block.content.name}</span>
                                        <span class="text-xs text-gray-400">${block.content.size} · Word/PDF/PPT等支持在线预览</span>
                                    </div>
                                    <div class="ml-2 flex gap-2">
                                        <button class="text-xs bg-white border border-gray-200 px-2 py-1 rounded text-gray-600 hover:text-primary hover:border-primary transition-all">预览</button>
                                        <button class="text-xs bg-primary/10 border border-transparent px-2 py-1 rounded text-primary hover:bg-primary hover:text-white transition-all">下载</button>
                                    </div>
                                </div>
                            `;
                            break;
                        case 'form':
                            contentHtml = `<div class="flex items-center"><div class="w-10 h-10 bg-indigo-50 text-indigo-500 rounded flex items-center justify-center mr-3"><i class="fas fa-clipboard-list text-xl"></i></div><div class="flex flex-col"><span class="text-sm font-medium text-gray-700">${escapeHtml(block.content.title)}</span><span class="text-xs text-gray-400">包含 ${block.content.fieldCount} 个信息收集字段</span></div></div>`;
                            break;
                    }

                    blockEl.innerHTML = `
                        <div class="flex items-center">
                            <div class="mr-3 cursor-move text-gray-300 hover:text-gray-500"><i class="fas fa-grip-vertical"></i></div>
                            <div class="flex-1">${contentHtml}</div>
                        </div>
                        <button onclick="app.removeBlock('${block.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all hover:bg-red-500 hover:text-white absolute right-4">
                            <i class="fas fa-trash-alt text-sm"></i>
                        </button>
                    `;
                    container.appendChild(blockEl);
                });
            },

            // 7. 生成或更新二维码
            renderQR() {
                const qrContainer = document.getElementById('qrcode');
                const placeholder = document.getElementById('qr-placeholder');
                
                // 清理旧码
                qrContainer.innerHTML = '';
                
                if(this.state.blocks.length === 0) {
                    placeholder.style.display = 'block';
                    return;
                }
                
                placeholder.style.display = 'none';

                // 生成新码（使用活码逻辑：生成的是一个固定的ID短链接，实际应用中该短链请求后端获取最新blocks渲染）
                new QRCode(qrContainer, {
                    text: this.state.mockShortUrl,
                    width: 200,
                    height: 200,
                    colorDark : "#333333",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });

                // 给 Canvas 添加平滑过滤，避免锯齿
                setTimeout(() => {
                    const canvas = qrContainer.querySelector('canvas');
                    if(canvas) {
                        canvas.style.borderRadius = '0.5rem';
                        canvas.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)';
                    }
                }, 50);
            },

            // 8. AI艺术码特效切换
            toggleAI() {
                const toggle = document.getElementById('ai-toggle');
                const effect = document.getElementById('ai-effect');
                const dot = document.querySelector('.dot');
                const bg = toggle.nextElementSibling;
                
                this.state.isAIArtMode = toggle.checked;

                if (this.state.isAIArtMode) {
                    bg.classList.replace('bg-gray-200', 'bg-purple-500');
                    dot.classList.add('translate-x-4');
                    // 渲染前端特效，模拟生成类似花绘/机甲的AI底层网格
                    effect.classList.remove('hidden');
                    // 此处模拟调用后端 SD 模型，前端用 CSS 滤镜暂代
                    effect.style.backgroundImage = 'url("data:image/svg+xml,%3Csvg width=\'100%25\' height=\'100%25\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noise\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.05\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noise)\' opacity=\'0.15\'/%3E%3C/svg%3E")';
                    
                    document.getElementById('qr-status').innerHTML = '✨ 艺术码生成中...<br><span class="text-xs text-purple-500">已应用Stable Diffusion风格化处理</span>';
                } else {
                    bg.classList.replace('bg-purple-500', 'bg-gray-200');
                    dot.classList.remove('translate-x-4');
                    effect.classList.add('hidden');
                    document.getElementById('qr-status').innerHTML = '这里预览您的活码<br><span class="text-xs text-gray-400">(内容修改后，二维码图案保持不变)</span>';
                }
            },

            // 9. 下载二维码 PNG
            downloadQR() {
                if(this.state.blocks.length === 0) return alert('请先添加内容生成二维码');
                const canvas = document.querySelector('#qrcode canvas');
                if(!canvas) return;
                
                const url = canvas.toDataURL("image/png");
                const a = document.createElement('a');
                a.download = `动态活码_${new Date().getTime()}.png`;
                a.href = url;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            },

            // 10. 复制短链接
            generateShareLink() {
                if(this.state.blocks.length === 0) return alert('请先添加内容生成活码');
                navigator.clipboard.writeText(this.state.mockShortUrl).then(() => {
                    const btn = event.currentTarget;
                    const oldHtml = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check mr-2"></i> 已复制';
                    btn.classList.replace('bg-primary', 'bg-green-500');
                    setTimeout(() => {
                        btn.innerHTML = oldHtml;
                        btn.classList.replace('bg-green-500', 'bg-primary');
                    }, 2000);
                }).catch(err => {
                    alert('复制失败，请手动复制: ' + this.state.mockShortUrl);
                });
            }
        };

        // 页面加载完成后启动应用架构
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
