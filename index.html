<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高级动态活码与资源分发系统</title>
    
    <!-- 引入外部引擎与样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- 【新增】强力引入 HTML 转 PDF 高保真渲染引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        primary: '#1E90FF', 
                        secondary: '#F3F4F6', 
                        dark: '#111827' 
                    },
                    boxShadow: { 
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #F8FAFC; 
            color: #333; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .drag-active { border-color: #1E90FF !important; background-color: #EBF5FF !important; }
        
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .block-animate { animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        /* 管理员权限样式隔离 */
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: flex !important; }
        body.is-admin .admin-only-block { display: block !important; }
        
        /* 拖拽排序特效 */
        .sortable-ghost { 
            opacity: 0.4; 
            background-color: #f0f9ff; 
            border: 1px dashed #1E90FF; 
        }
        
        /* 移动端 H5 底部安全区，防止被悬浮按钮遮挡 */
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 100px); }

        /* 富文本编辑器内部基础排版适配 (确保原格式100%保留渲染) */
        .rich-text-content {
            line-height: 1.6;
        }
        .rich-text-content b, .rich-text-content strong { font-weight: bold; }
        .rich-text-content i, .rich-text-content em { font-style: italic; }
        .rich-text-content u { text-decoration: underline; }
        .rich-text-content ul { list-style-type: disc; padding-left: 20px; }
        .rich-text-content ol { list-style-type: decimal; padding-left: 20px; }
        .rich-text-content p { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4" id="drop-zone">

    <!-- 顶部导航栏 -->
    <header class="w-full max-w-[1400px] flex justify-center gap-3 mb-8 flex-wrap admin-only px-4 mx-auto">
        <button onclick="app.setMode('text')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 active-nav">文本</button>
        <button onclick="app.setMode('url')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">网址</button>
        <button onclick="app.setMode('document')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">文档</button>
        <button onclick="app.setMode('image')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">图片</button>
        <button onclick="app.setMode('audio')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">音频</button>
        <button onclick="app.setMode('video')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">视频</button>
        <button onclick="app.setMode('form')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">表单</button>
        
        <button onclick="app.openComboEditor()" class="bg-gradient-to-r from-blue-500 to-indigo-500 px-6 py-2 rounded-full shadow-md hover:shadow-lg transition-all text-white font-semibold flex items-center">
            <i class="fas fa-cubes text-sm mr-2"></i>组合上传
        </button>

        <button onclick="app.setMode('uploaded')" class="nav-btn bg-blue-50 border border-blue-100 px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-primary font-semibold flex items-center">
            <i class="fas fa-cloud text-sm mr-2"></i>已上传
        </button>
    </header>

    <!-- PC端管理工作区 -->
    <main class="w-full max-w-[1100px] flex flex-col gap-8 admin-only px-4 mx-auto">
        
        <!-- 上方输入面板 -->
        <section class="w-full flex flex-col gap-6 relative">
            <div id="input-panel" class="bg-white rounded-2xl shadow-sm p-8 relative border-2 border-dashed border-transparent transition-all">
                <div class="flex justify-between items-center mb-6" id="panel-header">
                    <h2 id="panel-title" class="text-xl font-bold text-gray-800 tracking-wide">
                        <i class="fas fa-keyboard text-primary mr-2"></i>添加文本
                    </h2>
                    <span id="panel-hint-pill" class="text-xs text-gray-400 bg-gray-100 px-4 py-1.5 rounded-full font-medium">支持直接拖拽资源极速解析</span>
                </div>
                
                <div id="dynamic-input-area" class="w-full min-h-[140px]"></div>
                
                <div class="flex justify-between items-center mt-6" id="panel-footer-action">
                    <p class="text-sm text-gray-400" id="panel-hint">在此粘贴任意图文格式，内容将100%还原呈现</p>
                    <button id="btn-add-block" onclick="app.addCurrentBlock()" class="bg-primary text-white px-10 py-3.5 rounded-xl hover:bg-blue-600 shadow-[0_4px_14px_0_rgba(30,144,255,0.39)] hover:shadow-[0_6px_20px_rgba(30,144,255,0.23)] hover:-translate-y-0.5 transition-all font-semibold tracking-wide">
                        添加到内容流水线
                    </button>
                </div>
            </div>

            <!-- 下方流水线区：一物一码极度压低的单行贯穿排版 -->
            <div class="bg-white rounded-2xl shadow-sm p-8 min-h-[400px]">
                <div class="flex justify-between items-center mb-8 border-b border-gray-100 pb-5">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800 tracking-wide">当前在线流 <span class="text-sm text-primary ml-2 font-normal">一物一码独立分发</span></h3>
                        <p class="text-xs text-gray-400 mt-1">每个内容都有专属二维码，横排高度极简压缩，分享便捷</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <!-- 新增：查看数据按钮 (点击会在新标签页打开 stats.html) -->
                        <a href="stats.html" target="_blank" class="bg-white border border-gray-200 text-gray-700 px-6 py-2.5 text-sm rounded-lg hover:border-primary hover:text-primary transition-all shadow-sm hover:-translate-y-0.5 font-bold tracking-wider flex items-center">
                            <i class="fas fa-chart-pie mr-2"></i> 查看数据
                        </a>
    
                        <!-- 原有的：同步至云端按钮 -->
                        <button onclick="app.syncToCloud()" class="bg-green-500 text-white px-6 py-2.5 text-sm rounded-lg hover:bg-green-600 transition-all shadow-[0_4px_14px_0_rgba(34,197,94,0.39)] hover:-translate-y-0.5 font-bold tracking-wider flex items-center">
                            <i class="fas fa-cloud-upload-alt mr-2"></i> 同步至云端
                        </button>
                    </div>
                </div>
                <!-- 容器为纵向列表，每张卡片横向展开贯穿 -->
                <div id="blocks-container" class="flex flex-col gap-5 w-full"></div>
            </div>
        </section>

    </main>

    <!-- H5 游客实时预览容器 (已彻底解除最大宽度锁死，让PC端1200px满血平铺) -->
    <div id="mobile-live-container" class="hidden w-full bg-gray-50 min-h-screen pb-safe"></div>

    <!-- 全屏图文组合编辑器 (富文本功能完美保留无损) -->
    <div id="combo-editor-modal" class="fixed inset-0 bg-gray-100 z-[150] hidden flex-col">
        <div class="h-16 bg-white shadow-sm flex items-center justify-between px-6 border-b shrink-0">
            <h2 class="text-lg font-bold text-gray-800">
                <i class="fas fa-cubes text-primary mr-2"></i>全能图文组合创作
            </h2>
            <div class="flex gap-3">
                <button onclick="app.closeComboEditor()" class="px-5 py-1.5 text-gray-600 bg-gray-100 rounded-full hover:bg-gray-200 transition-all font-medium">取消</button>
                <button onclick="app.saveCombo()" class="px-5 py-1.5 bg-primary text-white rounded-full hover:bg-blue-600 shadow transition-all font-bold">确认组合并添加</button>
            </div>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 flex flex-col items-center">
            <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-8 flex flex-col gap-6">
                
                <div class="flex flex-col gap-2">
                    <input type="text" id="combo-title" placeholder="输入大标题 (选填)" class="w-full text-2xl font-bold border-none outline-none placeholder-gray-300 focus:ring-0 px-1">
                </div>
                
                <div class="flex flex-col shadow-sm rounded-lg overflow-hidden border border-gray-200">
                    <div class="flex flex-wrap gap-2 items-center bg-gray-50 p-2.5 border-b border-gray-200">
                        
                        <select onchange="app.execCmd('fontName', this.value)" class="bg-white border border-gray-300 rounded px-2 py-1 text-sm outline-none text-gray-700 cursor-pointer hover:border-primary font-medium">
                            <option value="">默认字体</option>
                            <option value="SimSun">宋体</option>
                            <option value="KaiTi">楷体</option>
                            <option value="Microsoft YaHei">微软雅黑</option>
                            <option value="FangSong">仿宋</option>
                        </select>
                        
                        <select onchange="app.execCmd('fontSize', this.value)" class="bg-white border border-gray-300 rounded px-2 py-1 text-sm outline-none text-gray-700 cursor-pointer hover:border-primary font-medium">
                            <option value="">字号</option>
                            <option value="3">标准</option>
                            <option value="4">偏大</option>
                            <option value="5">大号</option>
                            <option value="6">特大</option>
                        </select>
                        
                        <div class="w-px h-5 bg-gray-300 mx-1"></div>
                        
                        <div class="flex items-center gap-1 cursor-pointer group relative" title="文字颜色">
                            <i class="fas fa-palette text-gray-500 group-hover:text-primary pl-1"></i>
                            <input type="color" onchange="app.execCmd('foreColor', this.value)" class="w-8 h-8 rounded border-none cursor-pointer p-0 bg-transparent">
                        </div>

                        <div class="w-px h-5 bg-gray-300 mx-1"></div>
                        
                        <button onmousedown="event.preventDefault(); app.execCmd('bold')" class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-200 text-gray-700 font-bold transition-all" title="加粗 (Ctrl+B)">B</button>
                        <button onmousedown="event.preventDefault(); app.execCmd('italic')" class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-200 text-gray-700 italic font-serif transition-all" title="倾斜 (Ctrl+I)">I</button>
                        <button onmousedown="event.preventDefault(); app.execCmd('underline')" class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-200 text-gray-700 underline transition-all" title="下划线 (Ctrl+U)">U</button>
                    </div>
                    
                    <div id="combo-text" contenteditable="true" class="w-full h-48 p-5 outline-none overflow-y-auto bg-white text-base text-gray-800 leading-relaxed rich-text-content" placeholder="在此输入文字，所有格式将被完美保留..."></div>
                </div>
                
                <div class="border-t pt-6 mt-2">
                    <div class="flex justify-between items-end mb-4">
                        <h3 class="font-bold text-gray-700 text-lg">多媒体资产与附件</h3>
                        <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">支持拖拽排序，向下滚动查看</span>
                    </div>
                    
                    <ul id="combo-items-list" class="flex flex-col gap-3 mb-4 min-h-[5px]"></ul>
                    
                    <div id="combo-drop-zone" class="relative w-full h-28 bg-blue-50/50 rounded-xl border-2 border-dashed border-blue-200 flex flex-col items-center justify-center hover:bg-blue-50 hover:border-primary transition-all group">
                        <input type="file" id="combo-file-input" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="app.handleComboFileSelect(event)">
                        <i class="fas fa-plus-circle text-3xl text-blue-300 group-hover:text-primary transition-colors mb-2"></i>
                        <p class="text-sm text-gray-500 font-medium">点击或将<span class="text-primary mx-1"> 图片 / 音视频 / PPT / 文档 </span>拖拽至此极速上传</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游客鉴权遮罩层 -->
    <div id="tourist-mask" class="fixed inset-0 bg-white/90 backdrop-blur-md z-40 flex flex-col items-center justify-center">
        <i class="fas fa-shield-alt text-6xl text-gray-300 mb-6"></i>
        <h3 class="text-2xl font-semibold text-gray-700">内容管理控制台</h3>
        <p class="text-sm text-gray-500 mt-3 text-center px-8 leading-relaxed">本后台仅供管理员访问，负责拼装内容、修改页面与更新活码。<br>若您是访客，请直接扫描独立二维码查看对应的内容。</p>
        <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="mt-8 bg-primary text-white px-8 py-3 rounded-full shadow-[0_4px_14px_0_rgba(30,144,255,0.39)] hover:bg-blue-600 transition-all font-bold text-lg tracking-wider">验证管理员身份</button>
    </div>

    <!-- 悬浮退出按钮 -->
    <button onclick="app.logout()" id="logout-float-btn" class="admin-only fixed bottom-8 right-8 w-14 h-14 bg-red-500 text-white rounded-full shadow-[0_8px_30px_rgb(239,68,68,0.4)] items-center justify-center hover:bg-red-600 transition-all z-50 hover:-translate-y-1">
        <i class="fas fa-power-off text-xl"></i>
    </button>

    <!-- 管理员登录弹窗 -->
    <div id="login-modal" class="fixed inset-0 bg-black/60 z-[200] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-8 w-80 shadow-2xl transform transition-all relative">
            <h3 class="text-2xl font-black mb-8 text-center text-gray-800 tracking-wide">系统鉴权</h3>
            <div class="mb-8">
                <label class="block text-sm text-gray-500 mb-2 font-medium">安全校验口令</label>
                <input type="password" id="admin-pwd" class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-primary/50 transition-all text-lg font-medium" placeholder="请输入密码">
            </div>
            <div class="flex gap-4">
                <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200 transition-all font-bold">取消</button>
                <button onclick="app.login()" class="flex-1 py-3 bg-primary text-white rounded-xl hover:bg-blue-600 transition-all font-bold shadow-md tracking-wider">登录</button>
            </div>
        </div>
    </div>

    <!-- 文档与多媒体全屏预览弹窗 -->
    <div id="preview-modal" class="fixed inset-0 bg-black/90 z-[250] hidden flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="absolute top-6 right-6">
            <button onclick="app.closePreview()" class="text-white hover:text-red-400 text-4xl transition-colors">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>
        <div id="preview-content" class="w-11/12 h-5/6 bg-transparent rounded-2xl overflow-hidden flex items-center justify-center relative"></div>
    </div>

    <!-- 核心业务逻辑脚本 -->
    <script>
        const app = {
            state: {
                currentMode: 'text', 
                blocks: [], 
                isAdmin: false,
                token: sessionStorage.getItem('adminToken') || '',
                liveUrl: window.location.origin + window.location.pathname, 
                comboDraft: { title: '', text: '', items: [] },
                
                draggedItemIndex: null,
                draggedMainIndex: null,
                
                isLiveMode: false,
                urlConfig: { mode: 'live', staticUrl: '' }
            },

            configs: {
                text: { icon: 'fa-keyboard', title: '添加富文本', hint: '支持保留粘贴的所有颜色格式', accept: null },
                url: { icon: 'fa-link', title: '配置网址引擎', hint: '支持静态跳转与活码分发', accept: null },
                image: { icon: 'fa-image', title: '添加独立图片', hint: '支持 png/jpg 等格式', accept: 'image/*' },
                audio: { icon: 'fa-music', title: '添加独立音频', hint: '在线流畅播放', accept: 'audio/*' },
                video: { icon: 'fa-video', title: '添加独立视频', hint: '原生UI沉浸式播放', accept: 'video/*' },
                document: { icon: 'fa-file-word', title: '添加独立文档', hint: '支持 PPT/Word 跨设备在线预览', accept: '.doc,.docx,.ppt,.pptx,.xls,.xlsx,.pdf,.wps' },
                form: { icon: 'fa-table', title: '上传表单', hint: '支持直接上传编辑好的表格文件 (Excel/CSV等)', accept: '.xls,.xlsx,.csv,.doc,.docx,.pdf' },
                uploaded: { icon: 'fa-cloud', title: '后台资源池', hint: '可查阅/清理所有已上传资产', accept: null }
            },

            async init() {
                const urlParams = new URLSearchParams(window.location.search);
                
                if (urlParams.get('view') === 'live') {
                    this.state.isLiveMode = true;
                    document.getElementById('mobile-live-container').classList.remove('hidden');
                    // 解除移动端宽度限制，全尺寸伸缩铺开
                    document.getElementById('mobile-live-container').classList.add('flex', 'flex-col');
                    document.getElementById('tourist-mask').classList.add('hidden');
                    await this.fetchCloudConfig();
                    
                    app.renderLiveH5();
                    return;
                }

                if (this.state.token) {
                    await this.verifyTokenSilent();
                } else {
                    this.enforceTouristMode();
                }

                this.bindGlobalDragAndDrop();
                this.updateNavUI();
                this.renderInputArea();
                
                await this.fetchCloudConfig();
            },

            // ================= 身份鉴权控制 =================
            async login() {
                const pwd = document.getElementById('admin-pwd').value;
                try {
                    const res = await fetch('/api/auth', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ password: pwd }) 
                    });
                    
                    if (res.ok) {
                        this.state.token = pwd;
                        sessionStorage.setItem('adminToken', pwd);
                        document.getElementById('login-modal').classList.add('hidden');
                        this.enableAdminMode();
                    } else {
                        alert('⚠️ 鉴权失败：密码错误，请检查您的设置。');
                    }
                } catch (e) { 
                    alert('后端连接异常，请确认部署状态'); 
                }
            },
            
            async verifyTokenSilent() {
                try {
                    const res = await fetch('/api/auth', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ password: this.state.token }) 
                    });
                    if (res.ok) {
                        this.enableAdminMode();
                    } else {
                        this.enforceTouristMode();
                    }
                } catch (e) { 
                    this.enforceTouristMode(); 
                }
            },
            
            logout() { 
                this.state.token = ''; 
                sessionStorage.removeItem('adminToken'); 
                this.enforceTouristMode(); 
            },
            
            enableAdminMode() {
                this.state.isAdmin = true; 
                document.body.classList.add('is-admin');
                document.getElementById('tourist-mask').classList.add('hidden');
                if (this.state.currentMode === 'uploaded') {
                    this.renderInputArea();
                }
            },
            
            enforceTouristMode() {
                this.state.isAdmin = false; 
                document.body.classList.remove('is-admin');
                document.getElementById('tourist-mask').classList.remove('hidden');
            },

            // ================= 云端通讯引擎 =================
            async fetchCloudConfig() {
                try {
                    const res = await fetch('/api/config');
                    if (res.ok) {
                        this.state.blocks = await res.json() || [];
                        if (!this.state.isLiveMode) {
                            this.renderBlocks();
                        }
                    }
                } catch (e) {
                    console.error('配置加载失败', e);
                }
            },
            
            async syncToCloud() {
                if (!this.state.isAdmin) return;
                try {
                    const res = await fetch('/api/config', { 
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'application/json', 
                            'Authorization': `Bearer ${this.state.token}` 
                        }, 
                        body: JSON.stringify(this.state.blocks) 
                    });
                    if (res.ok) {
                        alert('🚀 全局流水线同步成功！您的所有资源活码已全域生效。');
                    } else {
                        alert('发布失败，请检查网络');
                    }
                } catch (e) {
                    alert('同步网络断开');
                }
            },
            
            // ================= 【极速切片并发上传】=================
            async uploadFilesConcurrent(files, progressCallback) {
                if (!this.state.isAdmin) return [];
                
                const totalSize = Array.from(files).reduce((sum, f) => sum + f.size, 0);
                const loadedMap = new Map();
                const CHUNK_SIZE = 15 * 1024 * 1024; 
                
                const uploadPromises = Array.from(files).map(async (file) => {
                    
                    if (file.size <= CHUNK_SIZE) {
                        return new Promise((resolve) => {
                            const formData = new FormData(); 
                            formData.append('file', file);
                            
                            const xhr = new XMLHttpRequest();
                            xhr.open('POST', '/api/upload', true);
                            xhr.setRequestHeader('Authorization', `Bearer ${this.state.token}`);
                            
                            xhr.upload.onprogress = (event) => {
                                if (event.lengthComputable) {
                                    loadedMap.set(file.name, event.loaded);
                                    const currentLoaded = Array.from(loadedMap.values()).reduce((a, b) => a + b, 0);
                                    const percent = Math.floor((currentLoaded / totalSize) * 100);
                                    if (progressCallback) progressCallback(percent);
                                }
                            };
                            
                            xhr.onload = () => {
                                if (xhr.status === 200) {
                                    try {
                                        resolve({ file: file, data: JSON.parse(xhr.responseText) });
                                    } catch(e) {
                                        resolve({ file: file, data: null });
                                    }
                                } else {
                                    try {
                                        const errData = JSON.parse(xhr.responseText);
                                        alert(`上传失败: ${errData.message}`);
                                    } catch(e) {}
                                    resolve({ file: file, data: null });
                                }
                            };
                            
                            xhr.onerror = () => { resolve({ file: file, data: null }); };
                            xhr.send(formData);
                        });
                        
                    } else {
                        try {
                            let res = await fetch('/api/upload/init', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.state.token}` },
                                body: JSON.stringify({ filename: file.name, mimeType: file.type || 'application/octet-stream' })
                            });
                            
                            const initData = await res.json();
                            if (!initData.success) throw new Error(initData.message || '初始化分片失败');
                            const { key, uploadId } = initData;

                            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                            const parts = [];
                            let fileLoaded = 0;

                            for (let i = 0; i < totalChunks; i++) {
                                const start = i * CHUNK_SIZE;
                                const end = Math.min(start + CHUNK_SIZE, file.size);
                                const chunk = file.slice(start, end);

                                const chunkData = await new Promise((resolve, reject) => {
                                    const xhr = new XMLHttpRequest();
                                    xhr.open('POST', `/api/upload/part?key=${encodeURIComponent(key)}&uploadId=${encodeURIComponent(uploadId)}&partNumber=${i + 1}`, true);
                                    xhr.setRequestHeader('Authorization', `Bearer ${this.state.token}`);
                                    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                                    
                                    let lastChunkLoaded = 0;
                                    xhr.upload.onprogress = (event) => {
                                        if (event.lengthComputable) {
                                            const diff = event.loaded - lastChunkLoaded;
                                            lastChunkLoaded = event.loaded;
                                            fileLoaded += diff;
                                            
                                            loadedMap.set(file.name, fileLoaded);
                                            const currentLoaded = Array.from(loadedMap.values()).reduce((a, b) => a + b, 0);
                                            const percent = Math.floor((currentLoaded / totalSize) * 100);
                                            
                                            if (progressCallback) progressCallback(percent);
                                        }
                                    };
                                    
                                    xhr.onload = () => {
                                        if (xhr.status === 200) { 
                                            resolve(JSON.parse(xhr.responseText).part); 
                                        } else { 
                                            reject(new Error(`分片 ${i+1} 云端拒收`)); 
                                        }
                                    };
                                    xhr.onerror = () => reject(new Error('分片网络中断'));
                                    xhr.send(chunk);
                                });
                                parts.push(chunkData);
                            }

                            res = await fetch('/api/upload/complete', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.state.token}` },
                                body: JSON.stringify({ key, uploadId, parts })
                            });
                            
                            const compData = await res.json();
                            if (!compData.success) throw new Error(compData.message || '合并分片失败');
                            
                            return { file: file, data: { success: true, url: compData.url, name: file.name, size: file.size } };
                            
                        } catch (e) {
                            console.error(e);
                            alert(`大文件 [${file.name}] 上传失败: \n${e.message}`);
                            return { file: file, data: null };
                        }
                    }
                });
                
                return await Promise.all(uploadPromises);
            },
            
            async deleteCloudFile(url) {
                if (!url.startsWith('/r2/')) return;
                try {
                    await fetch('/api/file', { 
                        method: 'DELETE', 
                        headers: { 
                            'Content-Type': 'application/json', 
                            'Authorization': `Bearer ${this.state.token}` 
                        }, 
                        body: JSON.stringify({ url: url }) 
                    });
                } catch (e) {
                    console.error('缓存清理异常', e);
                }
            },

            // ================= 工具函数 =================
            escapeHtml(unsafe) { 
                return unsafe.toString()
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;"); 
            },
            
            stripHtml(html) {
                let tmp = document.createElement("DIV");
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || "";
            },

            // ================= 防御性全局拖拽 =================
            bindGlobalDragAndDrop() {
                const dropZone = document.body; 
                
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, e => { 
                        e.preventDefault(); 
                    }, false);
                });
                
                dropZone.addEventListener('dragenter', (e) => { 
                    if (!this.state.isAdmin) return;
                    const comboModal = document.getElementById('combo-editor-modal');
                    if (comboModal && comboModal.classList.contains('hidden')) {
                        const panel = document.getElementById('input-panel');
                        if (panel) panel.classList.add('drag-active'); 
                    } else {
                        const comboUI = document.getElementById('combo-drop-zone');
                        if (comboUI) comboUI.classList.add('drag-active');
                    }
                }, false);
                
                dropZone.addEventListener('dragleave', (e) => { 
                    if (e.relatedTarget === null) {
                        const panel = document.getElementById('input-panel');
                        const comboUI = document.getElementById('combo-drop-zone');
                        if (panel) panel.classList.remove('drag-active');
                        if (comboUI) comboUI.classList.remove('drag-active');
                    }
                }, false);
                
                dropZone.addEventListener('drop', (e) => {
                    const panel = document.getElementById('input-panel');
                    const comboUI = document.getElementById('combo-drop-zone');
                    if (panel) panel.classList.remove('drag-active');
                    if (comboUI) comboUI.classList.remove('drag-active');
                    
                    let files = [];
                    if (e.dataTransfer && e.dataTransfer.files) {
                        files = Array.from(e.dataTransfer.files);
                    } else if (e.target && e.target.files) {
                        files = Array.from(e.target.files);
                    }
                    
                    if (this.state.isAdmin && files.length > 0) {
                        const safeEvent = { target: { files: files } };
                        const comboModal = document.getElementById('combo-editor-modal');
                        
                        if (comboModal && !comboModal.classList.contains('hidden')) {
                            this.handleComboFileSelect(safeEvent); 
                        } else {
                            this.handleMainFileSelect(safeEvent);
                        }
                    }
                }, false);
            },

            // ================= 【点对点独立下载功能】 =================
            // 取代了原有的 ZIP 总打包功能，实现单个文件精准极速下载
            async downloadSingleFile(url, filename) {
                try {
                    const btn = event.currentTarget;
                    const oldHtml = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>极速下载中...';
                    
                    const response = await fetch(url);
                    const blob = await response.blob();
                    saveAs(blob, filename);
                    
                    btn.innerHTML = '<i class="fas fa-check mr-2"></i>下载完成';
                    setTimeout(() => { btn.innerHTML = oldHtml; }, 2000);
                } catch(e) {
                    alert("下载失败，请检查网络连接");
                }
            },

            // PDF 极速无损排版转换引擎
            async downloadTextAsPDF(blockId, filename) {
                const el = document.getElementById(`content-${blockId}`);
                if(!el) return alert('内容加载失败');
                
                const btn = event.currentTarget;
                const oldHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>PDF引擎高清渲染中...';
                
                // 【核心修复】：创建一个绝对定位在 top:0 的虚拟容器，隔离当前页面的 scrollY 滚动条偏移，彻底解决 html2canvas 截出大量顶部空白页的暗病。
                const tempDiv = document.createElement('div');
                tempDiv.className = 'rich-text-content'; // 保留富文本格式
                tempDiv.innerHTML = el.innerHTML;
                tempDiv.style.position = 'absolute';
                tempDiv.style.top = '0'; // 必须为0，不能是负数，否则导致截图引擎将负高度区域视为空白计算入内
                tempDiv.style.left = '-9999px'; // 移出视口即可
                tempDiv.style.width = '800px'; 
                tempDiv.style.backgroundColor = '#ffffff';
                tempDiv.style.padding = '30px';
                document.body.appendChild(tempDiv);
                
                try {
                    const pdfBlob = await html2pdf().set({
                        margin: [15, 15, 15, 15],
                        filename: filename + '.pdf',
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { 
                            scale: 2, 
                            useCORS: true, 
                            logging: false,
                            scrollY: 0, // 【双保险】强制引擎忽视浏览器的垂直滚动偏移
                            windowY: 0
                        },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    }).from(tempDiv).output('blob');
                    
                    saveAs(pdfBlob, filename + '.pdf');
                } catch (e) {
                    alert("PDF生成受限: " + e.message);
                } finally {
                    btn.innerHTML = oldHtml;
                    // 用完即刻销毁虚拟层
                    document.body.removeChild(tempDiv);
                }
            },

            // ================= 全能组合富文本编辑器 (防失焦修复版) =================
            execCmd(command, value = null) {
                if(!value && (command === 'fontName' || command === 'fontSize' || command === 'foreColor')) {
                    return;
                }
                document.execCommand(command, false, value);
                
                // 智能判定并恢复焦点，确保富文本不失焦
                const comboEl = document.getElementById('combo-text');
                if (comboEl && comboEl.offsetParent !== null) {
                    comboEl.focus();
                } else {
                    const richEl = document.getElementById('input-data-rich');
                    if (richEl) richEl.focus();
                }
            },

                this.state.comboDraft = { title: '', text: '', items: [] };

                document.getElementById('combo-text').innerHTML = ''; 
                
                document.querySelectorAll('#combo-editor-modal select').forEach(select => select.value = "");

                document.getElementById('combo-editor-modal').classList.remove('hidden'); 
                document.getElementById('combo-editor-modal').classList.add('flex');

            async handleComboFileSelect(event) {
                const files = event.target.files || (event.dataTransfer ? event.dataTransfer.files : null);
                if (!files || files.length === 0) return;
                
                const dropZone = document.getElementById('combo-drop-zone'); 
                const originHtml = dropZone.innerHTML;
                
                dropZone.innerHTML = `
                    <i class="fas fa-spinner fa-spin text-3xl text-primary mb-2"></i>
                    <p class="text-sm font-bold tracking-widest text-primary" id="combo-upload-status">排队就绪中...</p>
                `;
                
                const results = await this.uploadFilesConcurrent(files, (percent) => {
                    const statusText = document.getElementById('combo-upload-status');
                    if (statusText) statusText.innerText = `极速网络上传中: ${percent}%`;
                });
                
                results.forEach(res => {
                    if (res.data && res.data.success) {
                        let type = 'document';
                        if (res.file.type.startsWith('image/')) {
                            type = 'image'; 
                        } else if (res.file.type.startsWith('audio/')) {
                            type = 'audio'; 
                        } else if (res.file.type.startsWith('video/')) {
                            type = 'video';
                        }
                        
                        this.state.comboDraft.items.push({ 
                            id: 'item_' + Date.now() + Math.floor(Math.random()*100), 
                            type: type, 
                            url: res.data.url, 
                            name: res.data.name, 
                            size: (res.data.size/1024/1024).toFixed(2) + ' MB' 
                        });
                    }
                });
                
                dropZone.innerHTML = originHtml; 
                this.renderComboItems();
            },
            
            removeComboItem(index) { 
                this.deleteCloudFile(this.state.comboDraft.items[index].url); 
                this.state.comboDraft.items.splice(index, 1); 
                this.renderComboItems(); 
            },
            
            handleDragStart(e, index) { 
                this.state.draggedItemIndex = index; 
                e.dataTransfer.effectAllowed = "move"; 
                e.target.classList.add('sortable-ghost'); 
            },
            
            handleDragOver(e) { 
                e.preventDefault(); 
                e.dataTransfer.dropEffect = "move"; 
            },
            
            handleDrop(e, targetIndex) {
                e.preventDefault(); 
                const sourceIndex = this.state.draggedItemIndex;
                if (sourceIndex !== null && sourceIndex !== targetIndex) {
                    const items = this.state.comboDraft.items; 
                    const [removed] = items.splice(sourceIndex, 1); 
                    items.splice(targetIndex, 0, removed); 
                    this.renderComboItems();
                }
            },
            
            handleDragEnd(e) { 
                e.target.classList.remove('sortable-ghost'); 
                this.state.draggedItemIndex = null; 
            },
            
            renderComboItems() {
                const list = document.getElementById('combo-items-list'); 
                list.innerHTML = '';
                
                this.state.comboDraft.items.forEach((item, index) => {
                    const li = document.createElement('li'); 
                    li.draggable = true;
                    li.className = 'flex justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-200 cursor-move hover:shadow-md transition-all group';
                    
                    li.ondragstart = (e) => this.handleDragStart(e, index); 
                    li.ondragover = (e) => this.handleDragOver(e); 
                    li.ondrop = (e) => this.handleDrop(e, index); 
                    li.ondragend = (e) => this.handleDragEnd(e);
                    
                    let icon = 'fa-file-alt text-gray-500'; 
                    if(item.type === 'image') icon = 'fa-image text-blue-500'; 
                    if(item.type === 'video') icon = 'fa-video text-purple-500'; 
                    if(item.type === 'audio') icon = 'fa-music text-green-500';

                    `;

                            <i class="fas fa-file-excel text-5xl text-gray-300 mb-3 group-hover:text-green-500 transition-colors"></i>
                            <p class="text-base text-gray-500 font-medium">点击或将编辑好的<span class="text-green-500 font-bold mx-1">表格/表单文件</span>直接拖拽到这里极速上传</p>
                        </div>
                        <div id="upload-progress-ui" class="hidden w-full h-40 bg-blue-50/50 rounded-2xl border-2 border-primary flex flex-col items-center justify-center shadow-inner mt-4">
                            <i class="fas fa-spinner fa-spin text-4xl text-primary mb-3"></i>
                            <span id="upload-status-text" class="text-primary font-black text-base tracking-widest">排队解析中...</span>
                        </div>
                    `;
                } else if (mode === 'uploaded') {
                    area.innerHTML = `
                        <div class="w-full max-h-[300px] overflow-y-auto no-scrollbar">
                            <ul class="flex flex-col gap-3">
                                ${this.state.blocks.map(b => `
                                    <li class="bg-gray-50 p-4 rounded-xl border border-gray-100 flex justify-between items-center hover:bg-gray-100 transition-colors">
                                        <span class="truncate w-4/5 font-bold text-gray-700 text-[15px]">
                                            ${b.type === 'text' || b.type === 'url' ? this.stripHtml(b.content).substring(0,30) + '...' : (b.type === 'combo' ? '[组合] ' + b.content.title : b.content.name || b.content.title)}
                                        </span>
                                        <span class="text-xs bg-gray-200 rounded-md px-2 py-1 text-gray-600 font-bold">${b.type}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    `;
                } else {
                    area.innerHTML = `
                        <div id="upload-drop-ui" class="relative w-full h-40 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center hover:bg-blue-50 hover:border-primary transition-all group cursor-pointer">
                            <input type="file" accept="${cfg.accept}" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="app.handleMainFileSelect(event)">
                            <i class="fas fa-cloud-upload-alt text-5xl text-gray-300 mb-3 group-hover:text-primary transition-colors"></i>
                            <p class="text-base text-gray-500 font-medium">点击或将文件直接拖拽到这里极速解析</p>
                        </div>
                        <div id="upload-progress-ui" class="hidden w-full h-40 bg-blue-50/50 rounded-2xl border-2 border-primary flex flex-col items-center justify-center shadow-inner">
                            <i class="fas fa-spinner fa-spin text-4xl text-primary mb-3"></i>
                            <span id="upload-status-text" class="text-primary font-black text-base tracking-widest">排队就绪中...</span>
                        </div>
                    `;
                }
            },
            
            switchUrlMode(mode) {
                this.state.urlConfig.mode = mode;
                if (mode === 'static') {
                    this.state.urlConfig.staticUrl = document.getElementById('input-data')?.value || '';
                } else {
                    this.state.urlConfig.staticUrl = '';
                }
                this.updateNavUI();
                this.renderInputArea();
            },
            
            handleStaticUrlInput(val) {
                let fullUrl = val.trim();
                if (fullUrl && !/^https?:\/\//i.test(fullUrl)) {
                    fullUrl = 'https://' + fullUrl;
                }
                this.state.urlConfig.staticUrl = fullUrl;
            },

            async handleMainFileSelect(event) {
                if (!this.state.isAdmin) return;
                const files = event.target.files || (event.dataTransfer ? event.dataTransfer.files : null);
                if (!files || files.length === 0) return;
                
                document.getElementById('upload-drop-ui').classList.add('hidden'); 
                document.getElementById('upload-progress-ui').classList.remove('hidden');
                
                const results = await this.uploadFilesConcurrent(files, (percent) => {
                    const statusText = document.getElementById('upload-status-text');
                    if (statusText) statusText.innerText = `极速网络上传中: ${percent}%`;
                });
                
                results.forEach(res => {
                    if (res.data && res.data.success) {
                        let type = 'document';
                        
                        // 【强制表单类型归类】
                        if (this.state.currentMode === 'form') {
                            type = 'form';
                        } else {
                            if (res.file.type.startsWith('image/')) {
                                type = 'image'; 
                            } else if (res.file.type.startsWith('audio/')) {
                                type = 'audio'; 
                            } else if (res.file.type.startsWith('video/')) {
                                type = 'video';
                            }
                        }
                        
                        this.addBlockToState(type, { 
                            url: res.data.url, 
                            name: res.data.name, 
                            size: (res.data.size/1024/1024).toFixed(2) + ' MB' 
                        });
                    }
                });
                
                document.getElementById('upload-drop-ui').classList.remove('hidden'); 
                document.getElementById('upload-progress-ui').classList.add('hidden');
            },
            
            addCurrentBlock() {
                if (!this.state.isAdmin) return;
                const mode = this.state.currentMode;
                
                if (mode === 'text') {
                    // 读取富文本编辑器的 innerHTML 来保留格式
                    let val = document.getElementById('input-data-rich').innerHTML.trim();
                    let textOnly = this.stripHtml(val).trim();
                    // 防止仅提交空白标签
                    if (val && (textOnly || val.includes('<img'))) {
                        this.addBlockToState('text', val);
                        document.getElementById('input-data-rich').innerHTML = '';
                    }
                } 
                else if (mode === 'url') {
                    let val = document.getElementById('input-data').value.trim();
                    let isStaticUrl = false;
                    if (this.state.urlConfig.mode === 'static') {
                        isStaticUrl = true;
                    }

                    if (mode === 'url' && val && !/^https?:\/\//i.test(val)) {
                        val = 'https://' + val;
                    }
                    if (val) { 
                        if (isStaticUrl) {
                            this.addBlockToState('url', { url: val, isStatic: true }); 
                        } else {
                            this.addBlockToState(mode, val);
                        }
                        document.getElementById('input-data').value = ''; 
                    }
                }
            },
            
            addBlockToState(type, content) {
                this.state.blocks.push({ id: 'block_' + Date.now() + Math.floor(Math.random()*100), type: type, content: content });
                this.renderBlocks(); 
                if (this.state.currentMode === 'uploaded') {
                    this.renderInputArea();
                }
            },
            
            removeBlock(id) {
                if (!this.state.isAdmin) return;
                const target = this.state.blocks.find(b => b.id === id);
                if (target) {
                    if (target.type === 'combo' && target.content.items) {
                        target.content.items.forEach(item => this.deleteCloudFile(item.url));
                    } else if (target.content.url) {
                        this.deleteCloudFile(target.content.url);
                    }
                }
                this.state.blocks = this.state.blocks.filter(b => b.id !== id);
                this.renderBlocks(); 
                if (this.state.currentMode === 'uploaded') {
                    this.renderInputArea();
                }
            },

            // ================= 视图渲染与多媒体预览 =================
            openDocumentPreview(url, name) {
                const ext = name.split('.').pop().toLowerCase();
                const absoluteUrl = url.startsWith('http') ? url : (window.location.origin + url);
                const contentBox = document.getElementById('preview-content');
                document.getElementById('preview-modal').classList.remove('hidden');
                
                let inner = '';
                if (ext === 'pdf') {
                    inner = `<iframe src="${url}" class="w-full h-full border-none"></iframe>`;
                } else if (['doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx', 'csv'].includes(ext)) {
                    inner = `<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(absoluteUrl)}" class="w-full h-full border-none bg-white"></iframe>`;
                } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                    inner = `<img src="${url}" class="max-w-full max-h-full object-contain">`;
                } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
                    inner = `<video src="${url}" controls autoplay class="max-w-full max-h-full"></video>`;
                } else {
                    inner = `
                        <div class="text-center bg-white p-12 rounded-2xl shadow-2xl">
                            <i class="fas fa-file text-7xl text-gray-300 mb-6"></i>
                            <p class="text-gray-600 mb-6 font-medium text-lg">不支持在浏览器直接预览此格式</p>
                            <a href="${url}" download class="bg-primary text-white px-8 py-3 rounded-full shadow-lg font-bold text-lg hover:bg-blue-600 transition-colors">直接下载到本地</a>
                        </div>
                    `;
                }
                contentBox.innerHTML = inner;
            },
            
            closePreview() { 
                document.getElementById('preview-modal').classList.add('hidden'); 
                document.getElementById('preview-content').innerHTML = ''; 
            },

            // 【访客端渲染器：嵌入独立提取下载，废除总打包】
            generateBlockHtml(block, isLive = false) {
                let html = '';
                // 宽屏模式开启，解除约束边界，让内容霸屏
                const baseClass = isLive ? 'w-full mb-6 bg-white p-6 md:p-8 rounded-[20px] shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-gray-100 overflow-hidden relative' : 'flex-1';
                
                const isStaticUrl = block.type === 'url' && typeof block.content === 'object' && block.content.isStatic;
                const urlString = isStaticUrl ? block.content.url : block.content;

                if (block.type === 'combo') {
                    const c = block.content; 
                    let comboInner = '';
                    
                    if (c.title) {
                        comboInner += `<h2 class="text-2xl font-black text-gray-800 mb-4 leading-tight">${this.escapeHtml(c.title)}</h2>`;
                    }
                    if (c.text) {
                        comboInner += `<div class="leading-relaxed mb-6 opacity-95 break-words rich-text-content text-[15px]">${c.text}</div>`;
                    }
                    if (c.items && c.items.length > 0) {
                        comboInner += `<div class="flex flex-col gap-4 mt-5 border-t border-gray-100 pt-6">`;
                        c.items.forEach(item => { 
                            comboInner += `<div class="rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50 hover:bg-white hover:shadow-md transition-all">${this.generateBlockHtml({type: item.type, content: item}, false)}</div>`; 
                        });
                        comboInner += `</div>`;
                    }
                    
                    // 为组合图文嵌入 PDF 极速下载按键
                    let downloadBtn = isLive ? `<button id="btn-down-${block.id}" onclick="app.downloadTextAsPDF('${block.id}', '${this.escapeHtml(c.title || '图文组合档案')}')" class="mt-5 w-full bg-indigo-50 text-indigo-600 hover:bg-indigo-100 py-3 rounded-xl font-bold transition-colors flex items-center justify-center text-[15px] shadow-sm tracking-wide"><i class="fas fa-file-pdf mr-2 text-lg"></i>保存此图文为 PDF 文档</button>` : '';
                    
                    return `
                        <div class="${baseClass} relative pl-4">
                            <div class="absolute top-0 left-0 w-1.5 h-full bg-primary rounded-l-2xl"></div>
                            <div id="content-${block.id}">${comboInner}</div>
                            ${downloadBtn}
                        </div>
                    `;
                }

                switch (block.type) {
                    case 'text': 
                        // HTML 透传，保持图文格式，避免 escapeHtml 转义破坏原格式
                        let downloadBtnText = isLive ? `<button id="btn-down-${block.id}" onclick="app.downloadTextAsPDF('${block.id}', '图文内容归档')" class="mt-5 w-full bg-blue-50 text-blue-600 hover:bg-blue-100 py-3 rounded-xl font-bold transition-colors flex items-center justify-center text-[15px] shadow-sm tracking-wide"><i class="fas fa-file-pdf mr-2 text-lg"></i>保存为高清 PDF</button>` : '';
                        html = `<div class="${baseClass}"><div id="content-${block.id}" class="text-gray-800 leading-relaxed text-[15px] rich-text-content break-words w-full overflow-hidden">${block.content}</div>${downloadBtnText}</div>`; 
                        break;
                    case 'url': 
                        html = `<div class="${baseClass}"><a href="${this.escapeHtml(urlString)}" target="_blank" class="text-blue-500 underline flex items-center break-all hover:text-blue-600 transition-colors font-bold text-[15px]"><i class="fas fa-external-link-alt mr-2 shrink-0"></i> ${this.escapeHtml(urlString)}</a></div>`; 
                        break;
                    case 'image': 
                        let downloadBtnImg = isLive ? `<button onclick="app.downloadSingleFile('${block.content.url}', '${block.content.name}')" class="mt-5 w-full bg-green-50 text-green-600 hover:bg-green-100 py-3 rounded-xl font-bold transition-colors flex items-center justify-center text-[15px] shadow-sm tracking-wide"><i class="fas fa-download mr-2 text-lg"></i>极速下载保存原图</button>` : '';
                        html = `<div class="${baseClass} p-5"><img src="${block.content.url}" class="w-full rounded-xl cursor-pointer hover:opacity-90 hover:shadow-lg transition-all object-cover max-h-[800px] bg-gray-100" onclick="app.openDocumentPreview('${block.content.url}', '${block.content.name}')">${downloadBtnImg}</div>`; 
                        break;
                    case 'audio': 
                        let downloadBtnAudio = isLive ? `<button onclick="app.downloadSingleFile('${block.content.url}', '${block.content.name}')" class="mt-5 w-full bg-yellow-50 text-yellow-600 hover:bg-yellow-100 py-3 rounded-xl font-bold transition-colors flex items-center justify-center text-[15px] shadow-sm tracking-wide"><i class="fas fa-download mr-2 text-lg"></i>极速下载原格式音频</button>` : '';
                        html = `<div class="${baseClass} flex flex-col p-5 bg-gray-50 rounded-2xl border border-gray-100"><span class="text-[15px] font-bold text-gray-800 mb-4 truncate px-2 border-l-4 border-green-500 pl-3 leading-none flex items-center"><i class="fas fa-music text-green-500 mr-2.5 text-lg"></i>${block.content.name}</span><audio controls src="${block.content.url}" class="w-full outline-none h-12 rounded-full bg-white shadow-sm border border-gray-200"></audio>${downloadBtnAudio}</div>`; 
                        break;
                    case 'video': 
                        let downloadBtnVideo = isLive ? `<button onclick="app.downloadSingleFile('${block.content.url}', '${block.content.name}')" class="mt-4 w-full bg-purple-50 text-purple-600 hover:bg-purple-100 py-3 rounded-xl font-bold transition-colors flex items-center justify-center text-[15px] shadow-sm tracking-wide"><i class="fas fa-download mr-2 text-lg"></i>极速下载视频文件</button>` : '';
                        html = `<div class="${baseClass} bg-black flex flex-col justify-center p-0 m-0 relative group rounded-2xl overflow-hidden shadow-inner"><video src="${block.content.url}" controls class="w-full max-h-[700px] object-contain"></video>${downloadBtnVideo ? `<div class="p-5 bg-white border-t border-gray-100">${downloadBtnVideo}</div>` : ''}</div>`; 
                        break;
                    case 'document': 
                    case 'form': 
                        // 在游客端渲染宽大的内嵌独立下载提取按钮，表单文件也归为这一类提取
                        let downloadBtnDoc = isLive ? `<button onclick="app.downloadSingleFile('${block.content.url}', '${block.content.name}')" class="text-xs md:text-sm bg-primary text-white px-6 py-2.5 rounded-xl hover:bg-blue-600 text-center font-bold shadow-[0_4px_15px_rgba(30,144,255,0.3)] transition-all flex items-center"><i class="fas fa-download mr-1.5"></i>极速下载提取</button>` : `<button onclick="app.downloadSingleFile('${block.content.url}', '${block.content.name}')" class="text-xs bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-600 text-center font-bold shadow-md"><i class="fas fa-download mr-1"></i>下载</button>`;
                        html = `
                            <div class="${baseClass} flex items-center bg-gray-50 rounded-2xl p-5 hover:bg-white transition-colors border border-gray-100">
                                <div class="w-14 h-14 bg-white shadow-sm text-red-500 rounded-xl flex items-center justify-center mr-4 shrink-0 border border-gray-100">
                                    <i class="fas ${block.type === 'form' ? 'fa-file-excel text-green-500' : 'fa-file-pdf'} text-3xl"></i>
                                </div>
                                <div class="flex flex-col flex-1 overflow-hidden mr-4">
                                    <span class="text-[15px] font-bold text-gray-800 truncate">${block.content.name}</span>
                                    <span class="text-xs text-gray-400 mt-1.5 font-medium">${block.content.size} · 点击右侧预览</span>
                                </div>
                                <div class="flex flex-col md:flex-row gap-2.5 shrink-0">
                                    <button onclick="app.openDocumentPreview('${block.content.url}', '${block.content.name}')" class="text-xs md:text-sm bg-gray-200 px-5 py-2.5 rounded-xl text-gray-700 hover:bg-gray-300 font-bold transition-all shadow-sm">在线查阅</button>
                                    ${downloadBtnDoc}
                                </div>
                            </div>`; 
                        break;
                }
                return html;
            },

            // ================= 核心渲染：【终极压扁版】单排横贯极简卡片展示 =================
            renderBlocks() {
                const container = document.getElementById('blocks-container');
                if (!container) return;
                
                if (this.state.blocks.length === 0) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-48 text-gray-400 w-full col-span-full">
                            <i class="fas fa-layer-group text-5xl mb-4 opacity-30"></i>
                            <p class="text-sm font-medium tracking-widest">流水线空空如也</p>
                        </div>
                    `; 
                    return;
                }
                
                container.innerHTML = '';
                
                this.state.blocks.forEach((block, index) => {
                    const blockEl = document.createElement('div');
                    blockEl.draggable = true;
                    // 【绝对横铺】取消拉伸，限制内容在 96px 内极其紧凑的横跨铺开
                    blockEl.className = 'block-animate bg-white border border-gray-100 rounded-[16px] p-3 flex flex-row items-center group relative shadow-sm hover:shadow-md transition-all h-[96px] border-l-[4px] border-l-primary cursor-move w-full';
                    
                    blockEl.ondragstart = (e) => this.handleMainDragStart(e, index); 
                    blockEl.ondragover = (e) => this.handleMainDragOver(e); 
                    blockEl.ondrop = (e) => this.handleMainDrop(e, index); 
                    blockEl.ondragend = (e) => this.handleMainDragEnd(e);

                    let icon = 'fa-file'; let title = ''; let descHtml = '';
                    const isStaticUrl = block.type === 'url' && typeof block.content === 'object' && block.content.isStatic;
                    const urlString = isStaticUrl ? block.content.url : block.content;
                    
                    // 摘要提取（单行强力截断防撑高）
                    switch(block.type) {
                        case 'text': icon='fa-font text-blue-500'; title='富文本段落'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(this.stripHtml(block.content))}</div>`; break;
                        case 'url': icon='fa-link text-blue-500'; title=isStaticUrl ? '静态直达链接' : '动态活码链接'; descHtml = `<div class="text-[12px] text-blue-400 mt-1 truncate font-medium w-full">${this.escapeHtml(urlString)}</div>`; break;
                        case 'image': icon='fa-image text-green-500'; title='图片资源'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content.name)}</div>`; break;
                        case 'audio': icon='fa-music text-yellow-500'; title='音频文件'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content.name)}</div>`; break;
                        case 'video': icon='fa-video text-purple-500'; title='视频文件'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content.name)}</div>`; break;
                        case 'document': icon='fa-file-pdf text-red-500'; title='文档附件'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content.name)}</div>`; break;
                        // 数据表单也变更为 Excel 样式的文件直接呈现
                        case 'form': icon='fa-file-excel text-green-500'; title='数据表单'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content.name)}</div>`; break;
                        case 'combo': icon='fa-cubes text-primary'; title=block.content.title || '图文组合'; let itemsCount = block.content.items ? block.content.items.length : 0; let textPreview = block.content.text ? this.stripHtml(block.content.text) : '';
                            descHtml = `<div class="flex items-center gap-2 mt-1 w-full overflow-hidden"><span class="text-[12px] text-gray-500 truncate flex-1">${textPreview || '无文字内容'}</span><span class="inline-block font-bold text-primary bg-blue-50 px-1.5 py-0.5 rounded text-[10px] shrink-0">包含 ${itemsCount} 媒体</span></div>`; break;
                    }

                    let targetUrl = this.state.liveUrl + '?view=live&id=' + block.id;
                    if (isStaticUrl) targetUrl = urlString;

                    // 【横排终极渲染】：左侧（宽展区） ➡️ 中间（微码区） ➡️ 右侧（控制按键）
                    blockEl.innerHTML = `
                        <!-- 左段：图标与标题摘要，吃尽空余伸缩宽度 -->
                        <div class="flex items-center gap-4 flex-1 min-w-0 h-full pl-2 pr-6 border-r border-gray-50">
                            <div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center shrink-0 border border-gray-100 shadow-inner">
                                <i class="fas ${icon} text-xl"></i>
                            </div>
                            <div class="flex flex-col flex-1 min-w-0 justify-center">
                                <span class="font-black text-gray-800 text-[15px] truncate w-full">${this.escapeHtml(title)}</span>
                                ${descHtml}
                            </div>
                        </div>
                        
                        <!-- 中段：极其迷你的二维码矩阵框 -->
                        <div class="shrink-0 flex items-center justify-center bg-white border border-gray-100 rounded-lg p-1 shadow-sm mx-4" onmousedown="event.stopPropagation();">
                            <div id="qrcode-${block.id}" class="w-[64px] h-[64px]"></div>
                        </div>
                        
                        <!-- 右段：极限高度压缩的提示与并排按钮组 -->
                        <div class="shrink-0 flex flex-col justify-center gap-1.5 w-[140px] pr-2 h-full" onmousedown="event.stopPropagation();">
                            <p class="text-[9px] text-gray-400 text-center leading-tight tracking-wide font-medium">扫码查看此内容<br>(一物一码分发)</p>
                            <div class="flex gap-1.5 w-full">
                                <button onclick="app.copyBlockLink(event, '${block.id}', ${isStaticUrl}, '${urlString}')" class="flex-1 bg-blue-50 text-blue-500 border border-blue-100 py-1 rounded-[6px] hover:bg-blue-500 hover:text-white transition-all text-[11px] font-bold shadow-sm">复制</button>
                                <button onclick="app.downloadBlockQR('${block.id}')" class="flex-1 bg-gray-50 text-gray-600 border border-gray-200 py-1 rounded-[6px] hover:bg-gray-100 transition-all text-[11px] font-bold shadow-sm">下载</button>
                            </div>
                        </div>
                        
                        <!-- 右上角外露悬浮删除按钮 (解决遮挡暗病，直接完全暴露在边界上) -->
                        <button onclick="app.removeBlock('${block.id}')" class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center transition-transform hover:scale-110 shadow-md border-2 border-white z-20 opacity-0 group-hover:opacity-100">
                            <i class="fas fa-times text-[10px] font-bold"></i>
                        </button>
                    `;
                    container.appendChild(blockEl);
                });

                // 批量静默渲染极小尺寸(64px)的高清二维码
                setTimeout(() => {
                    this.state.blocks.forEach(block => {
                        const isStaticUrl = block.type === 'url' && typeof block.content === 'object' && block.content.isStatic;
                        let targetUrl = this.state.liveUrl + '?view=live&id=' + block.id;
                        if (isStaticUrl) targetUrl = block.content.url;
                        
                        const qrBox = document.getElementById(`qrcode-${block.id}`);
                        if (qrBox) {
                            new QRCode(qrBox, {
                                text: targetUrl,
                                width: 64, 
                                height: 64,
                                colorDark : '#111827',
                                colorLight : '#ffffff',
                                correctLevel : QRCode.CorrectLevel.M
                            });
                        }
                    });
                }, 100);
            },

            handleMainDragStart(e, index) { this.state.draggedMainIndex = index; e.dataTransfer.effectAllowed = "move"; e.target.classList.add('sortable-ghost'); },
            handleMainDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; },
            handleMainDrop(e, targetIndex) {
                e.preventDefault(); const sourceIndex = this.state.draggedMainIndex;
                if (sourceIndex !== null && sourceIndex !== targetIndex) {
                    const blocks = this.state.blocks; const [removed] = blocks.splice(sourceIndex, 1); blocks.splice(targetIndex, 0, removed); this.renderBlocks();
                }
            },
            handleMainDragEnd(e) { e.target.classList.remove('sortable-ghost'); this.state.draggedMainIndex = null; },

            downloadBlockQR(blockId) {
                const canvas = document.querySelector(`#qrcode-${blockId} canvas`);
                if(!canvas) return alert('二维码尚未生成完毕');
                const url = canvas.toDataURL("image/png"); const a = document.createElement('a'); a.download = `专属活码_${blockId}_${new Date().getTime()}.png`; a.href = url; a.click();
            },
            
            // 安全防报错复制功能 (解决 HTTP 无 HTTPS 环境下引发抛错的底层暗病)
            copyBlockLink(e, blockId, isStatic, rawUrl) {
                let linkToCopy = this.state.liveUrl + '?view=live&id=' + blockId;
                if (isStatic) linkToCopy = rawUrl;
                
                const btn = e.currentTarget; const oldHtml = btn.innerHTML;
                const successFeedback = () => {
                    btn.innerHTML = '<i class="fas fa-check text-[12px]"></i>';
                    btn.classList.add('bg-green-500', 'text-white', 'border-transparent');
                    btn.classList.remove('bg-blue-50', 'text-blue-500', 'border-blue-100');
                    setTimeout(() => {
                        btn.innerHTML = oldHtml;
                        btn.classList.remove('bg-green-500', 'text-white', 'border-transparent');
                        btn.classList.add('bg-blue-50', 'text-blue-500', 'border-blue-100');
                    }, 2000);
                };

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(linkToCopy).then(successFeedback).catch(() => this.fallbackCopy(linkToCopy, successFeedback));
                } else this.fallbackCopy(linkToCopy, successFeedback);
            },
            fallbackCopy(text, successCallback) {
                const textArea = document.createElement("textarea"); textArea.value = text;
                textArea.style.position = "fixed"; textArea.style.left = "-999999px"; textArea.style.top = "-999999px"; document.body.appendChild(textArea);
                textArea.focus(); textArea.select();
                try { document.execCommand('copy'); successCallback(); } catch (err) {}
                document.body.removeChild(textArea);
            },

            // ================= 完美规避空白错误、高保真无损 PDF 导出引擎 =================
            async downloadTextAsPDF(blockId, filename) {
                const el = document.getElementById(`content-${blockId}`);
                if(!el) return alert('内容加载失败');
                
                const btn = event.currentTarget;
                const oldHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>PDF引擎高清渲染中...';
                
                // 【绝杀修复】：锁定 top: 0 的虚拟渲染层，彻底解决浏览器滚动条溢出导致的 PDF 开头大量空白页问题
                const tempDiv = document.createElement('div');
                tempDiv.className = 'rich-text-content';
                tempDiv.innerHTML = el.innerHTML;
                tempDiv.style.position = 'absolute';
                tempDiv.style.top = '0'; // 必须为 0！
                tempDiv.style.left = '-9999px'; 
                tempDiv.style.width = '800px'; 
                tempDiv.style.backgroundColor = '#ffffff';
                tempDiv.style.padding = '30px';
                document.body.appendChild(tempDiv);
                
                try {
                    const pdfBlob = await html2pdf().set({
                        margin: [15, 15, 15, 15],
                        filename: filename + '.pdf',
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { 
                            scale: 2, 
                            useCORS: true, 
                            logging: false,
                            scrollY: 0, // 双重截断隔离区
                            windowY: 0
                        },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    }).from(tempDiv).output('blob');
                    
                    saveAs(pdfBlob, filename + '.pdf');
                } catch (e) {
                    alert("PDF生成受限: " + e.message);
                } finally {
                    btn.innerHTML = oldHtml;
                    document.body.removeChild(tempDiv);
                }
            },

            async downloadSingleFile(url, filename) {
                try {
                    const btn = event.currentTarget;
                    const oldHtml = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>提取资源中...';
                    
                    const response = await fetch(url);
                    const blob = await response.blob();
                    saveAs(blob, filename);
                    
                    btn.innerHTML = '<i class="fas fa-check mr-2"></i>下载成功';
                    setTimeout(() => { btn.innerHTML = oldHtml; }, 2000);
                } catch(e) {
                    alert("下载失败，请检查网络连接");
                }
            },

            // 完美规避缓存无函数报错，且实现了 H5 桌面端全尺寸舒展与独立下载
            renderLiveH5() {
                document.title = "在线查阅系统";
                const container = document.getElementById('mobile-live-container');
                const urlParams = new URLSearchParams(window.location.search);
                const blockId = urlParams.get('id');
                
                let targetBlocks = this.state.blocks;
                if (blockId) targetBlocks = this.state.blocks.filter(b => b.id === blockId);

                if (targetBlocks.length === 0) {
                    container.innerHTML = `<div class="text-center mt-32 text-gray-400 flex flex-col items-center"><div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-6 shadow-inner"><i class="fas fa-link-slash text-5xl text-gray-300"></i></div><p class="font-black text-xl text-gray-600 tracking-widest">内容已失效或不存在</p></div>`; return;
                }
                
                // 【核心宽屏渲染】：将 max-w-lg 彻底抹除，让电脑端访问时拉伸到 1200px 宽度
                let html = `
                    <div class="w-full flex justify-center py-6 hidden md:flex"></div>
                    <div class="w-full flex justify-center py-4 md:hidden"><div class="w-14 h-1.5 bg-gray-300 rounded-full opacity-60"></div></div>
                    <div class="px-4 md:px-8 lg:px-12 w-full max-w-[1200px] mx-auto flex flex-col gap-8 pb-16">
                `;
                
                targetBlocks.forEach(block => { html += this.generateBlockHtml(block, true); });
                
                // 彻底去除了底部的悬浮 ZIP 总下载大按键
                html += `</div><p class="text-center text-xs text-gray-300 mt-4 mb-16 tracking-widest uppercase font-bold">THE END</p>`;
                container.innerHTML = html;
            }
        };

        // 强力挂载确保不漏过上下文
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
    <script src="nav-3d-glass.js"></script>
    <script src="url-engine-enhancer.js"></script>
    <script src="tracker.js"></script>
</body>
