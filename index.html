<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高级动态活码管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1E90FF', secondary: '#F3F4F6', dark: '#111827' },
                    boxShadow: { 'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)' }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #F8FAFC; color: #333; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .drag-active { border-color: #1E90FF !important; background-color: #EBF5FF !important; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .block-animate { animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: flex !important; }
        body.is-admin .admin-only-block { display: block !important; }
        /* 拖拽排序时的视觉反馈 */
        .sortable-ghost { opacity: 0.4; background-color: #f0f9ff; border: 1px dashed #1E90FF; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4" id="drop-zone">

    <!-- 顶部导航栏 (新增"图文组合") -->
    <header class="w-full max-w-6xl flex justify-center gap-3 mb-8 flex-wrap">
        <button onclick="app.setMode('text')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 active-nav">文本</button>
        <button onclick="app.setMode('url')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">网址</button>
        <button onclick="app.setMode('image')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">图片</button>
        <button onclick="app.setMode('audio')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">音频</button>
        <button onclick="app.setMode('video')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">视频</button>
        <button onclick="app.setMode('document')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">文档</button>
        <button onclick="app.setMode('form')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">表单</button>
        
        <!-- 全能组合触发按钮 -->
        <button onclick="app.openComboEditor()" class="admin-only bg-gradient-to-r from-blue-500 to-indigo-500 px-6 py-2 rounded-full shadow-md hover:shadow-lg transition-all text-white font-semibold flex items-center">
            <i class="fas fa-cubes text-sm mr-2"></i>组合上传
        </button>

        <button onclick="app.setMode('uploaded')" class="nav-btn bg-blue-50 border border-blue-100 px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-primary font-semibold flex items-center admin-only"><i class="fas fa-cloud text-sm mr-2"></i>已上传</button>
    </header>

    <!-- 核心工作区 -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左侧区域 -->
        <section class="lg:col-span-2 flex flex-col gap-4 relative">
            
            <div id="tourist-mask" class="absolute inset-0 bg-white/60 backdrop-blur-[2px] z-20 flex flex-col items-center justify-center rounded-2xl">
                <i class="fas fa-lock text-4xl text-gray-300 mb-4"></i>
                <h3 class="text-lg font-semibold text-gray-700">游客访问模式</h3>
                <p class="text-sm text-gray-500 mt-2 text-center px-8">您当前处于只读模式。仅能扫描右侧二维码并浏览实时内容。</p>
                <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="mt-6 bg-primary text-white px-6 py-2 rounded-full shadow-lg hover:bg-blue-600 transition-all">管理员登录</button>
            </div>

            <!-- 常规输入面板 -->
            <div id="input-panel" class="bg-white rounded-2xl shadow-soft p-6 relative border-2 border-dashed border-transparent transition-all admin-only-block">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="panel-title" class="text-lg font-semibold text-gray-700"><i class="fas fa-keyboard text-primary mr-2"></i>添加文本</h2>
                    <span class="text-xs text-gray-400">支持直接拖拽资源</span>
                </div>
                <div id="dynamic-input-area" class="w-full min-h-[120px]"></div>
                <div class="flex justify-between items-center mt-4">
                    <p class="text-xs text-gray-400" id="panel-hint">文字长度无限制，扫码即刻展示</p>
                    <button id="btn-add-block" onclick="app.addCurrentBlock()" class="bg-primary text-white px-6 py-2 rounded-full hover:bg-blue-600 shadow transition-all">添加到内容流水线</button>
                </div>
            </div>

            <!-- 在线组合内容展示 -->
            <div class="bg-white rounded-2xl shadow-soft p-6 min-h-[300px]">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="text-md font-semibold text-gray-700">当前在线流 (扫码可见)</h3>
                    <button onclick="app.syncToCloud()" class="admin-only bg-green-500 text-white px-4 py-1.5 text-sm rounded hover:bg-green-600 transition-all shadow"><i class="fas fa-rotate mr-1"></i> 发布至前端</button>
                </div>
                <div id="blocks-container" class="flex flex-col gap-4 w-full"></div>
            </div>
        </section>

        <!-- 右侧活码区 -->
        <aside class="w-full flex flex-col gap-4 relative">
            <div class="bg-white rounded-2xl shadow-soft p-8 flex flex-col items-center sticky top-8">
                <div id="qrcode-container" class="w-56 h-56 bg-gray-50 flex items-center justify-center rounded-2xl mb-6 relative overflow-hidden transition-all shadow-inner mt-4">
                    <div id="qrcode" class="z-10 relative"></div>
                </div>
                <p class="text-sm text-gray-500 mb-6 text-center">此处扫描活码进入 H5 页面<br><span class="text-xs text-gray-400">(内容修改自动同步，图案永久不变)</span></p>
                <div class="flex gap-3 w-full">
                    <button onclick="app.generateShareLink()" class="flex-1 bg-primary text-white px-4 py-2 rounded-full hover:bg-blue-600 shadow transition-all font-medium flex items-center justify-center">
                        <i class="fas fa-share-nodes mr-2"></i> 复制专属链接
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <!-- 【全屏核心组件】组合全能编辑器 (Combo Editor) -->
    <div id="combo-editor-modal" class="fixed inset-0 bg-gray-100 z-[150] hidden flex-col">
        <div class="h-16 bg-white shadow-sm flex items-center justify-between px-6 border-b shrink-0">
            <h2 class="text-lg font-bold text-gray-800"><i class="fas fa-cubes text-primary mr-2"></i>全能图文组合创作</h2>
            <div class="flex gap-3">
                <button onclick="app.closeComboEditor()" class="px-5 py-1.5 text-gray-600 bg-gray-100 rounded-full hover:bg-gray-200 transition-all">取消</button>
                <button onclick="app.saveCombo()" class="px-5 py-1.5 bg-primary text-white rounded-full hover:bg-blue-600 shadow transition-all font-medium">确认组合并添加</button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-6 flex flex-col items-center">
            <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-8 flex flex-col gap-6">
                
                <!-- 头部设置区 -->
                <div class="flex flex-col gap-2">
                    <input type="text" id="combo-title" placeholder="输入大标题 (选填)" class="w-full text-2xl font-bold border-none outline-none placeholder-gray-300 focus:ring-0">
                    <div class="flex gap-4 items-center bg-gray-50 p-2 rounded-lg border">
                        <i class="fas fa-text-height text-gray-400 ml-2"></i>
                        <select id="combo-size" class="bg-transparent border-none outline-none text-sm text-gray-600 font-medium">
                            <option value="text-sm">偏小字体</option>
                            <option value="text-base" selected>标准字体</option>
                            <option value="text-lg">偏大字体</option>
                            <option value="text-xl">特大字体</option>
                        </select>
                        <span class="w-px h-4 bg-gray-300"></span>
                        <i class="fas fa-palette text-gray-400"></i>
                        <select id="combo-color" class="bg-transparent border-none outline-none text-sm text-gray-600 font-medium">
                            <option value="text-gray-800" selected>深灰 (默认)</option>
                            <option value="text-blue-600">商务蓝</option>
                            <option value="text-red-600">警示红</option>
                            <option value="text-green-600">健康绿</option>
                            <option value="text-gray-500">浅灰说明</option>
                        </select>
                    </div>
                </div>

                <!-- 文本输入区 -->
                <textarea id="combo-text" placeholder="在此输入自定义正文内容..." class="w-full h-40 resize-none border-none outline-none text-base placeholder-gray-300 leading-relaxed"></textarea>

                <!-- 多媒体资产挂载区 -->
                <div class="border-t pt-6 mt-2">
                    <div class="flex justify-between items-end mb-4">
                        <h3 class="font-semibold text-gray-700">多媒体资产与附件</h3>
                        <span class="text-xs text-gray-400">支持拖拽排序，向下滚动查看</span>
                    </div>

                    <!-- 原生拖拽排序列表 -->
                    <ul id="combo-items-list" class="flex flex-col gap-3 mb-4 min-h-[50px]">
                        <!-- 由 JS 渲染注入 -->
                    </ul>

                    <!-- 专属媒体上传区 -->
                    <div id="combo-drop-zone" class="relative w-full h-24 bg-blue-50/50 rounded-xl border-2 border-dashed border-blue-200 flex flex-col items-center justify-center hover:bg-blue-50 transition-all group">
                        <input type="file" id="combo-file-input" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="app.handleComboFileSelect(event)">
                        <i class="fas fa-plus-circle text-2xl text-blue-300 group-hover:text-primary transition-colors mb-1"></i>
                        <p class="text-sm text-gray-500">点击或将<span class="font-semibold text-primary"> 图片/音视频/PPT/文档 </span>拖拽至此添加到组合</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 系统通用悬浮组件 -->
    <button onclick="document.getElementById('login-modal').classList.remove('hidden')" id="admin-float-btn" class="fixed bottom-6 right-6 w-12 h-12 bg-gray-800 text-white rounded-full shadow-xl flex items-center justify-center hover:bg-gray-700 transition-all z-50"><i class="fas fa-user-shield"></i></button>
    <button onclick="app.logout()" id="logout-float-btn" class="admin-only fixed bottom-6 right-6 w-12 h-12 bg-red-500 text-white rounded-full shadow-xl items-center justify-center hover:bg-red-600 transition-all z-50"><i class="fas fa-sign-out-alt"></i></button>

    <div id="login-modal" class="fixed inset-0 bg-black/50 z-[200] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-80 shadow-2xl">
            <h3 class="text-lg font-semibold mb-4 text-center">系统后台登录</h3>
            <input type="password" id="admin-pwd" class="w-full p-2 border rounded mb-4 outline-none" placeholder="请输入口令">
            <div class="flex gap-3">
                <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="flex-1 py-2 bg-gray-100 rounded">取消</button>
                <button onclick="app.login()" class="flex-1 py-2 bg-primary text-white rounded">验证</button>
            </div>
        </div>
    </div>

    <div id="preview-modal" class="fixed inset-0 bg-black/80 z-[250] hidden flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="absolute top-4 right-4"><button onclick="app.closePreview()" class="text-white hover:text-gray-300 text-3xl"><i class="fas fa-times"></i></button></div>
        <div id="preview-content" class="w-11/12 h-5/6 bg-white rounded-xl overflow-hidden flex items-center justify-center relative"></div>
    </div>

    <script>
        const app = {
            state: {
                currentMode: 'text', 
                blocks: [], 
                isAdmin: false,
                token: sessionStorage.getItem('adminToken') || '',
                liveUrl: window.location.origin + window.location.pathname + '?view=live',
                
                // 全能组合工作流状态机
                comboDraft: {
                    title: '',
                    text: '',
                    size: 'text-base',
                    color: 'text-gray-800',
                    items: []
                },
                draggedItemIndex: null // 用于记录拖拽排序的初始索引
            },

            configs: {
                text: { icon: 'fa-keyboard', title: '添加纯文本', hint: '支持常规段落', accept: null },
                url: { icon: 'fa-link', title: '添加网址', hint: '生成可点击的超链接', accept: null },
                image: { icon: 'fa-image', title: '添加独立图片', hint: '支持 png/jpg 等格式', accept: 'image/*' },
                audio: { icon: 'fa-music', title: '添加独立音频', hint: '在线流畅播放', accept: 'audio/*' },
                video: { icon: 'fa-video', title: '添加独立视频', hint: '原生UI沉浸式播放', accept: 'video/*' },
                document: { icon: 'fa-file-word', title: '添加独立文档', hint: '支持 PPT/Word 跨设备在线预览', accept: '.doc,.docx,.ppt,.pptx,.xls,.xlsx,.pdf,.wps' },
                form: { icon: 'fa-list-check', title: '添加表单', hint: '通用资料收集模版', accept: null },
                uploaded: { icon: 'fa-cloud', title: '后台资源池', hint: '可查阅/清理所有已上传资产', accept: null }
            },

            async init() {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('view') === 'live') {
                    document.body.innerHTML = '<div class="p-4 flex flex-col gap-4 max-w-lg mx-auto bg-gray-50 min-h-screen" id="mobile-live-container"></div>';
                    await this.fetchCloudConfig();
                    this.renderLiveH5();
                    return;
                }

                if (this.state.token) await this.verifyTokenSilent();
                else this.enforceTouristMode();

                this.bindDragAndDrop();
                this.updateNavUI();
                this.renderInputArea();
                
                await this.fetchCloudConfig();
                this.renderQR(); 
            },

            // 鉴权模块
            async login() {
                const pwd = document.getElementById('admin-pwd').value;
                try {
                    const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
                    if (res.ok) {
                        this.state.token = pwd;
                        sessionStorage.setItem('adminToken', pwd);
                        document.getElementById('login-modal').classList.add('hidden');
                        this.enableAdminMode();
                    } else alert('密码错误');
                } catch (e) { alert('后端连接异常'); }
            },
            async verifyTokenSilent() {
                try {
                    const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: this.state.token }) });
                    if (res.ok) this.enableAdminMode();
                    else this.enforceTouristMode();
                } catch (e) { this.enforceTouristMode(); }
            },
            logout() { this.state.token = ''; sessionStorage.removeItem('adminToken'); this.enforceTouristMode(); },
            enableAdminMode() {
                this.state.isAdmin = true; document.body.classList.add('is-admin');
                document.getElementById('tourist-mask').classList.add('hidden'); document.getElementById('admin-float-btn').classList.add('hidden');
                if(this.state.currentMode === 'uploaded') this.renderInputArea();
            },
            enforceTouristMode() {
                this.state.isAdmin = false; document.body.classList.remove('is-admin');
                document.getElementById('tourist-mask').classList.remove('hidden'); document.getElementById('admin-float-btn').classList.remove('hidden');
            },

            // R2 后端网络层交互
            async fetchCloudConfig() {
                try {
                    const res = await fetch('/api/config');
                    if (res.ok) {
                        this.state.blocks = await res.json() || [];
                        this.renderBlocks();
                    }
                } catch (e) {}
            },
            async syncToCloud() {
                if (!this.state.isAdmin) return;
                const res = await fetch('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.state.token}` }, body: JSON.stringify(this.state.blocks) });
                if (res.ok) alert('🚀 全局流水线发布成功，用户扫码将看到最新内容！');
                else alert('发布失败');
            },
            async uploadFileToBackend(file) {
                if (!this.state.isAdmin) return null;
                const formData = new FormData(); formData.append('file', file);
                try {
                    const res = await fetch('/api/upload', { method: 'POST', headers: { 'Authorization': `Bearer ${this.state.token}` }, body: formData });
                    return res.ok ? await res.json() : null;
                } catch (e) { return null; }
            },
            
            // 核心：调用 R2 删除废弃文件（缓存自动清理）
            async deleteCloudFile(url) {
                if (!url.startsWith('/r2/')) return;
                try {
                    await fetch('/api/file', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.state.token}` },
                        body: JSON.stringify({ url: url })
                    });
                    console.log('✅ 垃圾回收成功: ', url);
                } catch (e) {
                    console.error('回收失败: ', url);
                }
            },

            // 组合上传模式 (Combo Editor) 全流程逻辑
            openComboEditor() {
                this.state.comboDraft = { title: '', text: '', size: 'text-base', color: 'text-gray-800', items: [] };
                document.getElementById('combo-title').value = '';
                document.getElementById('combo-text').value = '';
                document.getElementById('combo-size').value = 'text-base';
                document.getElementById('combo-color').value = 'text-gray-800';
                this.renderComboItems();
                document.getElementById('combo-editor-modal').classList.remove('hidden');
                document.getElementById('combo-editor-modal').classList.add('flex');
            },
            closeComboEditor() {
                document.getElementById('combo-editor-modal').classList.add('hidden');
                document.getElementById('combo-editor-modal').classList.remove('flex');
            },
            async handleComboFileSelect(event) {
                const files = event.target.files || event.dataTransfer.files;
                if (!files || files.length === 0) return;
                
                const dropZone = document.getElementById('combo-drop-zone');
                const originHtml = dropZone.innerHTML;
                dropZone.innerHTML = `<i class="fas fa-spinner fa-spin text-2xl text-primary mb-1"></i><p class="text-sm">安全写入云端中...</p>`;

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const uploadResult = await this.uploadFileToBackend(file);
                    if (uploadResult && uploadResult.success) {
                        let type = 'document';
                        if (file.type.startsWith('image/')) type = 'image';
                        else if (file.type.startsWith('audio/')) type = 'audio';
                        else if (file.type.startsWith('video/')) type = 'video';
                        
                        this.state.comboDraft.items.push({
                            id: 'item_' + Date.now() + Math.floor(Math.random()*100),
                            type: type, url: uploadResult.url, name: uploadResult.name, size: (uploadResult.size/1024/1024).toFixed(2) + ' MB'
                        });
                    }
                }
                dropZone.innerHTML = originHtml;
                this.renderComboItems();
            },
            removeComboItem(index) {
                const item = this.state.comboDraft.items[index];
                // 组合编辑中移除，立即销毁云端物理文件
                this.deleteCloudFile(item.url); 
                this.state.comboDraft.items.splice(index, 1);
                this.renderComboItems();
            },
            
            // HTML5 原生拖拽排序 (Combo Items)
            handleDragStart(e, index) {
                this.state.draggedItemIndex = index;
                e.dataTransfer.effectAllowed = "move";
                e.target.classList.add('sortable-ghost');
            },
            handleDragOver(e, index) {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
            },
            handleDrop(e, targetIndex) {
                e.preventDefault();
                const sourceIndex = this.state.draggedItemIndex;
                if (sourceIndex !== null && sourceIndex !== targetIndex) {
                    // 数组位置互换
                    const items = this.state.comboDraft.items;
                    const [removed] = items.splice(sourceIndex, 1);
                    items.splice(targetIndex, 0, removed);
                    this.renderComboItems();
                }
            },
            handleDragEnd(e) {
                e.target.classList.remove('sortable-ghost');
                this.state.draggedItemIndex = null;
            },

            renderComboItems() {
                const list = document.getElementById('combo-items-list');
                list.innerHTML = '';
                this.state.comboDraft.items.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.draggable = true;
                    li.className = 'flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-200 cursor-move hover:shadow-sm transition-all group';
                    
                    // 绑定 H5 拖拽事件
                    li.ondragstart = (e) => this.handleDragStart(e, index);
                    li.ondragover = (e) => this.handleDragOver(e, index);
                    li.ondrop = (e) => this.handleDrop(e, index);
                    li.ondragend = (e) => this.handleDragEnd(e);

                    let icon = 'fa-file-alt text-gray-500';
                    if(item.type === 'image') icon = 'fa-image text-blue-500';
                    if(item.type === 'video') icon = 'fa-video text-purple-500';
                    if(item.type === 'audio') icon = 'fa-music text-green-500';

                    li.innerHTML = `
                        <div class="flex items-center w-full truncate pr-4">
                            <i class="fas fa-bars text-gray-300 mr-3"></i>
                            <div class="w-8 h-8 rounded bg-white border flex items-center justify-center mr-3 shrink-0"><i class="fas ${icon}"></i></div>
                            <div class="flex flex-col truncate">
                                <span class="text-sm font-medium text-gray-700 truncate">${item.name}</span>
                                <span class="text-xs text-gray-400">${item.size}</span>
                            </div>
                        </div>
                        <button onclick="app.removeComboItem(${index})" class="text-gray-400 hover:text-red-500 shrink-0"><i class="fas fa-times-circle text-lg"></i></button>
                    `;
                    list.appendChild(li);
                });
            },

            saveCombo() {
                const title = document.getElementById('combo-title').value.trim();
                const text = document.getElementById('combo-text').value.trim();
                const size = document.getElementById('combo-size').value;
                const color = document.getElementById('combo-color').value;
                
                if(!title && !text && this.state.comboDraft.items.length === 0) {
                    return alert('组合不能为空，请补充文字或资产');
                }

                this.state.comboDraft.title = title;
                this.state.comboDraft.text = text;
                this.state.comboDraft.size = size;
                this.state.comboDraft.color = color;
                
                // 深拷贝防止引用污染
                this.addBlockToState('combo', JSON.parse(JSON.stringify(this.state.comboDraft)));
                this.closeComboEditor();
            },

            // 基础 UI 与常规上传逻辑
            setMode(mode) {
                this.state.currentMode = mode;
                this.updateNavUI();
                this.renderInputArea();
            },
            updateNavUI() {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('ring-2', 'ring-primary/20', 'bg-blue-50');
                    if(btn.innerText.toLowerCase().includes(this.configs[this.state.currentMode].title.substring(2))) btn.classList.add('ring-2', 'ring-primary/20', 'bg-blue-50');
                });
                const cfg = this.configs[this.state.currentMode];
                if(document.getElementById('panel-title')) document.getElementById('panel-title').innerHTML = `<i class="fas ${cfg.icon} text-primary mr-2"></i>${cfg.title}`;
                if(document.getElementById('panel-hint')) document.getElementById('panel-hint').innerText = cfg.hint;
                if(document.getElementById('btn-add-block')) document.getElementById('btn-add-block').style.display = this.state.currentMode === 'uploaded' ? 'none' : 'block';
            },
            renderInputArea() {
                if (!this.state.isAdmin && this.state.currentMode === 'uploaded') return;
                const area = document.getElementById('dynamic-input-area');
                const mode = this.state.currentMode;
                const cfg = this.configs[mode];

                if (mode === 'text' || mode === 'url') {
                    area.innerHTML = `<textarea id="input-data" class="w-full h-24 p-3 bg-gray-50 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-primary/50 transition-all text-gray-700"></textarea>`;
                } else if (mode === 'form') {
                    area.innerHTML = `<input type="text" id="form-title" class="w-full p-2 rounded bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-primary/50 text-sm" placeholder="表单标题 (例如：意向客户登记)">`;
                } else if (mode === 'uploaded') {
                    area.innerHTML = `<div class="w-full max-h-60 overflow-y-auto no-scrollbar"><p class="text-sm text-gray-500 mb-2 border-b pb-2">当前云端全部数据对象扫描结果：</p><ul class="flex flex-col gap-2">${this.state.blocks.map(b => `<li class="bg-gray-50 p-2 rounded text-sm border flex justify-between"><span class="truncate w-4/5">${b.type==='text'||b.type==='url' ? b.content.substring(0,20)+'...' : (b.type==='combo' ? '[全能组合] '+b.content.title : b.content.name)}</span><span class="text-xs bg-gray-200 rounded px-2 text-gray-600">${b.type}</span></li>`).join('')}</ul></div>`;
                } else {
                    area.innerHTML = `<div id="upload-drop-ui" class="relative w-full h-24 bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center hover:bg-gray-100 hover:border-primary transition-all"><input type="file" accept="${cfg.accept}" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="app.handleMainFileSelect(event)"><i class="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-1"></i><p class="text-sm text-gray-500">点击或直接拖拽文件</p></div><div id="upload-progress-ui" class="hidden w-full h-24 bg-blue-50 rounded-xl border-2 border-primary flex items-center justify-center"><i class="fas fa-spinner fa-spin text-2xl text-primary mr-2"></i><span id="upload-status-text" class="text-primary font-medium text-sm">上传中...</span></div>`;
                }
            },
            async handleMainFileSelect(event) {
                if (!this.state.isAdmin) return;
                const files = event.target.files || event.dataTransfer.files;
                if (!files || files.length === 0) return;
                
                document.getElementById('upload-drop-ui').classList.add('hidden');
                document.getElementById('upload-progress-ui').classList.remove('hidden');

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    document.getElementById('upload-status-text').innerText = `正在处理: ${file.name}`;
                    const uploadResult = await this.uploadFileToBackend(file);
                    
                    if (uploadResult && uploadResult.success) {
                        let type = 'document';
                        if (file.type.startsWith('image/')) type = 'image';
                        else if (file.type.startsWith('audio/')) type = 'audio';
                        else if (file.type.startsWith('video/')) type = 'video';
                        
                        this.addBlockToState(type, { url: uploadResult.url, name: uploadResult.name, size: (uploadResult.size/1024/1024).toFixed(2) + ' MB' });
                    }
                }
                document.getElementById('upload-drop-ui').classList.remove('hidden');
                document.getElementById('upload-progress-ui').classList.add('hidden');
            },
            bindDragAndDrop() {
                const dropZone = document.getElementById('drop-zone');
                const panel = document.getElementById('input-panel');
                const comboModal = document.getElementById('combo-editor-modal');
                
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, e => {
                        // 阻止浏览器默认打开文件的行为
                        e.preventDefault(); e.stopPropagation();
                    }, false);
                    comboModal.addEventListener(eventName, e => {
                        e.preventDefault(); e.stopPropagation();
                    }, false);
                });

                // 只在未打开全屏组合编辑器，且拥有管理权限时触发主界面高亮
                dropZone.addEventListener('dragenter', () => { if(this.state.isAdmin && comboModal.classList.contains('hidden')) panel.classList.add('drag-active'); }, false);
                dropZone.addEventListener('dragleave', () => panel.classList.remove('drag-active'), false);
                dropZone.addEventListener('drop', (e) => {
                    panel.classList.remove('drag-active');
                    if(this.state.isAdmin && e.dataTransfer.files.length > 0) {
                        // 如果在组合面板中，转交给 Combo 解析；如果在主界面，走主线逻辑
                        if (!comboModal.classList.contains('hidden')) {
                            this.handleComboFileSelect(e);
                        } else {
                            this.handleMainFileSelect(e);
                        }
                    }
                }, false);
            },
            addCurrentBlock() {
                if (!this.state.isAdmin) return;
                const mode = this.state.currentMode;
                if (mode === 'text' || mode === 'url') {
                    const val = document.getElementById('input-data').value.trim();
                    if (val) { this.addBlockToState(mode, val); document.getElementById('input-data').value = ''; }
                } else if (mode === 'form') {
                    const title = document.getElementById('form-title').value.trim() || '通用信息登记表';
                    this.addBlockToState('form', { title: title, fieldCount: 3 }); document.getElementById('form-title').value = '';
                }
            },
            addBlockToState(type, content) {
                this.state.blocks.push({ id: 'block_' + Date.now(), type: type, content: content });
                this.renderBlocks();
                if (this.state.currentMode === 'uploaded') this.renderInputArea();
            },
            removeBlock(id) {
                if (!this.state.isAdmin) return;
                const target = this.state.blocks.find(b => b.id === id);
                if (target) {
                    // 全能智能清空：识别子属性内的多媒体并直接摧毁物理缓存
                    if (target.type === 'combo' && target.content.items) {
                        target.content.items.forEach(item => this.deleteCloudFile(item.url));
                    } else if (target.content.url) {
                        this.deleteCloudFile(target.content.url);
                    }
                }
                this.state.blocks = this.state.blocks.filter(b => b.id !== id);
                this.renderBlocks();
                if (this.state.currentMode === 'uploaded') this.renderInputArea();
            },

            // 文档渲染模块
            escapeHtml(unsafe) { return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); },
            openDocumentPreview(url, name) {
                const ext = name.split('.').pop().toLowerCase();
                const absoluteUrl = url.startsWith('http') ? url : (window.location.origin + url);
                const contentBox = document.getElementById('preview-content');
                document.getElementById('preview-modal').classList.remove('hidden');

                if (ext === 'pdf') contentBox.innerHTML = `<iframe src="${url}" class="w-full h-full border-none"></iframe>`;
                else if (['doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx'].includes(ext)) contentBox.innerHTML = `<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(absoluteUrl)}" class="w-full h-full border-none"></iframe>`;
                else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) contentBox.innerHTML = `<img src="${url}" class="max-w-full max-h-full object-contain">`;
                else if (['mp4', 'webm', 'ogg'].includes(ext)) contentBox.innerHTML = `<video src="${url}" controls autoplay class="max-w-full max-h-full"></video>`;
                else contentBox.innerHTML = `<div class="text-center"><i class="fas fa-file text-6xl text-gray-300 mb-4"></i><p class="text-gray-600 mb-4">不支持在浏览器直接预览</p><a href="${url}" download class="bg-primary text-white px-6 py-2 rounded-full">下载到本地</a></div>`;
            },
            closePreview() { document.getElementById('preview-modal').classList.add('hidden'); document.getElementById('preview-content').innerHTML = ''; },

            // 流水线卡片生成算法 (支持 Combo 嵌套递归)
            generateBlockHtml(block, isLive = false) {
                let html = '';
                const baseClass = isLive ? 'w-full mb-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-100 overflow-hidden' : 'flex-1';
                
                // 处理全能组合模式渲染
                if (block.type === 'combo') {
                    const c = block.content;
                    let comboInner = '';
                    if(c.title) comboInner += `<h2 class="text-xl font-bold ${c.color} mb-3 leading-tight">${this.escapeHtml(c.title)}</h2>`;
                    if(c.text) comboInner += `<p class="${c.size} ${c.color} whitespace-pre-wrap leading-relaxed mb-4 opacity-90">${this.escapeHtml(c.text)}</p>`;
                    
                    if(c.items && c.items.length > 0) {
                        comboInner += `<div class="flex flex-col gap-3 mt-4 border-t pt-4">`;
                        c.items.forEach(item => {
                            // 将单个 item 伪装成 block 交给渲染器
                            comboInner += `<div class="rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50/50">` + this.generateBlockHtml({type: item.type, content: item}, false) + `</div>`;
                        });
                        comboInner += `</div>`;
                    }
                    html = `<div class="${baseClass} bg-gradient-to-br from-white to-gray-50 border-blue-100 border relative"><div class="absolute top-0 left-0 w-1 h-full bg-primary rounded-l-2xl"></div>${comboInner}</div>`;
                    return html;
                }

                // 常规原子卡片
                switch (block.type) {
                    case 'text': html = `<div class="${baseClass}"><p class="text-gray-700 whitespace-pre-wrap">${this.escapeHtml(block.content)}</p></div>`; break;
                    case 'url': html = `<div class="${baseClass}"><a href="${this.escapeHtml(block.content)}" target="_blank" class="text-blue-500 underline flex items-center break-all"><i class="fas fa-external-link-alt mr-2 shrink-0"></i> ${this.escapeHtml(block.content)}</a></div>`; break;
                    case 'image': html = `<div class="${baseClass} p-1"><img src="${block.content.url}" class="w-full rounded-lg cursor-pointer hover:opacity-90 transition-all shadow-sm" onclick="app.openDocumentPreview('${block.content.url}', '${block.content.name}')"></div>`; break;
                    case 'audio': html = `<div class="${baseClass} flex flex-col p-3"><span class="text-sm font-medium text-gray-700 mb-2 truncate px-2"><i class="fas fa-music text-green-500 mr-2"></i>${block.content.name}</span><audio controls src="${block.content.url}" class="w-full outline-none h-10 rounded-full bg-gray-100"></audio></div>`; break;
                    case 'video': html = `<div class="${baseClass} bg-black flex justify-center p-0 m-0"><video src="${block.content.url}" controls class="w-full max-h-[300px] object-contain"></video></div>`; break;
                    case 'document': html = `<div class="${baseClass} flex items-center bg-white p-3"><div class="w-12 h-12 bg-red-50 text-red-500 rounded-lg flex items-center justify-center mr-3 shrink-0"><i class="fas fa-file-pdf text-2xl"></i></div><div class="flex flex-col flex-1 overflow-hidden mr-2"><span class="text-sm font-semibold text-gray-800 truncate">${block.content.name}</span><span class="text-xs text-gray-400 mt-0.5">${block.content.size} · PPT/Word等支持在线预览</span></div><div class="flex flex-col gap-1 shrink-0"><button onclick="app.openDocumentPreview('${block.content.url}', '${block.content.name}')" class="text-xs bg-gray-100 px-3 py-1 rounded text-gray-700 hover:bg-gray-200">全屏查看</button><a href="${block.content.url}" download class="text-xs bg-primary text-white px-3 py-1 rounded hover:bg-blue-600 text-center"><i class="fas fa-download mr-1"></i>下载</a></div></div>`; break;
                    case 'form': html = `<div class="${baseClass} border-2 border-dashed border-indigo-100 bg-indigo-50/40 p-5"><h4 class="font-bold text-indigo-900 mb-4 text-center text-lg">${this.escapeHtml(block.content.title)}</h4><input type="text" placeholder="您的姓名" class="w-full p-2.5 mb-3 border border-white rounded shadow-sm outline-none text-sm"><input type="tel" placeholder="联系方式" class="w-full p-2.5 mb-3 border border-white rounded shadow-sm outline-none text-sm"><button class="w-full bg-indigo-500 text-white py-2.5 rounded shadow-md hover:bg-indigo-600 transition-all font-medium mt-2">确认提交登记</button></div>`; break;
                }
                return html;
            },

            renderBlocks() {
                const container = document.getElementById('blocks-container');
                const empty = document.getElementById('empty-state') || document.createElement('div');
                if(!document.getElementById('empty-state')){
                    empty.id = 'empty-state'; empty.className = 'flex flex-col items-center justify-center h-40 text-gray-400';
                    empty.innerHTML = `<i class="fas fa-layer-group text-4xl mb-3 opacity-50"></i><p class="text-sm">内容流为空，等待管理员拼装</p>`;
                }
                
                if (!container) return;
                
                if (this.state.blocks.length === 0) {
                    container.innerHTML = ''; container.appendChild(empty); empty.style.display = 'flex'; return;
                }

                empty.style.display = 'none'; container.innerHTML = '';
                
                this.state.blocks.forEach((block) => {
                    const blockEl = document.createElement('div');
                    blockEl.className = 'block-animate bg-white border border-gray-100 rounded-xl p-3 flex items-center justify-between group relative shadow-sm hover:shadow-md transition-all';
                    const contentHtml = this.generateBlockHtml(block, false);

                    blockEl.innerHTML = `<div class="flex items-center w-full overflow-hidden"><div class="mr-3 text-gray-300 admin-only shrink-0"><i class="fas fa-ellipsis-v"></i></div>${contentHtml}</div><button onclick="app.removeBlock('${block.id}')" class="admin-only w-8 h-8 rounded-full bg-red-50 text-red-500 items-center justify-center opacity-0 group-hover:opacity-100 transition-all hover:bg-red-500 hover:text-white absolute right-4 shadow-md shrink-0"><i class="fas fa-trash-alt text-sm"></i></button>`;
                    container.appendChild(blockEl);
                });
            },

            renderLiveH5() {
                document.title = "扫码呈现内容";
                const container = document.getElementById('mobile-live-container');
                if (this.state.blocks.length === 0) {
                    container.innerHTML = '<div class="text-center mt-32 text-gray-400 flex flex-col items-center"><div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4"><i class="fas fa-box-open text-3xl"></i></div><p class="font-medium">内容未发布或已下线</p></div>';
                    return;
                }
                let html = '<div class="w-full flex justify-center py-4"><div class="w-12 h-1 bg-gray-300 rounded-full"></div></div>';
                this.state.blocks.forEach(block => { html += this.generateBlockHtml(block, true); });
                html += '<p class="text-center text-xs text-gray-300 mt-10 mb-8 tracking-widest uppercase">END</p>';
                container.innerHTML = html;
            },

            renderQR() {
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, { text: this.state.liveUrl, width: 200, height: 200, colorDark : "#111827", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.M });
                setTimeout(() => { const canvas = qrContainer.querySelector('canvas'); if(canvas) { canvas.style.borderRadius = '0.75rem'; canvas.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)'; } }, 50);
            },
            
            generateShareLink() {
                navigator.clipboard.writeText(this.state.liveUrl).then(() => {
                    const btn = event.currentTarget; const oldHtml = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check mr-2"></i> 已成功复制'; btn.classList.replace('bg-primary', 'bg-green-500');
                    setTimeout(() => { btn.innerHTML = oldHtml; btn.classList.replace('bg-green-500', 'bg-primary'); }, 2000);
                }).catch(() => { alert('复制失败，链接为: ' + this.state.liveUrl); });
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
