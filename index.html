<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高级动态活码与资源分发系统</title>
    
    <!-- 引入外部引擎与样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        primary: '#1E90FF', 
                        secondary: '#F3F4F6', 
                        dark: '#111827' 
                    },
                    boxShadow: { 
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)' 
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #F8FAFC; 
            color: #333; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .drag-active { border-color: #1E90FF !important; background-color: #EBF5FF !important; }
        
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .block-animate { animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        /* 管理员权限样式隔离 */
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: flex !important; }
        body.is-admin .admin-only-block { display: block !important; }
        
        /* 拖拽排序特效 */
        .sortable-ghost { 
            opacity: 0.4; 
            background-color: #f0f9ff; 
            border: 1px dashed #1E90FF; 
        }
        
        /* 移动端 H5 底部安全区，防止被悬浮按钮遮挡 */
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 100px); }

        /* 富文本编辑器内部基础排版适配 */
        .rich-text-content b { font-weight: bold; }
        .rich-text-content i { font-style: italic; }
        .rich-text-content u { text-decoration: underline; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4" id="drop-zone">

    <!-- 顶部导航栏 (彻底删除了AI艺术码入口) -->
    <header class="w-full max-w-[1400px] flex justify-center gap-3 mb-8 flex-wrap admin-only px-4 mx-auto">
        <button onclick="app.setMode('text')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 active-nav">文本</button>
        <button onclick="app.setMode('url')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">网址</button>
        <button onclick="app.setMode('document')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">文档</button>
        <button onclick="app.setMode('image')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">图片</button>
        <button onclick="app.setMode('audio')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">音频</button>
        <button onclick="app.setMode('video')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">视频</button>
        <button onclick="app.setMode('form')" class="nav-btn bg-white px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600">表单</button>
        
        <button onclick="app.openComboEditor()" class="bg-gradient-to-r from-blue-500 to-indigo-500 px-6 py-2 rounded-full shadow-md hover:shadow-lg transition-all text-white font-semibold flex items-center">
            <i class="fas fa-cubes text-sm mr-2"></i>组合上传
        </button>

        <button onclick="app.setMode('uploaded')" class="nav-btn bg-blue-50 border border-blue-100 px-5 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-primary font-semibold flex items-center">
            <i class="fas fa-cloud text-sm mr-2"></i>已上传
        </button>
    </header>

    <!-- PC端管理工作区 (废除了右边栏，主界面彻底横向延展霸屏) -->
    <main class="w-full max-w-[1100px] flex flex-col gap-8 admin-only px-4 mx-auto">
        
        <!-- 上方输入面板 -->
        <section class="w-full flex flex-col gap-6 relative">
            <div id="input-panel" class="bg-white rounded-2xl shadow-sm p-8 relative border-2 border-dashed border-transparent transition-all">
                <div class="flex justify-between items-center mb-6" id="panel-header">
                    <h2 id="panel-title" class="text-xl font-bold text-gray-800 tracking-wide">
                        <i class="fas fa-keyboard text-primary mr-2"></i>添加文本
                    </h2>
                    <span id="panel-hint-pill" class="text-xs text-gray-400 bg-gray-100 px-4 py-1.5 rounded-full font-medium">支持直接拖拽资源极速解析</span>
                </div>
                
                <div id="dynamic-input-area" class="w-full min-h-[140px]"></div>
                
                <div class="flex justify-between items-center mt-6" id="panel-footer-action">
                    <p class="text-sm text-gray-400" id="panel-hint">文字长度无限制，扫码即刻展示</p>
                    <button id="btn-add-block" onclick="app.addCurrentBlock()" class="bg-primary text-white px-10 py-3.5 rounded-xl hover:bg-blue-600 shadow-[0_4px_14px_0_rgba(30,144,255,0.39)] hover:shadow-[0_6px_20px_rgba(30,144,255,0.23)] hover:-translate-y-0.5 transition-all font-semibold tracking-wide">
                        添加到内容流水线
                    </button>
                </div>
            </div>

            <!-- 下方流水线区：一物一码极度压低的单行贯穿排版 -->
            <div class="bg-white rounded-2xl shadow-sm p-8 min-h-[400px]">
                <div class="flex justify-between items-center mb-8 border-b border-gray-100 pb-5">
                    <div>
                        <h3 class="text-xl font-bold text-gray-800 tracking-wide">当前在线流 <span class="text-sm text-primary ml-2 font-normal">一物一码独立分发</span></h3>
                        <p class="text-xs text-gray-400 mt-1">每个内容都有专属二维码，横排高度极简压缩，分享便捷</p>
                    </div>
                    <button onclick="app.syncToCloud()" class="bg-green-500 text-white px-6 py-2.5 text-sm rounded-lg hover:bg-green-600 transition-all shadow-[0_4px_14px_0_rgba(34,197,94,0.39)] hover:-translate-y-0.5 font-bold tracking-wider">
                        <i class="fas fa-cloud-upload-alt mr-2"></i> 同步至云端
                    </button>
                </div>
                <!-- 容器为纵向列表，每张卡片占据一行，极大利用横向空白 -->
                <div id="blocks-container" class="flex flex-col gap-5 w-full"></div>
            </div>
        </section>

    </main>

    <!-- H5 游客实时预览容器 -->
    <div id="mobile-live-container" class="hidden w-full max-w-lg mx-auto bg-gray-50 min-h-screen pb-safe"></div>

    <!-- 全屏图文组合编辑器 (富文本功能完美保留无损) -->
    <div id="combo-editor-modal" class="fixed inset-0 bg-gray-100 z-[150] hidden flex-col">
        <div class="h-16 bg-white shadow-sm flex items-center justify-between px-6 border-b shrink-0">
            <h2 class="text-lg font-bold text-gray-800">
                <i class="fas fa-cubes text-primary mr-2"></i>全能图文组合创作
            </h2>
            <div class="flex gap-3">
                <button onclick="app.closeComboEditor()" class="px-5 py-1.5 text-gray-600 bg-gray-100 rounded-full hover:bg-gray-200 transition-all font-medium">取消</button>
                <button onclick="app.saveCombo()" class="px-5 py-1.5 bg-primary text-white rounded-full hover:bg-blue-600 shadow transition-all font-bold">确认组合并添加</button>
            </div>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 flex flex-col items-center">
            <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-8 flex flex-col gap-6">
                
                <div class="flex flex-col gap-2">
                    <input type="text" id="combo-title" placeholder="输入大标题 (选填)" class="w-full text-2xl font-bold border-none outline-none placeholder-gray-300 focus:ring-0 px-1">
                </div>
                
                <div class="flex flex-col shadow-sm rounded-lg overflow-hidden border border-gray-200">
                    <div class="flex flex-wrap gap-2 items-center bg-gray-50 p-2.5 border-b border-gray-200">
                        
                        <select onchange="app.execCmd('fontName', this.value)" class="bg-white border border-gray-300 rounded px-2 py-1 text-sm outline-none text-gray-700 cursor-pointer hover:border-primary font-medium">
                            <option value="">默认字体</option>
                            <option value="SimSun">宋体</option>
                            <option value="KaiTi">楷体</option>
                            <option value="Microsoft YaHei">微软雅黑</option>
                            <option value="FangSong">仿宋</option>
                        </select>
                        
                        <select onchange="app.execCmd('fontSize', this.value)" class="bg-white border border-gray-300 rounded px-2 py-1 text-sm outline-none text-gray-700 cursor-pointer hover:border-primary font-medium">
                            <option value="">字号</option>
                            <option value="3">标准</option>
                            <option value="4">偏大</option>
                            <option value="5">大号</option>
                            <option value="6">特大</option>
                        </select>
                        
                        <div class="w-px h-5 bg-gray-300 mx-1"></div>
                        
                        <div class="flex items-center gap-1 cursor-pointer group relative" title="文字颜色">
                            <i class="fas fa-palette text-gray-500 group-hover:text-primary pl-1"></i>
                            <input type="color" onchange="app.execCmd('foreColor', this.value)" class="w-8 h-8 rounded border-none cursor-pointer p-0 bg-transparent">
                        </div>

                        <div class="w-px h-5 bg-gray-300 mx-1"></div>
                        
                        <button onmousedown="event.preventDefault(); app.execCmd('bold')" class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-200 text-gray-700 font-bold transition-all" title="加粗 (Ctrl+B)">B</button>
                        <button onmousedown="event.preventDefault(); app.execCmd('italic')" class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-200 text-gray-700 italic font-serif transition-all" title="倾斜 (Ctrl+I)">I</button>
                        <button onmousedown="event.preventDefault(); app.execCmd('underline')" class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-200 text-gray-700 underline transition-all" title="下划线 (Ctrl+U)">U</button>
                    </div>
                    
                    <div id="combo-text" contenteditable="true" class="w-full h-48 p-5 outline-none overflow-y-auto bg-white text-base text-gray-800 leading-relaxed rich-text-content" placeholder="在此输入文字，可选中文字进行局部样式修改..."></div>
                </div>
                
                <div class="border-t pt-6 mt-2">
                    <div class="flex justify-between items-end mb-4">
                        <h3 class="font-bold text-gray-700 text-lg">多媒体资产与附件</h3>
                        <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">支持拖拽排序，向下滚动查看</span>
                    </div>
                    
                    <ul id="combo-items-list" class="flex flex-col gap-3 mb-4 min-h-[5px]"></ul>
                    
                    <div id="combo-drop-zone" class="relative w-full h-28 bg-blue-50/50 rounded-xl border-2 border-dashed border-blue-200 flex flex-col items-center justify-center hover:bg-blue-50 hover:border-primary transition-all group">
                        <input type="file" id="combo-file-input" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="app.handleComboFileSelect(event)">
                        <i class="fas fa-plus-circle text-3xl text-blue-300 group-hover:text-primary transition-colors mb-2"></i>
                        <p class="text-sm text-gray-500 font-medium">点击或将<span class="text-primary mx-1"> 图片 / 音视频 / PPT / 文档 </span>拖拽至此极速上传</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 游客鉴权遮罩层 -->
    <div id="tourist-mask" class="fixed inset-0 bg-white/90 backdrop-blur-md z-40 flex flex-col items-center justify-center">
        <i class="fas fa-shield-alt text-6xl text-gray-300 mb-6"></i>
        <h3 class="text-2xl font-semibold text-gray-700">内容管理控制台</h3>
        <p class="text-sm text-gray-500 mt-3 text-center px-8 leading-relaxed">本后台仅供管理员访问，负责拼装内容、修改页面与更新活码。<br>若您是访客，请直接扫描独立二维码查看对应的内容。</p>
        <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="mt-8 bg-primary text-white px-8 py-3 rounded-full shadow-[0_4px_14px_0_rgba(30,144,255,0.39)] hover:bg-blue-600 transition-all font-bold text-lg tracking-wider">验证管理员身份</button>
    </div>

    <!-- 悬浮退出按钮 -->
    <button onclick="app.logout()" id="logout-float-btn" class="admin-only fixed bottom-8 right-8 w-14 h-14 bg-red-500 text-white rounded-full shadow-[0_8px_30px_rgb(239,68,68,0.4)] items-center justify-center hover:bg-red-600 transition-all z-50 hover:-translate-y-1">
        <i class="fas fa-power-off text-xl"></i>
    </button>

    <!-- 管理员登录弹窗 -->
    <div id="login-modal" class="fixed inset-0 bg-black/60 z-[200] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-8 w-80 shadow-2xl transform transition-all relative">
            <h3 class="text-2xl font-black mb-8 text-center text-gray-800 tracking-wide">系统鉴权</h3>
            <div class="mb-8">
                <label class="block text-sm text-gray-500 mb-2 font-medium">安全校验口令</label>
                <input type="password" id="admin-pwd" class="w-full p-3.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-primary/50 transition-all text-lg font-medium" placeholder="请输入密码">
            </div>
            <div class="flex gap-4">
                <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl hover:bg-gray-200 transition-all font-bold">取消</button>
                <button onclick="app.login()" class="flex-1 py-3 bg-primary text-white rounded-xl hover:bg-blue-600 transition-all font-bold shadow-md tracking-wider">登录</button>
            </div>
        </div>
    </div>

    <!-- 文档与多媒体全屏预览弹窗 -->
    <div id="preview-modal" class="fixed inset-0 bg-black/90 z-[250] hidden flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="absolute top-6 right-6">
            <button onclick="app.closePreview()" class="text-white hover:text-red-400 text-4xl transition-colors">
                <i class="fas fa-times-circle"></i>
            </button>
        </div>
        <div id="preview-content" class="w-11/12 h-5/6 bg-transparent rounded-2xl overflow-hidden flex items-center justify-center relative"></div>
    </div>

    <!-- 核心业务逻辑脚本 -->
    <script>
        const app = {
            state: {
                currentMode: 'text', 
                blocks: [], 
                isAdmin: false,
                token: sessionStorage.getItem('adminToken') || '',
                liveUrl: window.location.origin + window.location.pathname, 
                comboDraft: { title: '', text: '', items: [] },
                
                draggedItemIndex: null,
                draggedMainIndex: null,
                
                isLiveMode: false,
                urlConfig: { mode: 'live', staticUrl: '' }
            },

            configs: {
                text: { icon: 'fa-keyboard', title: '添加纯文本', hint: '支持常规段落', accept: null },
                url: { icon: 'fa-link', title: '配置网址引擎', hint: '支持静态跳转与活码分发', accept: null },
                image: { icon: 'fa-image', title: '添加独立图片', hint: '支持 png/jpg 等格式', accept: 'image/*' },
                audio: { icon: 'fa-music', title: '添加独立音频', hint: '在线流畅播放', accept: 'audio/*' },
                video: { icon: 'fa-video', title: '添加独立视频', hint: '原生UI沉浸式播放', accept: 'video/*' },
                document: { icon: 'fa-file-word', title: '添加独立文档', hint: '支持 PPT/Word 跨设备在线预览', accept: '.doc,.docx,.ppt,.pptx,.xls,.xlsx,.pdf,.wps' },
                form: { icon: 'fa-list-check', title: '添加表单', hint: '复用高级表单模板库', accept: null },
                uploaded: { icon: 'fa-cloud', title: '后台资源池', hint: '可查阅/清理所有已上传资产', accept: null }
            },

            // 完美保留的表单模板库引擎 
            formTemplates: [
                { icon: 'fa-id-badge', color: 'text-blue-500', title: '来访登记', desc: '包含字段：姓名、手机、受访人姓名、来访事由' },
                { icon: 'fa-book-open', color: 'text-green-500', title: '课程报名表', desc: '包含字段：姓名、手机、课程' },
                { icon: 'fa-comment-alt', color: 'text-orange-400', title: '意见反馈表', desc: '包含字段：意见类型、反馈描述、图片附件' },
                { icon: 'fa-calendar-check', color: 'text-teal-400', title: '会议签到', desc: '只能在现场扫码填表' },
                { icon: 'fa-hard-hat', color: 'text-orange-500', title: '设备巡检单', desc: '包含字段：检查结果、巡检记录、现场照片' },
                { icon: 'fa-star', color: 'text-emerald-500', title: '服务评价', desc: '包含字段：服务窗口、评分、意见建议' }
            ],

            async init() {
                const urlParams = new URLSearchParams(window.location.search);
                
                if (urlParams.get('view') === 'live') {
                    this.state.isLiveMode = true;
                    document.getElementById('mobile-live-container').classList.remove('hidden');
                    document.getElementById('mobile-live-container').classList.add('flex', 'flex-col');
                    document.getElementById('tourist-mask').classList.add('hidden');
                    await this.fetchCloudConfig();
                    
                    // 强制对象显式调用，修复在 http 访问或特定浏览器下由于作用域引发的不可预见报错
                    app.renderLiveH5();
                    return;
                }

                if (this.state.token) {
                    await this.verifyTokenSilent();
                } else {
                    this.enforceTouristMode();
                }

                this.bindGlobalDragAndDrop();
                this.updateNavUI();
                this.renderInputArea();
                
                await this.fetchCloudConfig();
            },

            // ================= 身份鉴权控制 =================
            async login() {
                const pwd = document.getElementById('admin-pwd').value;
                try {
                    const res = await fetch('/api/auth', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ password: pwd }) 
                    });
                    
                    if (res.ok) {
                        this.state.token = pwd;
                        sessionStorage.setItem('adminToken', pwd);
                        document.getElementById('login-modal').classList.add('hidden');
                        this.enableAdminMode();
                    } else {
                        alert('⚠️ 鉴权失败：密码错误，请检查您的 CF 环境变量。');
                    }
                } catch (e) { 
                    alert('后端连接异常，请确认 CF Pages 部署状态'); 
                }
            },
            
            async verifyTokenSilent() {
                try {
                    const res = await fetch('/api/auth', { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ password: this.state.token }) 
                    });
                    if (res.ok) {
                        this.enableAdminMode();
                    } else {
                        this.enforceTouristMode();
                    }
                } catch (e) { 
                    this.enforceTouristMode(); 
                }
            },
            
            logout() { 
                this.state.token = ''; 
                sessionStorage.removeItem('adminToken'); 
                this.enforceTouristMode(); 
            },
            
            enableAdminMode() {
                this.state.isAdmin = true; 
                document.body.classList.add('is-admin');
                document.getElementById('tourist-mask').classList.add('hidden');
                if (this.state.currentMode === 'uploaded') {
                    this.renderInputArea();
                }
            },
            
            enforceTouristMode() {
                this.state.isAdmin = false; 
                document.body.classList.remove('is-admin');
                document.getElementById('tourist-mask').classList.remove('hidden');
            },

            // ================= 云端通讯引擎 (R2 接口) =================
            async fetchCloudConfig() {
                try {
                    const res = await fetch('/api/config');
                    if (res.ok) {
                        this.state.blocks = await res.json() || [];
                        if (!this.state.isLiveMode) {
                            this.renderBlocks();
                        }
                    }
                } catch (e) {
                    console.error('配置加载失败', e);
                }
            },
            
            async syncToCloud() {
                if (!this.state.isAdmin) return;
                try {
                    const res = await fetch('/api/config', { 
                        method: 'POST', 
                        headers: { 
                            'Content-Type': 'application/json', 
                            'Authorization': `Bearer ${this.state.token}` 
                        }, 
                        body: JSON.stringify(this.state.blocks) 
                    });
                    if (res.ok) {
                        alert('🚀 全局流水线同步成功！您的所有资源活码已全域生效。');
                    } else {
                        alert('发布失败，请检查网络');
                    }
                } catch (e) {
                    alert('同步网络断开');
                }
            },
            
            // ================= 【极速切片并发上传】=================
            async uploadFilesConcurrent(files, progressCallback) {
                if (!this.state.isAdmin) return [];
                
                const totalSize = Array.from(files).reduce((sum, f) => sum + f.size, 0);
                const loadedMap = new Map();
                const CHUNK_SIZE = 15 * 1024 * 1024; 
                
                const uploadPromises = Array.from(files).map(async (file) => {
                    
                    if (file.size <= CHUNK_SIZE) {
                        return new Promise((resolve) => {
                            const formData = new FormData(); 
                            formData.append('file', file);
                            
                            const xhr = new XMLHttpRequest();
                            xhr.open('POST', '/api/upload', true);
                            xhr.setRequestHeader('Authorization', `Bearer ${this.state.token}`);
                            
                            xhr.upload.onprogress = (event) => {
                                if (event.lengthComputable) {
                                    loadedMap.set(file.name, event.loaded);
                                    const currentLoaded = Array.from(loadedMap.values()).reduce((a, b) => a + b, 0);
                                    const percent = Math.floor((currentLoaded / totalSize) * 100);
                                    if (progressCallback) progressCallback(percent);
                                }
                            };
                            
                            xhr.onload = () => {
                                if (xhr.status === 200) {
                                    try {
                                        resolve({ file: file, data: JSON.parse(xhr.responseText) });
                                    } catch(e) {
                                        resolve({ file: file, data: null });
                                    }
                                } else {
                                    try {
                                        const errData = JSON.parse(xhr.responseText);
                                        alert(`上传失败: ${errData.message}`);
                                    } catch(e) {}
                                    resolve({ file: file, data: null });
                                }
                            };
                            
                            xhr.onerror = () => { resolve({ file: file, data: null }); };
                            xhr.send(formData);
                        });
                        
                    } else {
                        try {
                            let res = await fetch('/api/upload/init', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.state.token}` },
                                body: JSON.stringify({ filename: file.name, mimeType: file.type || 'application/octet-stream' })
                            });
                            
                            const initData = await res.json();
                            if (!initData.success) throw new Error(initData.message || '初始化分片失败');
                            const { key, uploadId } = initData;

                            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
                            const parts = [];
                            let fileLoaded = 0;

                            for (let i = 0; i < totalChunks; i++) {
                                const start = i * CHUNK_SIZE;
                                const end = Math.min(start + CHUNK_SIZE, file.size);
                                const chunk = file.slice(start, end);

                                const chunkData = await new Promise((resolve, reject) => {
                                    const xhr = new XMLHttpRequest();
                                    xhr.open('POST', `/api/upload/part?key=${encodeURIComponent(key)}&uploadId=${encodeURIComponent(uploadId)}&partNumber=${i + 1}`, true);
                                    xhr.setRequestHeader('Authorization', `Bearer ${this.state.token}`);
                                    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                                    
                                    let lastChunkLoaded = 0;
                                    xhr.upload.onprogress = (event) => {
                                        if (event.lengthComputable) {
                                            const diff = event.loaded - lastChunkLoaded;
                                            lastChunkLoaded = event.loaded;
                                            fileLoaded += diff;
                                            
                                            loadedMap.set(file.name, fileLoaded);
                                            const currentLoaded = Array.from(loadedMap.values()).reduce((a, b) => a + b, 0);
                                            const percent = Math.floor((currentLoaded / totalSize) * 100);
                                            
                                            if (progressCallback) progressCallback(percent);
                                        }
                                    };
                                    
                                    xhr.onload = () => {
                                        if (xhr.status === 200) { 
                                            resolve(JSON.parse(xhr.responseText).part); 
                                        } else { 
                                            reject(new Error(`分片 ${i+1} 云端拒收`)); 
                                        }
                                    };
                                    xhr.onerror = () => reject(new Error('分片网络中断'));
                                    xhr.send(chunk);
                                });
                                parts.push(chunkData);
                            }

                            res = await fetch('/api/upload/complete', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.state.token}` },
                                body: JSON.stringify({ key, uploadId, parts })
                            });
                            
                            const compData = await res.json();
                            if (!compData.success) throw new Error(compData.message || '合并分片失败');
                            
                            return { file: file, data: { success: true, url: compData.url, name: file.name, size: file.size } };
                            
                        } catch (e) {
                            console.error(e);
                            alert(`大文件 [${file.name}] 上传失败: \n${e.message}`);
                            return { file: file, data: null };
                        }
                    }
                });
                
                return await Promise.all(uploadPromises);
            },

            // ================= 游客端 针对单个文件的一键极速打包下载 =================
            async downloadAllFiles() {
                const urlParams = new URLSearchParams(window.location.search);
                const blockId = urlParams.get('id');
                
                let targetBlocks = this.state.blocks;
                if (blockId) {
                    targetBlocks = this.state.blocks.filter(b => b.id === blockId);
                }

                if (targetBlocks.length === 0) {
                    return alert('当前页面没有任何内容可供下载。');
                }
                
                const btn = document.getElementById('btn-batch-download');
                if (btn) {
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> 极速预处理中...';
                }

                try {
                    const zip = new JSZip();
                    const folder = zip.folder("专属下载资产包");
                    
                    let textSummary = "===== 页面内容与文本摘要 =====\n\n";
                    let fileCount = 0;
                    
                    const tasks = [];
                    const namesTracker = {}; 
                    
                    let totalTasks = 0;
                    let completedTasks = 0;

                    const addFileTask = (url, originalName) => {
                        totalTasks++;
                        tasks.push(async () => {
                            try {
                                const response = await fetch(url);
                                const blob = await response.blob();
                                
                                let safeName = originalName || `文件_${Date.now()}.bin`;
                                if (namesTracker[safeName]) {
                                    const parts = safeName.split('.');
                                    const ext = parts.length > 1 ? '.' + parts.pop() : '';
                                    safeName = `${parts.join('.')} (${namesTracker[safeName]})${ext}`;
                                    namesTracker[originalName]++;
                                } else {
                                    namesTracker[safeName] = 1;
                                }

                                folder.file(safeName, blob);
                                fileCount++;
                                completedTasks++;
                                
                                if (btn && totalTasks > 0) {
                                    const percent = Math.floor((completedTasks / totalTasks) * 50);
                                    btn.innerHTML = `<i class="fas fa-cloud-download-alt mr-2"></i> 极速拉取资源... ${percent}%`;
                                }
                            } catch (err) {
                                console.error(`文件下载失败: ${originalName}`, err);
                            }
                        });
                    };

                    targetBlocks.forEach(block => {
                        if (block.type === 'text') {
                            textSummary += `[独立文本]\n${block.content}\n\n`;
                        }
                        if (block.type === 'url' && !block.isStatic) {
                            textSummary += `[相关链接]\n${block.content}\n\n`;
                        }
                        if (['image', 'audio', 'video', 'document'].includes(block.type)) {
                            addFileTask(block.content.url, block.content.name);
                        }
                        if (block.type === 'combo') {
                            if (block.content.title || block.content.text) {
                                textSummary += `[组合: ${block.content.title || '无题'}]\n${this.stripHtml(block.content.text) || ''}\n\n`;
                            }
                            if (block.content.items && block.content.items.length > 0) {
                                block.content.items.forEach(item => {
                                    addFileTask(item.url, item.name);
                                });
                            }
                        }
                    });

                    if (textSummary.trim().length > 30) {
                        folder.file("页面文本内容摘要.txt", textSummary);
                    }

                    await Promise.all(tasks.map(t => t()));

                    if (fileCount === 0 && textSummary.trim().length <= 30) {
                        throw new Error('未找到任何可打包的文件资源');
                    }

                    const content = await zip.generateAsync({ 
                        type: "blob",
                        compression: "STORE" 
                    }, (metadata) => {
                        if (btn) {
                            const percent = 50 + Math.floor(metadata.percent / 2);
                            btn.innerHTML = `<i class="fas fa-box text-xl mr-2"></i> 极速生成压缩包中... ${percent}%`;
                        }
                    });
                    
                    saveAs(content, `全部资源打包_${new Date().getTime()}.zip`);
                    
                    if (btn) {
                        btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> 下载完成';
                        btn.classList.replace('from-blue-500', 'from-green-500');
                        btn.classList.replace('to-indigo-600', 'to-green-600');
                        setTimeout(() => {
                            btn.innerHTML = '<i class="fas fa-cloud-download-alt mr-2"></i> 一键打包下载全部内容';
                            btn.classList.replace('from-green-500', 'from-blue-500');
                            btn.classList.replace('to-green-600', 'to-indigo-600');
                        }, 3000);
                    }
                } catch (e) {
                    alert('打包下载失败，网络中断或触发浏览器跨域限制。');
                    if (btn) {
                        btn.innerHTML = '<i class="fas fa-cloud-download-alt mr-2"></i> 一键打包下载全部内容';
                    }
                }
            },

                    const items = this.state.comboDraft.items; 
                    const [removed] = items.splice(sourceIndex, 1); 
                    items.splice(targetIndex, 0, removed); 
                    this.renderComboItems();

            switchUrlMode(mode) {
                this.state.urlConfig.mode = mode;
                if (mode === 'static') {
                    this.state.urlConfig.staticUrl = document.getElementById('input-data')?.value || '';
                } else {
                    this.state.urlConfig.staticUrl = '';
                }
                this.updateNavUI();
                this.renderInputArea();
            },
            
            handleStaticUrlInput(val) {
                let fullUrl = val.trim();
                if (fullUrl && !/^https?:\/\//i.test(fullUrl)) {
                    fullUrl = 'https://' + fullUrl;
                }
                this.state.urlConfig.staticUrl = fullUrl;
            },

            async handleMainFileSelect(event) {
                if (!this.state.isAdmin) return;
                const files = event.target.files || (event.dataTransfer ? event.dataTransfer.files : null);
                if (!files || files.length === 0) return;
                
                document.getElementById('upload-drop-ui').classList.add('hidden'); 
                document.getElementById('upload-progress-ui').classList.remove('hidden');
                
                const results = await this.uploadFilesConcurrent(files, (percent) => {
                    const statusText = document.getElementById('upload-status-text');
                    if (statusText) statusText.innerText = `极速网络上传中: ${percent}%`;
                });
                
                results.forEach(res => {
                    if (res.data && res.data.success) {
                        let type = 'document';
                        if (res.file.type.startsWith('image/')) {
                            type = 'image'; 
                        } else if (res.file.type.startsWith('audio/')) {
                            type = 'audio'; 
                        } else if (res.file.type.startsWith('video/')) {
                            type = 'video';
                        }
                        
                        this.addBlockToState(type, { 
                            url: res.data.url, 
                            name: res.data.name, 
                            size: (res.data.size/1024/1024).toFixed(2) + ' MB' 
                        });
                    }
                });
                
                document.getElementById('upload-drop-ui').classList.remove('hidden'); 
                document.getElementById('upload-progress-ui').classList.add('hidden');
            },
            
            addCurrentBlock() {
                if (!this.state.isAdmin) return;
                const mode = this.state.currentMode;
                
                if (mode === 'text' || mode === 'url') {
                    let val = document.getElementById('input-data').value.trim();
                    
                    let isStaticUrl = false;
                    if (mode === 'url' && this.state.urlConfig.mode === 'static') {
                        isStaticUrl = true;
                    }

                    if (mode === 'url' && val && !/^https?:\/\//i.test(val)) {
                        val = 'https://' + val;
                    }
                    if (val) { 
                        if (isStaticUrl) {
                            this.addBlockToState('url', { url: val, isStatic: true }); 
                        } else {
                            this.addBlockToState(mode, val);
                        }
                        document.getElementById('input-data').value = ''; 
                    }
                }
            },

            // 表单专属直接派发器 (已恢复)
            addBlankForm() {
                this.addBlockToState('form', { title: '未命名空白表单', desc: '请在后台进一步配置详细字段' });
            },
            addFormTemplate(index) {
                const tpl = this.formTemplates[index];
                this.addBlockToState('form', { title: tpl.title, desc: tpl.desc });
            },
            
            addBlockToState(type, content) {
                this.state.blocks.push({ id: 'block_' + Date.now() + Math.floor(Math.random()*100), type: type, content: content });
                this.renderBlocks(); 
                if (this.state.currentMode === 'uploaded') {
                    this.renderInputArea();
                }
            },
            
            removeBlock(id) {
                if (!this.state.isAdmin) return;
                const target = this.state.blocks.find(b => b.id === id);
                if (target) {
                    if (target.type === 'combo' && target.content.items) {
                        target.content.items.forEach(item => this.deleteCloudFile(item.url));
                    } else if (target.content.url) {
                        this.deleteCloudFile(target.content.url);
                    }
                }
                this.state.blocks = this.state.blocks.filter(b => b.id !== id);
                this.renderBlocks(); 
                if (this.state.currentMode === 'uploaded') {
                    this.renderInputArea();
                }
            },

            // ================= 视图渲染与多媒体预览 =================
            openDocumentPreview(url, name) {
                const ext = name.split('.').pop().toLowerCase();
                const absoluteUrl = url.startsWith('http') ? url : (window.location.origin + url);
                const contentBox = document.getElementById('preview-content');
                document.getElementById('preview-modal').classList.remove('hidden');
                
                let inner = '';
                if (ext === 'pdf') {
                    inner = `<iframe src="${url}" class="w-full h-full border-none"></iframe>`;
                } else if (['doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx'].includes(ext)) {
                    inner = `<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(absoluteUrl)}" class="w-full h-full border-none bg-white"></iframe>`;
                } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                    inner = `<img src="${url}" class="max-w-full max-h-full object-contain">`;
                } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
                    inner = `<video src="${url}" controls autoplay class="max-w-full max-h-full"></video>`;
                } else {
                    inner = `
                        <div class="text-center bg-white p-12 rounded-2xl shadow-2xl">
                            <i class="fas fa-file text-7xl text-gray-300 mb-6"></i>
                            <p class="text-gray-600 mb-6 font-medium text-lg">不支持在浏览器直接预览此格式</p>
                            <a href="${url}" download class="bg-primary text-white px-8 py-3 rounded-full shadow-lg font-bold text-lg hover:bg-blue-600 transition-colors">直接下载到本地</a>
                        </div>
                    `;
                }
                contentBox.innerHTML = inner;
            },
            
            closePreview() { 
                document.getElementById('preview-modal').classList.add('hidden'); 
                document.getElementById('preview-content').innerHTML = ''; 
            },

            generateBlockHtml(block, isLive = false) {
                let html = '';
                const baseClass = isLive ? 'w-full mb-6 bg-white p-6 rounded-[20px] shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-gray-100 overflow-hidden' : 'flex-1';
                
                const isStaticUrl = block.type === 'url' && typeof block.content === 'object' && block.content.isStatic;
                const urlString = isStaticUrl ? block.content.url : block.content;

                if (block.type === 'combo') {
                    const c = block.content; 
                    let comboInner = '';
                    
                    if (c.title) {
                        comboInner += `<h2 class="text-2xl font-black text-gray-800 mb-4 leading-tight">${this.escapeHtml(c.title)}</h2>`;
                    }
                    if (c.text) {
                        comboInner += `<div class="leading-relaxed mb-6 opacity-95 break-words rich-text-content text-[15px]">${c.text}</div>`;
                    }
                    if (c.items && c.items.length > 0) {
                        comboInner += `<div class="flex flex-col gap-4 mt-5 border-t border-gray-100 pt-6">`;
                        c.items.forEach(item => { 
                            comboInner += `<div class="rounded-xl overflow-hidden shadow-sm border border-gray-100 bg-gray-50 hover:bg-white hover:shadow-md transition-all">${this.generateBlockHtml({type: item.type, content: item}, false)}</div>`; 
                        });
                        comboInner += `</div>`;
                    }
                    
                    return `
                        <div class="${baseClass} relative pl-4">
                            <div class="absolute top-0 left-0 w-1.5 h-full bg-primary rounded-l-2xl"></div>
                            ${comboInner}
                        </div>
                    `;
                }

                switch (block.type) {
                    case 'text': 
                        html = `<div class="${baseClass}"><p class="text-gray-800 whitespace-pre-wrap leading-relaxed text-[15px]">${this.escapeHtml(block.content)}</p></div>`; 
                        break;
                    case 'url': 
                        html = `<div class="${baseClass}"><a href="${this.escapeHtml(urlString)}" target="_blank" class="text-blue-500 underline flex items-center break-all hover:text-blue-600 transition-colors font-bold text-[15px]"><i class="fas fa-external-link-alt mr-2 shrink-0"></i> ${this.escapeHtml(urlString)}</a></div>`; 
                        break;
                    case 'image': 
                        html = `<div class="${baseClass} p-0"><img src="${block.content.url}" class="w-full rounded-xl cursor-pointer hover:opacity-90 hover:shadow-lg transition-all object-cover max-h-[500px]" onclick="app.openDocumentPreview('${block.content.url}', '${block.content.name}')"></div>`; 
                        break;
                    case 'audio': 
                        html = `<div class="${baseClass} flex flex-col p-5 bg-gray-50 rounded-2xl border border-gray-100"><span class="text-[15px] font-bold text-gray-800 mb-4 truncate px-2 border-l-4 border-green-500 pl-3 leading-none flex items-center"><i class="fas fa-music text-green-500 mr-2.5 text-lg"></i>${block.content.name}</span><audio controls src="${block.content.url}" class="w-full outline-none h-12 rounded-full bg-white shadow-sm border border-gray-200"></audio></div>`; 
                        break;
                    case 'video': 
                        html = `<div class="${baseClass} bg-black flex justify-center p-0 m-0 relative group rounded-2xl overflow-hidden shadow-inner"><video src="${block.content.url}" controls class="w-full max-h-[450px] object-contain"></video></div>`; 
                        break;
                    case 'document': 
                        html = `<div class="${baseClass} flex items-center bg-gray-50 rounded-2xl p-5 hover:bg-white transition-colors border border-gray-100"><div class="w-14 h-14 bg-white shadow-sm text-red-500 rounded-xl flex items-center justify-center mr-4 shrink-0 border border-gray-100"><i class="fas fa-file-pdf text-3xl"></i></div><div class="flex flex-col flex-1 overflow-hidden mr-4"><span class="text-[15px] font-bold text-gray-800 truncate">${block.content.name}</span><span class="text-xs text-gray-400 mt-1.5 font-medium">${block.content.size} · 点击右侧全屏预览</span></div><div class="flex flex-col gap-2.5 shrink-0"><button onclick="app.openDocumentPreview('${block.content.url}', '${block.content.name}')" class="text-xs bg-gray-200 px-4 py-2 rounded-lg text-gray-700 hover:bg-gray-300 font-bold transition-all shadow-sm">全屏查看</button><a href="${block.content.url}" download class="text-xs bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-600 text-center font-bold shadow-md"><i class="fas fa-download mr-1"></i>下载</a></div></div>`; 
                        break;
                    case 'form': 
                        html = `
                            <div class="${baseClass} border-2 border-dashed border-indigo-200 bg-indigo-50/40 p-8 relative overflow-hidden rounded-2xl">
                                <div class="absolute -right-8 -top-8 w-32 h-32 bg-indigo-100 rounded-full opacity-40"></div>
                                <h4 class="font-black text-indigo-900 mb-2 text-center text-xl relative z-10 tracking-wide">${this.escapeHtml(block.content.title)}</h4>
                                ${block.content.desc ? `<p class="text-indigo-600 text-[13px] text-center mb-6 relative z-10 font-medium">${this.escapeHtml(block.content.desc)}</p>` : '<div class="mb-6"></div>'}
                                <input type="text" placeholder="您的姓名" class="w-full p-3.5 mb-4 border border-white rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-indigo-300 text-[15px] font-medium relative z-10">
                                <input type="tel" placeholder="联系方式" class="w-full p-3.5 mb-6 border border-white rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-indigo-300 text-[15px] font-medium relative z-10">

                            </div>
                        `; 
                        break;
                }
                return html;
            },

            // ================= 核心重构：【终极压迫版】单排横贯极简卡片展示 =================
            renderBlocks() {
                const container = document.getElementById('blocks-container');
                if (!container) return;
                
                if (this.state.blocks.length === 0) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-48 text-gray-400 w-full col-span-full">
                            <i class="fas fa-layer-group text-5xl mb-4 opacity-30"></i>
                            <p class="text-sm font-medium tracking-widest">流水线空空如也</p>
                        </div>
                    `; 
                    return;
                }
                
                container.innerHTML = '';
                
                this.state.blocks.forEach((block, index) => {
                    const blockEl = document.createElement('div');
                    blockEl.draggable = true;
                    // 【绝对横向极限压扁】：强制去除 flex-col 和冗余高度，锁定在约 96px 内极度贴合
                    blockEl.className = 'block-animate bg-white border border-gray-100 rounded-[16px] p-3 flex flex-row items-center group relative shadow-sm hover:shadow-md transition-all h-[96px] border-l-[4px] border-l-primary cursor-move w-full';
                    
                    blockEl.ondragstart = (e) => this.handleMainDragStart(e, index); 
                    blockEl.ondragover = (e) => this.handleMainDragOver(e); 
                    blockEl.ondrop = (e) => this.handleMainDrop(e, index); 
                    blockEl.ondragend = (e) => this.handleMainDragEnd(e);

                    let icon = 'fa-file'; let title = ''; let descHtml = '';
                    const isStaticUrl = block.type === 'url' && typeof block.content === 'object' && block.content.isStatic;
                    const urlString = isStaticUrl ? block.content.url : block.content;
                    
                    // 摘要提取（单行强力截断防撑高）
                    switch(block.type) {
                        case 'text': icon='fa-font text-blue-500'; title='文本段落'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content)}</div>`; break;
                        case 'url': icon='fa-link text-blue-500'; title=isStaticUrl ? '静态直达链接' : '动态活码链接'; descHtml = `<div class="text-[12px] text-blue-400 mt-1 truncate font-medium w-full">${this.escapeHtml(urlString)}</div>`; break;
                        case 'image': icon='fa-image text-green-500'; title='图片资源'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content.name)}</div>`; break;
                        case 'audio': icon='fa-music text-yellow-500'; title='音频文件'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content.name)}</div>`; break;
                        case 'video': icon='fa-video text-purple-500'; title='视频文件'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content.name)}</div>`; break;
                        case 'document': icon='fa-file-pdf text-red-500'; title='文档附件'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content.name)}</div>`; break;
                        case 'form': icon='fa-list-check text-indigo-500'; title='数据表单'; descHtml = `<div class="text-[12px] text-gray-500 mt-1 truncate font-medium w-full">${this.escapeHtml(block.content.title)}</div>`; break;
                        case 'combo': icon='fa-cubes text-primary'; title=block.content.title || '图文组合'; let itemsCount = block.content.items ? block.content.items.length : 0; let textPreview = block.content.text ? this.stripHtml(block.content.text) : '';
                            descHtml = `<div class="flex items-center gap-2 mt-1 w-full overflow-hidden"><span class="text-[12px] text-gray-500 truncate flex-1">${textPreview || '无文字内容'}</span><span class="inline-block font-bold text-primary bg-blue-50 px-1.5 py-0.5 rounded text-[10px] shrink-0">包含 ${itemsCount} 媒体</span></div>`; break;
                    }

                    let targetUrl = this.state.liveUrl + '?view=live&id=' + block.id;
                    if (isStaticUrl) targetUrl = urlString;

                    // 【横排终极渲染】：左（延展标题）- 中（纯净微码）- 右（扁平按键），彻底抹平卡片高度！
                    blockEl.innerHTML = `
                        <!-- 左侧：图标与标题摘要，吃掉所有闲余空间 -->
                        <div class="flex items-center gap-4 flex-1 min-w-0 h-full pl-2 pr-6 border-r border-gray-50">
                            <div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center shrink-0 border border-gray-100 shadow-inner">
                                <i class="fas ${icon} text-xl"></i>
                            </div>
                            <div class="flex flex-col flex-1 min-w-0 justify-center">
                                <span class="font-black text-gray-800 text-[15px] truncate w-full">${this.escapeHtml(title)}</span>
                                ${descHtml}
                            </div>
                        </div>
                        
                        <!-- 中间：剥离冗余底框的纯净极简微型二维码 -->
                        <div class="shrink-0 flex items-center justify-center bg-white border border-gray-100 rounded-lg p-1 shadow-sm mx-4" onmousedown="event.stopPropagation();">
                            <div id="qrcode-${block.id}" class="w-[64px] h-[64px]"></div>
                        </div>
                        
                        <!-- 右侧：极其紧凑的文字与并列扁平按键 -->
                        <div class="shrink-0 flex flex-col justify-center gap-1.5 w-[140px] pr-2 h-full" onmousedown="event.stopPropagation();">
                            <p class="text-[9px] text-gray-400 text-center leading-tight tracking-wide font-medium">扫码查看此内容<br>(一物一码分发)</p>
                            <div class="flex gap-1.5 w-full">
                                <button onclick="app.copyBlockLink(event, '${block.id}', ${isStaticUrl}, '${urlString}')" class="flex-1 bg-blue-50 text-blue-500 border border-blue-100 py-1 rounded-[6px] hover:bg-blue-500 hover:text-white transition-all text-[11px] font-bold shadow-sm flex items-center justify-center">复制</button>
                                <button onclick="app.downloadBlockQR('${block.id}')" class="flex-1 bg-gray-50 text-gray-600 border border-gray-200 py-1 rounded-[6px] hover:bg-gray-100 transition-all text-[11px] font-bold shadow-sm flex items-center justify-center">下载</button>
                            </div>
                        </div>
                        
                        <!-- 悬浮红叉关闭按钮，完全浮空展现 -->
                        <button onclick="app.removeBlock('${block.id}')" class="absolute -top-2.5 -right-2.5 w-6 h-6 rounded-full bg-red-500 text-white flex items-center justify-center transition-transform hover:scale-110 shadow-md border-2 border-white z-20 opacity-0 group-hover:opacity-100">
                            <i class="fas fa-times text-[10px] font-bold"></i>
                        </button>
                    `;
                    container.appendChild(blockEl);
                });

                // 静默无阻塞渲染超清微缩小码
                setTimeout(() => {
                    this.state.blocks.forEach(block => {
                        const isStaticUrl = block.type === 'url' && typeof block.content === 'object' && block.content.isStatic;
                        let targetUrl = this.state.liveUrl + '?view=live&id=' + block.id;
                        if (isStaticUrl) targetUrl = block.content.url;
                        
                        const qrBox = document.getElementById(`qrcode-${block.id}`);
                        if (qrBox) {
                            new QRCode(qrBox, {
                                text: targetUrl,
                                width: 64, 
                                height: 64,
                                colorDark : '#111827',
                                colorLight : '#ffffff',
                                correctLevel : QRCode.CorrectLevel.M
                            });
                        }
                    });
                }, 100);
            },

            // ================= 发布流原生 H5 拖拽支持 =================
            handleMainDragStart(e, index) { 
                this.state.draggedMainIndex = index; 
                e.dataTransfer.effectAllowed = "move"; 
                e.target.classList.add('sortable-ghost'); 
            },
            handleMainDragOver(e) { 
                e.preventDefault(); 
                e.dataTransfer.dropEffect = "move"; 
            },
            handleMainDrop(e, targetIndex) {
                e.preventDefault(); 
                const sourceIndex = this.state.draggedMainIndex;
                if (sourceIndex !== null && sourceIndex !== targetIndex) {
                    const blocks = this.state.blocks; 
                    const [removed] = blocks.splice(sourceIndex, 1); 
                    blocks.splice(targetIndex, 0, removed); 
                    this.renderBlocks();
                }
            },
            handleMainDragEnd(e) { 
                e.target.classList.remove('sortable-ghost'); 
                this.state.draggedMainIndex = null; 
            },

            // 独立模块专属功能支持
            downloadBlockQR(blockId) {
                const canvas = document.querySelector(`#qrcode-${blockId} canvas`);
                if(!canvas) return alert('专属二维码生成中，请稍候');
                
                const url = canvas.toDataURL("image/png");
                const a = document.createElement('a');
                a.download = `专属活码_${blockId}_${new Date().getTime()}.png`;
                a.href = url;
                a.click();
            },
            
            // 安全防抛错剪贴板
            copyBlockLink(e, blockId, isStatic, rawUrl) {
                let linkToCopy = this.state.liveUrl + '?view=live&id=' + blockId;
                if (isStatic) {
                    linkToCopy = rawUrl;
                }
                
                const btn = e.currentTarget; 
                const oldHtml = btn.innerHTML;

                const successUI = () => {
                    btn.innerHTML = '<i class="fas fa-check"></i>'; 
                    btn.classList.replace('text-blue-500', 'text-white'); 
                    btn.classList.replace('bg-blue-50', 'bg-green-500');
                    btn.classList.replace('border-blue-100', 'border-green-500');
                    setTimeout(() => { 
                        btn.innerHTML = oldHtml; 
                        btn.classList.replace('text-white', 'text-blue-500'); 
                        btn.classList.replace('bg-green-500', 'bg-blue-50');
                        btn.classList.replace('border-green-500', 'border-blue-100');
                    }, 2000);
                };

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(linkToCopy).then(successUI).catch(() => {
                        this.fallbackCopy(linkToCopy, successUI);
                    });
                } else {
                    this.fallbackCopy(linkToCopy, successUI);
                }
            },

            fallbackCopy(text, successCallback) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    successCallback();
                } catch (err) {
                    alert('复制失败，请手动复制链接:\n\n' + text);
                }
                document.body.removeChild(textArea);
            },

            // 完美规避缓存无函数报错，且精准实现智能 H5 拦截
            renderLiveH5() {
                document.title = "在线查阅系统";
                const container = document.getElementById('mobile-live-container');
                const urlParams = new URLSearchParams(window.location.search);
                const blockId = urlParams.get('id');
                
                let targetBlocks = this.state.blocks;
                if (blockId) {
                    targetBlocks = this.state.blocks.filter(b => b.id === blockId);
                }

                if (targetBlocks.length === 0) {
                    container.innerHTML = `
                        <div class="text-center mt-32 text-gray-400 flex flex-col items-center">
                            <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-6 shadow-inner">
                                <i class="fas fa-link-slash text-5xl text-gray-300"></i>
                            </div>
                            <p class="font-black text-xl text-gray-600 tracking-widest">内容已失效或不存在</p>
                            <p class="text-sm mt-3 font-medium">管理员可能已下线该资源文件</p>
                        </div>
                    `;
                    return;
                }
                
                let html = `
                    <div class="w-full flex justify-center py-5">
                        <div class="w-14 h-1.5 bg-gray-300 rounded-full opacity-60"></div>
                    </div>
                    <div class="px-4 flex flex-col gap-5">
                `;
                
                targetBlocks.forEach(block => { 
                    html += this.generateBlockHtml(block, true); 
                });
                
                html += `
                    </div>
                    <p class="text-center text-xs text-gray-300 mt-10 mb-8 tracking-widest uppercase font-bold">THE END</p>
                    
                    <div class="fixed bottom-0 left-0 w-full p-4 pb-8 bg-white/90 backdrop-blur-2xl border-t border-gray-100 z-30 shadow-[0_-10px_40px_rgba(0,0,0,0.06)]">
                        <button id="btn-batch-download" onclick="app.downloadAllFiles()" class="w-full max-w-lg mx-auto bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-4 rounded-2xl shadow-[0_6px_20px_rgba(30,144,255,0.35)] hover:shadow-[0_8px_30px_rgba(30,144,255,0.45)] hover:-translate-y-1 transition-all font-bold flex items-center justify-center text-[16px] tracking-wide active:scale-95">
                            <i class="fas fa-cloud-download-alt mr-2.5 text-xl"></i> 一键极速下载查阅资源
                        </button>
                    </div>
                `;
                container.innerHTML = html;
            }
        };

        // 强力挂载确保不漏过上下文
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
