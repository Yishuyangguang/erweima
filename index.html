<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>动态活码生成与管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E90FF',
                        secondary: '#F3F4F6',
                        dark: '#111827',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'float': '0 10px 25px -5px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #F8FAFC; color: #333; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .drag-active { border-color: #1E90FF !important; background-color: #EBF5FF !important; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .block-animate { animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        /* 隐藏管理员元素的 CSS 类 */
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: flex !important; }
        body.is-admin .admin-only-block { display: block !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4" id="drop-zone">

    <!-- 顶部导航栏 (追加了“已上传”按钮) -->
    <header class="w-full max-w-6xl flex justify-center gap-4 mb-8 flex-wrap">
        <button onclick="app.setMode('text')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary active-nav">文本</button>
        <button onclick="app.setMode('url')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">网址</button>
        <button onclick="app.setMode('image')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">图片</button>
        <button onclick="app.setMode('audio')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">音频</button>
        <button onclick="app.setMode('video')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">视频</button>
        <button onclick="app.setMode('document')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">文档</button>
        <button onclick="app.setMode('form')" class="nav-btn bg-white px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-gray-600 hover:text-primary">表单</button>
        <button onclick="app.setMode('uploaded')" class="nav-btn bg-blue-50 border border-blue-100 px-6 py-2 rounded-full shadow-sm hover:shadow-md transition-all text-primary font-semibold flex items-center admin-only"><i class="fas fa-cloud text-sm mr-2"></i>已上传</button>
    </header>

    <!-- 核心工作区 -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左侧区域 (占据 2/3) -->
        <section class="lg:col-span-2 flex flex-col gap-4 relative">
            
            <!-- 游客模式提示蒙版 -->
            <div id="tourist-mask" class="absolute inset-0 bg-white/60 backdrop-blur-[2px] z-20 flex flex-col items-center justify-center rounded-2xl">
                <i class="fas fa-lock text-4xl text-gray-300 mb-4"></i>
                <h3 class="text-lg font-semibold text-gray-700">游客访问模式</h3>
                <p class="text-sm text-gray-500 mt-2 text-center px-8">您当前处于只读模式。仅能扫描右侧二维码并浏览实时内容。<br>若需编辑、上传或删减内容，请在右下角进行管理员登录。</p>
                <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="mt-6 bg-primary text-white px-6 py-2 rounded-full shadow-lg hover:bg-blue-600 transition-all">管理员登录</button>
            </div>

            <!-- 输入/上传面板 -->
            <div id="input-panel" class="bg-white rounded-2xl shadow-soft p-6 relative border-2 border-dashed border-transparent transition-all admin-only-block">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="panel-title" class="text-lg font-semibold text-gray-700"><i class="fas fa-keyboard text-primary mr-2"></i>添加文本</h2>
                    <span class="text-xs text-gray-400">支持拖拽、粘贴直接添加</span>
                </div>
                
                <!-- 动态输入区，由 JS 渲染 -->
                <div id="dynamic-input-area" class="w-full min-h-[120px]"></div>
                
                <div class="flex justify-between items-center mt-4">
                    <p class="text-xs text-gray-400" id="panel-hint">文字长度无限制，扫码即刻展示最新内容</p>
                    <button id="btn-add-block" onclick="app.addCurrentBlock()" class="bg-primary text-white px-6 py-2 rounded-full hover:bg-blue-600 hover:shadow-lg hover:-translate-y-0.5 transition-all focus:outline-none">添加到内容组合</button>
                </div>
            </div>

            <!-- 组合内容展示栈 (实时预览) -->
            <div class="bg-white rounded-2xl shadow-soft p-6 min-h-[300px]">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="text-md font-semibold text-gray-700">当前在线组合内容 (扫码呈现)</h3>
                    <button onclick="app.syncToCloud()" class="admin-only bg-green-500 text-white px-4 py-1.5 text-sm rounded hover:bg-green-600 transition-all shadow"><i class="fas fa-rotate mr-1"></i> 发布至前端</button>
                </div>
                <div id="blocks-container" class="flex flex-col gap-4 w-full">
                    <!-- 空状态提示 -->
                    <div id="empty-state" class="flex flex-col items-center justify-center h-40 text-gray-400">
                        <i class="fas fa-layer-group text-4xl mb-3 opacity-50"></i>
                        <p class="text-sm">暂无内容，等待管理员配置</p>
                    </div>
                </div>
            </div>
            
        </section>

        <!-- 右侧二维码预览区 (占据 1/3) -->
        <aside class="w-full flex flex-col gap-4 relative">
            <div class="bg-white rounded-2xl shadow-soft p-8 flex flex-col items-center sticky top-8">
                
                <!-- 移除了 AI 艺术码相关 UI，保持界面纯净 -->

                <!-- 二维码渲染容器 -->
                <div id="qrcode-container" class="w-56 h-56 bg-gray-50 flex items-center justify-center rounded-2xl mb-6 relative overflow-hidden transition-all shadow-inner mt-4">
                    <i id="qr-placeholder" class="fas fa-qrcode text-6xl text-gray-200"></i>
                    <div id="qrcode" class="z-10 relative"></div>
                </div>
                
                <p class="text-sm text-gray-500 mb-6 text-center" id="qr-status">此处扫描活码进入 H5 页面<br><span class="text-xs text-gray-400">(后端内容实时更新，二维码图案永久不变)</span></p>

                <div class="flex gap-3 w-full">
                    <button onclick="app.downloadQR()" class="flex-1 border-2 border-primary text-primary px-4 py-2 rounded-full hover:bg-blue-50 transition-all font-medium flex items-center justify-center">
                        <i class="fas fa-download mr-2"></i> 存为图片
                    </button>
                    <button onclick="app.generateShareLink()" class="flex-1 bg-primary text-white px-4 py-2 rounded-full hover:bg-blue-600 shadow hover:shadow-lg transition-all font-medium flex items-center justify-center">
                        <i class="fas fa-share-nodes mr-2"></i> 复制链接
                    </button>
                </div>
            </div>
        </aside>
    </main>

    <!-- 管理员悬浮按钮与模态框 -->
    <button onclick="document.getElementById('login-modal').classList.remove('hidden')" id="admin-float-btn" class="fixed bottom-6 right-6 w-12 h-12 bg-gray-800 text-white rounded-full shadow-xl flex items-center justify-center hover:bg-gray-700 transition-all z-50">
        <i class="fas fa-user-shield"></i>
    </button>
    <button onclick="app.logout()" id="logout-float-btn" class="admin-only fixed bottom-6 right-6 w-12 h-12 bg-red-500 text-white rounded-full shadow-xl items-center justify-center hover:bg-red-600 transition-all z-50">
        <i class="fas fa-sign-out-alt"></i>
    </button>

    <div id="login-modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 w-80 shadow-2xl transform transition-all">
            <h3 class="text-lg font-semibold mb-4 text-center">系统后台登录</h3>
            <input type="password" id="admin-pwd" class="w-full p-2 border rounded mb-4 focus:ring-2 focus:ring-primary outline-none" placeholder="请输入管理员密码">
            <div class="flex justify-between gap-3">
                <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="flex-1 px-4 py-2 bg-gray-100 text-gray-600 rounded hover:bg-gray-200">取消</button>
                <button onclick="app.login()" class="flex-1 px-4 py-2 bg-primary text-white rounded hover:bg-blue-600">验证</button>
            </div>
        </div>
    </div>

    <!-- 全屏文档/多媒体预览模态框 -->
    <div id="preview-modal" class="fixed inset-0 bg-black/80 z-[200] hidden flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="absolute top-4 right-4 flex gap-4">
            <button onclick="app.closePreview()" class="text-white hover:text-gray-300 text-3xl"><i class="fas fa-times"></i></button>
        </div>
        <div id="preview-content" class="w-11/12 h-5/6 bg-white rounded-xl overflow-hidden flex items-center justify-center relative">
            <!-- 内容由 JS 动态注入 -->
        </div>
    </div>

    <!-- 前端核心架构与业务逻辑 (JavaScript) -->
    <script>
        const app = {
            state: {
                currentMode: 'text', 
                blocks: [], // 远端同步的内容流
                isAdmin: false,
                token: sessionStorage.getItem('adminToken') || '',
                // 生成当前URL加参数 /?view=live 作为活码地址
                liveUrl: window.location.origin + window.location.pathname + '?view=live'
            },

            configs: {
                text: { icon: 'fa-keyboard', title: '添加文本', hint: '文字长度无限制，扫码即刻展示最新内容', accept: null },
                url: { icon: 'fa-link', title: '添加网址', hint: '扫码后自动跳转或展示超链接', accept: null },
                image: { icon: 'fa-image', title: '添加图片', hint: '支持 png, jpg, gif 等，直接拖拽至此', accept: 'image/png, image/jpeg, image/gif, image/bmp, image/webp' },
                audio: { icon: 'fa-music', title: '添加音频', hint: '支持 mp3, wav，扫码在线播放无广告', accept: 'audio/mpeg, audio/wav' },
                video: { icon: 'fa-video', title: '添加视频', hint: '支持 mp4 等，高清流畅', accept: 'video/mp4, video/webm, video/ogg' },
                document: { icon: 'fa-file-word', title: '添加文档', hint: '支持 Word/PPT/PDF/Excel 等转换在线预览', accept: '.doc,.docx,.ppt,.pptx,.xls,.xlsx,.pdf,.wps' },
                form: { icon: 'fa-list-check', title: '添加表单', hint: '无纸化登记、报名预约、信息收集', accept: null },
                uploaded: { icon: 'fa-cloud', title: '已上传资源', hint: '云端已保存的所有资源列表', accept: null }
            },

            async init() {
                // 检查是否为游客 H5 专属渲染页 (带 ?view=live 参数)
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('view') === 'live') {
                    document.body.innerHTML = '<div class="p-4 flex flex-col gap-4 max-w-lg mx-auto" id="mobile-live-container"></div>';
                    await this.fetchCloudConfig();
                    this.renderLiveH5();
                    return;
                }

                // 正常进入控制台模式
                if (this.state.token) {
                    await this.verifyTokenSilent();
                } else {
                    this.enforceTouristMode();
                }

                this.bindDragAndDrop();
                this.bindPasteEvent();
                this.updateNavUI();
                this.renderInputArea();
                
                // 从云端加载当前配置并渲染二维码
                await this.fetchCloudConfig();
                this.renderQR(); 
            },

            // ================= 鉴权与安全 =================
            async login() {
                const pwd = document.getElementById('admin-pwd').value;
                try {
                    const res = await fetch('/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: pwd })
                    });
                    if (res.ok) {
                        this.state.token = pwd;
                        sessionStorage.setItem('adminToken', pwd);
                        document.getElementById('login-modal').classList.add('hidden');
                        this.enableAdminMode();
                        alert('登录成功，已开放修改权限。');
                    } else {
                        alert('密码错误');
                    }
                } catch (e) {
                    alert('网络异常或后端未部署');
                }
            },

            async verifyTokenSilent() {
                try {
                    const res = await fetch('/api/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: this.state.token })
                    });
                    if (res.ok) this.enableAdminMode();
                    else this.enforceTouristMode();
                } catch (e) {
                    this.enforceTouristMode();
                }
            },

            logout() {
                this.state.token = '';
                sessionStorage.removeItem('adminToken');
                this.enforceTouristMode();
                alert('已退出管理模式');
            },

            enableAdminMode() {
                this.state.isAdmin = true;
                document.body.classList.add('is-admin');
                document.getElementById('tourist-mask').classList.add('hidden');
                document.getElementById('admin-float-btn').classList.add('hidden');
                if(this.state.currentMode === 'uploaded') this.renderInputArea(); // 刷新已上传列表
            },

            enforceTouristMode() {
                this.state.isAdmin = false;
                document.body.classList.remove('is-admin');
                document.getElementById('tourist-mask').classList.remove('hidden');
                document.getElementById('admin-float-btn').classList.remove('hidden');
            },

            // ================= 核心接口与 R2 交互 =================
            async fetchCloudConfig() {
                try {
                    const res = await fetch('/api/config');
                    if (res.ok) {
                        const data = await res.json();
                        this.state.blocks = Array.isArray(data) ? data : [];
                        this.renderBlocks();
                    }
                } catch (e) {
                    console.log('读取配置失败，可能为首次运行', e);
                }
            },

            async syncToCloud() {
                if (!this.state.isAdmin) return alert('权限不足');
                try {
                    const btn = document.querySelector('button[onclick="app.syncToCloud()"]');
                    const oldText = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> 正在发布';
                    
                    const res = await fetch('/api/config', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${this.state.token}`
                        },
                        body: JSON.stringify(this.state.blocks)
                    });
                    
                    if (res.ok) {
                        btn.innerHTML = '<i class="fas fa-check mr-1"></i> 发布成功';
                        btn.classList.replace('bg-green-500', 'bg-blue-500');
                        setTimeout(() => {
                            btn.innerHTML = oldText;
                            btn.classList.replace('bg-blue-500', 'bg-green-500');
                        }, 2000);
                    } else {
                        throw new Error('同步失败');
                    }
                } catch (e) {
                    alert('发布失败，请检查网络或登录状态');
                }
            },

            async uploadFileToBackend(file) {
                if (!this.state.isAdmin) return null;
                
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const res = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${this.state.token}` },
                        body: formData
                    });
                    
                    if (res.ok) {
                        const data = await res.json();
                        return data; // { url, name, size, message }
                    } else {
                        alert('上传被拒，可能 token 失效');
                        return null;
                    }
                } catch (e) {
                    alert('上传失败，请检查后台配置');
                    return null;
                }
            },

            // ================= 页面 UI 交互 =================
            setMode(mode) {
                this.state.currentMode = mode;
                this.updateNavUI();
                this.renderInputArea();
            },

            updateNavUI() {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('ring-2', 'ring-primary/20', 'bg-blue-50');
                    if(btn.innerText.toLowerCase().includes(this.configs[this.state.currentMode].title.substring(2))) {
                        btn.classList.add('ring-2', 'ring-primary/20', 'bg-blue-50');
                    }
                });
                
                const cfg = this.configs[this.state.currentMode];
                const titleEl = document.getElementById('panel-title');
                const hintEl = document.getElementById('panel-hint');
                const btnEl = document.getElementById('btn-add-block');
                
                if(titleEl) titleEl.innerHTML = `<i class="fas ${cfg.icon} text-primary mr-2"></i>${cfg.title}`;
                if(hintEl) hintEl.innerText = cfg.hint;
                
                if (btnEl) {
                    if (this.state.currentMode === 'uploaded') {
                        btnEl.style.display = 'none';
                    } else {
                        btnEl.style.display = 'block';
                    }
                }
            },

            renderInputArea() {
                if (!this.state.isAdmin && this.state.currentMode === 'uploaded') return;

                const area = document.getElementById('dynamic-input-area');
                const mode = this.state.currentMode;
                const cfg = this.configs[mode];

                if (mode === 'text' || mode === 'url') {
                    area.innerHTML = `<textarea id="input-data" class="w-full h-32 p-3 bg-gray-50 rounded-xl border-none outline-none resize-none focus:ring-2 focus:ring-primary/50 transition-all text-gray-700" placeholder="${mode === 'url' ? '请输入以 http:// 或 https:// 开头的网址' : '请输入任意文字，支持多段落组合...'}"></textarea>`;
                } else if (mode === 'form') {
                    area.innerHTML = `
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 flex flex-col gap-2">
                            <input type="text" id="form-title" class="w-full p-2 rounded bg-white border-none focus:ring-1 focus:ring-primary text-sm" placeholder="表单标题 (例如：访客登记表)">
                            <p class="text-xs text-gray-400 mt-2">注：生成一张包含标准姓名/电话/留言字段的通用收集表单</p>
                        </div>
                    `;
                } else if (mode === 'uploaded') {
                    area.innerHTML = `
                        <div class="w-full max-h-60 overflow-y-auto pr-2 no-scrollbar">
                            <p class="text-sm text-gray-500 mb-2 border-b pb-2">以下是已上传后台并加入组合的全部文件/内容列表：</p>
                            <ul class="flex flex-col gap-2" id="uploaded-list">
                                ${this.state.blocks.map(b => `
                                    <li class="flex justify-between items-center bg-gray-50 p-2 rounded text-sm border">
                                        <span class="truncate w-4/5">${b.type === 'text'||b.type==='url' ? b.content.substring(0,30)+'...' : (b.content.name || b.content.title)}</span>
                                        <span class="text-xs px-2 py-1 bg-gray-200 rounded text-gray-600">${b.type}</span>
                                    </li>
                                `).join('') || '<li class="text-xs text-gray-400">目前云端没有任何记录</li>'}
                            </ul>
                        </div>
                    `;
                } else {
                    area.innerHTML = `
                        <div id="upload-drop-ui" class="relative w-full h-32 bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center hover:bg-gray-100 hover:border-primary transition-all group">
                            <input type="file" id="input-data-file" accept="${cfg.accept}" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="app.handleFileSelect(event)">
                            <i class="fas fa-cloud-arrow-up text-3xl text-gray-400 group-hover:text-primary transition-colors mb-2"></i>
                            <p class="text-sm text-gray-500"><span class="text-primary font-medium">点击选择文件</span> 或直接拖拽</p>
                        </div>
                        <div id="upload-progress-ui" class="hidden w-full h-32 bg-blue-50 rounded-xl border-2 border-primary flex flex-col items-center justify-center">
                            <i class="fas fa-spinner fa-spin text-3xl text-primary mb-2"></i>
                            <p class="text-sm text-primary font-medium" id="upload-status-text">安全数据传输中...</p>
                        </div>
                    `;
                }
            },

            // ================= 文件处理与拖拽机制 =================
            async handleFileSelect(event) {
                if (!this.state.isAdmin) return;
                const files = event.target.files || event.dataTransfer.files;
                if (!files || files.length === 0) return;
                
                const dropUI = document.getElementById('upload-drop-ui');
                const progressUI = document.getElementById('upload-progress-ui');
                const statusText = document.getElementById('upload-status-text');
                
                if (dropUI) dropUI.classList.add('hidden');
                if (progressUI) progressUI.classList.remove('hidden');

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (statusText) statusText.innerText = `正在处理: ${file.name}`;
                    
                    const uploadResult = await this.uploadFileToBackend(file);
                    
                    if (uploadResult && uploadResult.success) {
                        if (statusText) statusText.innerText = uploadResult.message; // 显示“已上传后台”
                        
                        let type = 'document';
                        if (file.type.startsWith('image/')) type = 'image';
                        else if (file.type.startsWith('audio/')) type = 'audio';
                        else if (file.type.startsWith('video/')) type = 'video';
                        else type = 'document';

                        this.addBlockToState(type, {
                            url: uploadResult.url,
                            name: uploadResult.name,
                            size: (uploadResult.size / 1024 / 1024).toFixed(2) + ' MB'
                        });
                    }
                }
                
                setTimeout(() => {
                    if (dropUI) dropUI.classList.remove('hidden');
                    if (progressUI) progressUI.classList.add('hidden');
                }, 1000);
            },

            bindDragAndDrop() {
                const dropZone = document.getElementById('drop-zone');
                const panel = document.getElementById('input-panel');

                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, e => e.preventDefault(), false);
                });

                ['dragenter', 'dragover'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => {
                        if(this.state.isAdmin) panel.classList.add('drag-active');
                    }, false);
                });

                ['dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => panel.classList.remove('drag-active'), false);
                });

                dropZone.addEventListener('drop', (e) => {
                    const files = e.dataTransfer.files;
                    if(files.length > 0 && this.state.isAdmin) this.handleFileSelect(e);
                }, false);
            },

            bindPasteEvent() {
                document.addEventListener('paste', (e) => {
                    if (!this.state.isAdmin) return;
                    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                    for (let index in items) {
                        const item = items[index];
                        if (item.kind === 'file') {
                            const blob = item.getAsFile();
                            // 构造一个File对象包装器，使其可以通过上传流
                            const file = new File([blob], "paste_image_" + Date.now() + ".png", {type: blob.type});
                            this.handleFileSelect({ target: { files: [file] } });
                        }
                    }
                });
            },

            addCurrentBlock() {
                if (!this.state.isAdmin) return;
                const mode = this.state.currentMode;
                
                if (mode === 'text' || mode === 'url') {
                    const val = document.getElementById('input-data').value.trim();
                    if (!val) return alert('内容不能为空');
                    this.addBlockToState(mode, val);
                    document.getElementById('input-data').value = '';
                } else if (mode === 'form') {
                    const title = document.getElementById('form-title').value.trim() || '通用信息登记表';
                    this.addBlockToState('form', { title: title, fieldCount: 3 });
                    document.getElementById('form-title').value = '';
                } else {
                    alert('对于媒体文件，请直接点击选择或拖拽进入虚线框内完成自动上传');
                }
            },

            addBlockToState(type, content) {
                const newBlock = {
                    id: 'block_' + Date.now() + '_' + Math.floor(Math.random()*1000),
                    type: type,
                    content: content
                };
                this.state.blocks.push(newBlock);
                this.renderBlocks();
                // 如果当前在已上传面板，顺便更新它
                if (this.state.currentMode === 'uploaded') this.renderInputArea();
            },

            removeBlock(id) {
                if (!this.state.isAdmin) return;
                this.state.blocks = this.state.blocks.filter(b => b.id !== id);
                this.renderBlocks();
                if (this.state.currentMode === 'uploaded') this.renderInputArea();
            },

            // ================= 渲染器逻辑 (DOM与文档解析引擎) =================
            escapeHtml(unsafe) {
                return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            },

            // 基于后缀判断如何预览31种文档
            openDocumentPreview(url, name) {
                const ext = name.split('.').pop().toLowerCase();
                // 拼接绝对地址给 Office 服务
                const absoluteUrl = url.startsWith('http') ? url : (window.location.origin + url);
                const contentBox = document.getElementById('preview-content');
                
                document.getElementById('preview-modal').classList.remove('hidden');

                if (ext === 'pdf') {
                    contentBox.innerHTML = `<iframe src="${url}" class="w-full h-full border-none"></iframe>`;
                } else if (['doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx'].includes(ext)) {
                    // 使用微软官方公共解析服务
                    contentBox.innerHTML = `<iframe src="https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(absoluteUrl)}" class="w-full h-full border-none"></iframe>`;
                } else if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                    contentBox.innerHTML = `<img src="${url}" class="max-w-full max-h-full object-contain">`;
                } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
                    contentBox.innerHTML = `<video src="${url}" controls autoplay class="max-w-full max-h-full"></video>`;
                } else {
                    contentBox.innerHTML = `<div class="text-center"><i class="fas fa-file text-6xl text-gray-300 mb-4"></i><p class="text-gray-600">无法在浏览器中直接预览此格式。</p><a href="${url}" download class="mt-4 inline-block bg-primary text-white px-6 py-2 rounded">下载文件</a></div>`;
                }
            },

            closePreview() {
                document.getElementById('preview-modal').classList.add('hidden');
                document.getElementById('preview-content').innerHTML = ''; // 清除以停止播放音视频
            },

            generateBlockHtml(block, isLive = false) {
                let contentHtml = '';
                const baseClass = isLive ? 'w-full mb-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100' : 'flex-1';
                
                switch (block.type) {
                    case 'text':
                        contentHtml = `<div class="${baseClass}"><p class="text-gray-700 whitespace-pre-wrap">${this.escapeHtml(block.content)}</p></div>`;
                        break;
                    case 'url':
                        contentHtml = `<div class="${baseClass}"><a href="${this.escapeHtml(block.content)}" target="_blank" class="text-blue-500 underline flex items-center"><i class="fas fa-external-link-alt mr-2"></i> ${this.escapeHtml(block.content)}</a></div>`;
                        break;
                    case 'image':
                        contentHtml = `<div class="${baseClass}"><img src="${block.content.url}" class="w-full rounded-lg cursor-pointer" onclick="app.openDocumentPreview('${block.content.url}', '${block.content.name}')"></div>`;
                        break;
                    case 'audio':
                        contentHtml = `<div class="${baseClass} flex flex-col"><span class="text-sm font-medium text-gray-700 mb-2 truncate">${block.content.name}</span><audio controls src="${block.content.url}" class="w-full outline-none"></audio></div>`;
                        break;
                    case 'video':
                        contentHtml = `<div class="${baseClass}"><video src="${block.content.url}" controls class="w-full rounded-lg bg-black"></video></div>`;
                        break;
                    case 'document':
                        contentHtml = `
                            <div class="${baseClass} flex items-center bg-gray-50 border border-gray-200">
                                <div class="w-12 h-12 bg-red-50 text-red-500 rounded flex items-center justify-center mr-3 flex-shrink-0"><i class="fas fa-file-alt text-2xl"></i></div>
                                <div class="flex flex-col flex-1 truncate mr-2">
                                    <span class="text-sm font-medium text-gray-700 truncate">${block.content.name}</span>
                                    <span class="text-xs text-gray-400">${block.content.size}</span>
                                </div>
                                <div class="flex gap-2 flex-shrink-0">
                                    <button onclick="app.openDocumentPreview('${block.content.url}', '${block.content.name}')" class="text-xs bg-white border border-gray-300 px-3 py-1.5 rounded text-gray-700 hover:text-primary transition-all shadow-sm">预览</button>
                                    <a href="${block.content.url}" download class="text-xs bg-primary text-white px-3 py-1.5 rounded hover:bg-blue-600 transition-all shadow-sm"><i class="fas fa-download"></i></a>
                                </div>
                            </div>
                        `;
                        break;
                    case 'form':
                        contentHtml = `
                            <div class="${baseClass} border-2 border-dashed border-indigo-100 bg-indigo-50/30">
                                <h4 class="font-semibold text-indigo-800 mb-3 text-center">${this.escapeHtml(block.content.title)}</h4>
                                <input type="text" placeholder="姓名" class="w-full p-2 mb-2 border rounded outline-none text-sm">
                                <input type="tel" placeholder="联系电话" class="w-full p-2 mb-2 border rounded outline-none text-sm">
                                <textarea placeholder="留言内容" class="w-full p-2 mb-2 border rounded outline-none text-sm h-16"></textarea>
                                <button class="w-full bg-indigo-500 text-white py-2 rounded text-sm hover:bg-indigo-600">提交登记</button>
                            </div>
                        `;
                        break;
                }
                return contentHtml;
            },

            renderBlocks() {
                const container = document.getElementById('blocks-container');
                const empty = document.getElementById('empty-state');
                if(!container) return; // 移动端Live模式拦截
                
                if (this.state.blocks.length === 0) {
                    empty.style.display = 'flex';
                    container.innerHTML = '';
                    container.appendChild(empty);
                    return;
                }

                empty.style.display = 'none';
                container.innerHTML = '';
                
                this.state.blocks.forEach((block) => {
                    const blockEl = document.createElement('div');
                    blockEl.className = 'block-animate bg-white border border-gray-100 rounded-xl p-3 flex items-center justify-between group relative shadow-sm';
                    
                    const contentHtml = this.generateBlockHtml(block, false);

                    blockEl.innerHTML = `
                        <div class="flex items-center w-full">
                            <div class="mr-3 cursor-move text-gray-200 hover:text-gray-400 admin-only"><i class="fas fa-grip-vertical"></i></div>
                            ${contentHtml}
                        </div>
                        <button onclick="app.removeBlock('${block.id}')" class="admin-only w-8 h-8 rounded-full bg-red-50 text-red-500 items-center justify-center opacity-0 group-hover:opacity-100 transition-all hover:bg-red-500 hover:text-white absolute right-4 shadow">
                            <i class="fas fa-trash-alt text-sm"></i>
                        </button>
                    `;
                    container.appendChild(blockEl);
                });
            },

            renderQR() {
                const qrContainer = document.getElementById('qrcode');
                const placeholder = document.getElementById('qr-placeholder');
                
                qrContainer.innerHTML = '';
                placeholder.style.display = 'none';

                new QRCode(qrContainer, {
                    text: this.state.liveUrl,
                    width: 200,
                    height: 200,
                    colorDark : "#111827",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.M
                });

                setTimeout(() => {
                    const canvas = qrContainer.querySelector('canvas');
                    if(canvas) {
                        canvas.style.borderRadius = '0.75rem';
                        canvas.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)';
                    }
                }, 50);
            },

            renderLiveH5() {
                // 仅限移动端扫码访问，纯净流式阅读布局
                document.title = "扫码内容浏览";
                const container = document.getElementById('mobile-live-container');
                if (this.state.blocks.length === 0) {
                    container.innerHTML = '<div class="text-center mt-20 text-gray-400"><i class="fas fa-box-open text-5xl mb-4"></i><p>管理员未发布任何内容</p></div>';
                    return;
                }

                let html = '<div class="w-full flex justify-center py-4"><i class="fas fa-fingerprint text-3xl text-gray-200"></i></div>';
                this.state.blocks.forEach(block => {
                    html += this.generateBlockHtml(block, true);
                });
                
                html += '<p class="text-center text-xs text-gray-300 mt-8 mb-4">- 到底了 -</p>';
                container.innerHTML = html;
            },

            downloadQR() {
                const canvas = document.querySelector('#qrcode canvas');
                if(!canvas) return;
                const a = document.createElement('a');
                a.download = `活码_${new Date().getTime()}.png`;
                a.href = canvas.toDataURL("image/png");
                a.click();
            },

            generateShareLink() {
                navigator.clipboard.writeText(this.state.liveUrl).then(() => {
                    const btn = event.currentTarget;
                    const oldHtml = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check mr-2"></i> 已复制';
                    btn.classList.replace('bg-primary', 'bg-green-500');
                    setTimeout(() => {
                        btn.innerHTML = oldHtml;
                        btn.classList.replace('bg-green-500', 'bg-primary');
                    }, 2000);
                }).catch(() => {
                    alert('复制失败，链接为: ' + this.state.liveUrl);
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
