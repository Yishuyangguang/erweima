<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活码数据统计中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#1E90FF', dark: '#111827' } }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #F8FAFC; color: #333; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 relative">

    <header class="w-full max-w-[1200px] flex justify-between items-center mb-8 px-4 mx-auto">
        <h1 class="text-2xl font-black text-gray-800 tracking-wide flex items-center">
            <i class="fas fa-chart-pie text-primary mr-3"></i>全域数据中心
        </h1>
        <div class="flex gap-4">
            <a href="index.html" class="text-gray-500 hover:text-primary font-bold transition-colors bg-white px-5 py-2 rounded-full shadow-sm">返回工作台</a>
            <button onclick="statsApp.logout()" class="bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-all px-5 py-2 rounded-full font-bold shadow-sm">退出</button>
        </div>
    </header>

    <main class="w-full max-w-[1200px] mx-auto px-4">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 min-h-[500px]">
            <div class="flex justify-between items-center border-b border-gray-100 pb-5 mb-6">
                <div>
                    <h3 class="text-xl font-bold text-gray-800">扫码追踪看板</h3>
                    <p class="text-sm text-gray-400 mt-1">数据依托 Cloudflare 边缘节点实时解析</p>
                </div>
                <button onclick="statsApp.fetchData()" class="bg-primary text-white px-6 py-2.5 rounded-lg hover:bg-blue-600 transition-all font-bold shadow-sm">
                    <i class="fas fa-sync-alt mr-2"></i>刷新数据
                </button>
            </div>
            
            <div class="overflow-x-auto w-full">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-gray-400 text-sm uppercase tracking-wider border-b-2 border-gray-50">
                            <th class="pb-4 pl-2 font-bold w-1/3">活码内容 / 标题</th>
                            <th class="pb-4 font-bold w-1/6">类型</th>
                            <th class="pb-4 font-bold w-1/6">总扫码次数</th>
                            <th class="pb-4 font-bold">主流客源区域分布</th>
                        </tr>
                    </thead>
                    <tbody id="stats-tbody" class="text-gray-700">
                        <!-- 数据动态渲染区 -->
                    </tbody>
                </table>
            </div>
            <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-gray-400">
                <i class="fas fa-box-open text-5xl mb-4 opacity-30"></i>
                <p class="font-medium">暂无有效扫码数据</p>
            </div>
        </div>
    </main>

    <!-- 鉴权遮罩 -->
    <div id="auth-mask" class="fixed inset-0 bg-white/95 backdrop-blur-md z-50 flex flex-col items-center justify-center">
        <div class="bg-white border border-gray-100 rounded-3xl p-10 w-96 shadow-2xl flex flex-col items-center">
            <i class="fas fa-lock text-5xl text-primary mb-6"></i>
            <h3 class="text-2xl font-black mb-6 text-gray-800 tracking-wide">数据中心鉴权</h3>
            <input type="password" id="admin-pwd" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-primary/50 transition-all text-lg font-medium mb-6 text-center" placeholder="输入控制台密码">
            <button onclick="statsApp.login()" class="w-full py-4 bg-primary text-white rounded-xl hover:bg-blue-600 transition-all font-bold shadow-lg tracking-widest text-lg">解锁数据</button>
        </div>
    </div>

    <script>
        const statsApp = {
            token: sessionStorage.getItem('adminToken') || '',
            
            async init() {
                if (this.token) {
                    await this.verifyAndLoad();
                } else {
                    document.getElementById('auth-mask').classList.remove('hidden');
                }
            },

            async login() {
                const pwd = document.getElementById('admin-pwd').value;
                try {
                    const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
                    if (res.ok) {
                        this.token = pwd;
                        sessionStorage.setItem('adminToken', pwd);
                        await this.verifyAndLoad();
                    } else alert('密码错误');
                } catch (e) { alert('网络异常'); }
            },

            logout() {
                this.token = ''; sessionStorage.removeItem('adminToken');
                document.getElementById('auth-mask').classList.remove('hidden');
            },

            async verifyAndLoad() {
                try {
                    const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: this.token }) });
                    if (res.ok) {
                        document.getElementById('auth-mask').classList.add('hidden');
                        this.fetchData();
                    } else this.logout();
                } catch (e) { this.logout(); }
            },

            stripHtml(html) {
                let tmp = document.createElement("DIV"); tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || "";
            },

            async fetchData() {
                const tbody = document.getElementById('stats-tbody');
                const emptyState = document.getElementById('empty-state');
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-10 text-primary font-bold"><i class="fas fa-spinner fa-spin mr-2"></i>抽取数据中...</td></tr>';
                emptyState.classList.add('hidden');

                try {
                    // 并发获取配置清单与统计数据库
                    const [configRes, statsRes] = await Promise.all([
                        fetch('/api/config'),
                        fetch('/api/stats', { headers: { 'Authorization': `Bearer ${this.token}` } })
                    ]);
                    
                    const configs = await configRes.json();
                    const stats = await statsRes.json();

                    tbody.innerHTML = '';
                    
                    if (!configs || configs.length === 0) {
                        emptyState.classList.remove('hidden');
                        return;
                    }

                    let hasData = false;

                    // 倒序渲染，最新的模块在最前
                    configs.reverse().forEach(block => {
                        // 过滤掉静态链接 (因为不经过后端无从统计)
                        if (block.type === 'url' && block.content.isStatic) return;

                        hasData = true;
                        const blockStats = stats[block.id] || { total: 0, regions: {} };
                        
                        let title = '未知内容';
                        if (block.type === 'text') title = this.stripHtml(block.content).substring(0, 30) + '...';
                        else if (block.type === 'url') title = block.content.url || block.content;
                        else if (block.type === 'combo') title = block.content.title || '无标题图文组合';
                        else title = block.content.name || block.content.title || '文件资源';

                        // 解析高频区域
                        let regionHtml = '<span class="text-gray-300">暂无扫码痕迹</span>';
                        if (Object.keys(blockStats.regions).length > 0) {
                            const sortedRegions = Object.entries(blockStats.regions).sort((a, b) => b[1] - a[1]);
                            regionHtml = sortedRegions.map(r => `
                                <span class="inline-block bg-blue-50 text-blue-600 px-2.5 py-1 rounded text-xs font-bold mr-2 mb-1 border border-blue-100">
                                    ${r[0]} <span class="text-gray-400 ml-1">x${r[1]}</span>
                                </span>
                            `).join('');
                        }

                        const tr = document.createElement('tr');
                        tr.className = 'border-b border-gray-50 hover:bg-gray-50/50 transition-colors group';
                        tr.innerHTML = `
                            <td class="py-5 pl-2 font-bold text-gray-800 pr-4">
                                <div class="truncate max-w-[300px]" title="${title}">${title}</div>
                                <div class="text-[10px] text-gray-400 mt-1 font-normal select-all">ID: ${block.id}</div>
                            </td>
                            <td class="py-5"><span class="px-2.5 py-1 bg-gray-100 text-gray-600 rounded text-xs font-bold uppercase tracking-wider">${block.type}</span></td>
                            <td class="py-5">
                                <div class="flex items-center text-lg font-black ${blockStats.total > 0 ? 'text-primary' : 'text-gray-300'}">
                                    <i class="fas fa-qrcode mr-2 text-sm opacity-50"></i>${blockStats.total}
                                </div>
                            </td>
                            <td class="py-5 pr-2">${regionHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    if (!hasData) emptyState.classList.remove('hidden');

                } catch (e) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-10 text-red-500 font-bold">数据读取失败，请检查网络或R2连接。</td></tr>';
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => statsApp.init());
    </script>
</body>
</html>
